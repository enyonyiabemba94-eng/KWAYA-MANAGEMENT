<!doctype html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile ya Mwimbaji | KWAYA YA KRISTU MFALME</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./auth-guard.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f6fa;color:#1f2937}.top{background:#18122b;color:#fff;padding:16px}.bar{max-width:1100px;margin:auto;display:flex;align-items:center;gap:12px}.logo{width:46px;height:46px;border-radius:10px;object-fit:cover;background:#fff}.brand{flex:1}.brand b{display:block;font-size:14px}.brand small{font-size:10px;color:#ddd}.btn{border:0;border-radius:9px;padding:10px 13px;font-weight:800;cursor:pointer}.back{background:#fff;color:#4c1d95}.wrap{max-width:1100px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,#4c1d95,#7c3aed);color:#fff;border-radius:18px;padding:22px;display:flex;align-items:center;gap:18px}.photo{width:110px;height:110px;border-radius:50%;background:#ede9fe;color:#4c1d95;display:grid;place-items:center;font-size:38px;font-weight:900;overflow:hidden;border:4px solid #ffffff55;flex:none}.photo img{width:100%;height:100%;object-fit:cover}.hero h1{margin:0 0 6px;font-size:25px}.hero p{margin:4px 0;font-size:12px;color:#ede9fe}.pill{display:inline-block;margin:5px 5px 0 0;padding:6px 10px;border-radius:20px;background:#ffffff22;font-size:11px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:15px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:15px;padding:17px}.card h2{font-size:15px;margin:0 0 14px;border-bottom:1px solid #eee;padding-bottom:10px}.item{margin:10px 0}.item span{display:block;color:#6b7280;font-size:10px;text-transform:uppercase}.item b{display:block;margin-top:3px;font-size:13px}.wide{grid-column:1/-1}.sacr{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px;border:1px solid #eee;border-radius:10px;margin:8px 0;background:#faf9ff}.ok{color:#166534;font-weight:800}.no{color:#9ca3af;font-weight:800}.loading,.error{background:#fff;padding:18px;border-radius:12px}.error{color:#991b1b;background:#fee2e2}@media(max-width:750px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.hero{align-items:flex-start}.photo{width:85px;height:85px}.hero h1{font-size:20px}}@media print{.top .btn{display:none}.wrap{padding:0}.hero{color:#000;background:#fff;border:1px solid #ddd}.pill{color:#000;background:#eee}}</style></head><body><header class="top"><div class="bar"><img class="logo" src="https://raw.githubusercontent.com/enyonyiabemba94-eng/KWAYA-MANAGEMENT/main/KWAYA%20YA%20KRISTO%20MFALME%20NYARUGUSU%2020260902_141303.jpg"><div class="brand"><b>KWAYA YA KRISTU MFALME</b><small>MFUMO WA USIMAMIZI WA KWAYA</small></div><button class="btn back" onclick="location.href='members.html'">← Rudi</button></div></header><main class="wrap"><div id="app" class="loading">Inapakia profile...</div></main><script>const db=supabase.createClient('https://xulnkdrgjgajmcqntwga.supabase.co','sb_publishable_J2OrXvOnQXxrf5t3XPmigg_5ULrsWO2');const app=document.getElementById('app'),params=new URLSearchParams(location.search);const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]));const name=m=>[m.first_name,m.middle_name,m.last_name].filter(Boolean).join(' ')||'Mwimbaji';const date=v=>v?new Date(v+'T00:00:00').toLocaleDateString('sw-TZ',{day:'2-digit',month:'2-digit',year:'numeric'}):'—';const role=v=>v==='super_admin'?'Msimamizi Mkuu':v==='admin'?'Msimamizi':v==='member'?'Mwanachama':v||'—';async function load(){try{const s=(await db.auth.getSession()).data.session;if(!s){location.replace('login.html');return}let id=params.get('id')||params.get('member_id');if(!id){const p=await db.from('profiles').select('member_id').eq('id',s.user.id).maybeSingle();id=p.data?.member_id}if(!id){app.innerHTML='<div class="error">Profile haijafunguka: ID ya mwimbaji haijapatikana.</div>';return}const [mr,vr,br,cr,er,mar]=await Promise.all([db.from('members').select('*').eq('id',id).maybeSingle(),db.from('voice_parts').select('id,name').order('name'),db.from('baptism_records').select('*').eq('member_id',id).limit(1),db.from('confirmation_records').select('*').eq('member_id',id).limit(1),db.from('eucharist_records').select('*').eq('member_id',id).limit(1),db.from('marriage_records').select('*').eq('member_id',id).limit(1)]);if(mr.error||!mr.data){app.innerHTML='<div class="error">Mwimbaji hakupatikana.</div>';return}const m=mr.data,v=(vr.data||[]).find(x=>x.id===m.voice_part_id)?.name||'Sauti haijawekwa',b=br.data?.[0],c=cr.data?.[0],e=er.data?.[0],n=mar.data?.[0];const sac=[['Ubatizo',b?.baptism_date,b?.parish_church||b?.location],['Komunyo ya Kwanza',e?.eucharist_date,e?.parish_church||e?.location],['Kipaimara',c?.confirmation_date,c?.parish_church||c?.location],['Ndoa ya Kanisa',n?.marriage_date,n?.parish_church||n?.location]];app.innerHTML='<section class="hero"><div class="photo">'+(m.photo_url?'<img src="'+esc(m.photo_url)+'" alt="Picha ya mwimbaji">':esc((m.first_name||'?').charAt(0).toUpperCase()))+'</div><div><h1>'+esc(name(m))+'</h1><p>'+esc(m.phone||'Simu haijawekwa')+'</p><span class="pill">🎵 '+esc(v)+'</span><span class="pill">'+esc(role(m.choir_role))+'</span><span class="pill">'+esc(m.status||'active')+'</span></div></section><section class="grid"><div class="card"><h2>👤 Taarifa Binafsi</h2><div class="item"><span>Jinsia</span><b>'+esc(m.gender||'—')+'</b></div><div class="item"><span>Tarehe ya kuzaliwa</span><b>'+date(m.date_of_birth)+'</b></div><div class="item"><span>Mahali pa kuzaliwa</span><b>'+esc(m.place_of_birth||'—')+'</b></div></div><div class="card"><h2>📞 Mawasiliano</h2><div class="item"><span>Simu</span><b>'+esc(m.phone||'—')+'</b></div><div class="item"><span>Makazi</span><b>'+esc(m.residence||'—')+'</b></div><div class="item"><span>Barua pepe</span><b>'+esc(m.email||'—')+'</b></div></div><div class="card"><h2>🎵 Taarifa za Kwaya</h2><div class="item"><span>Sauti</span><b>'+esc(v)+'</b></div><div class="item"><span>Wajibu</span><b>'+esc(role(m.choir_role))+'</b></div><div class="item"><span>Tarehe ya kujiunga</span><b>'+date(m.joined_date)+'</b></div><div class="item"><span>Hali</span><b>'+esc(m.status||'—')+'</b></div></div><div class="card wide"><h2>⛪ Sakramenti</h2>'+sac.map(x=>'<div class="sacr"><div><b>'+esc(x[0])+'</b>'+(x[1]?'<br><small>'+date(x[1])+(x[2]?' • '+esc(x[2]):'')+'</small>':'<br><small>Haijasajiliwa</small>')+'</div><div class="'+(x[1]?'ok':'no')+'">'+(x[1]?'✓':'—')+'</div></div>').join('')+(n?.spouse_name?'<div class="item"><span>Mwenza wa ndoa</span><b>'+esc(n.spouse_name)+'</b></div>':'')+(m.sacrament_notes?'<div class="item"><span>Maelezo</span><b>'+esc(m.sacrament_notes)+'</b></div>':'')+'</div></section>'}catch(e){console.error(e);app.innerHTML='<div class="error">Hitilafu imetokea wakati wa kupakia profile.</div>'}}load();</script></body></html>
