<!doctype html><html lang="sw"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile ya Mwimbaji | KWAYA MANAGEMENT</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f6fa;color:#1f2937}.side{position:fixed;inset:0 auto 0 0;width:250px;background:#18122b;padding:18px 12px;color:#fff}.brand{padding:10px;border-bottom:1px solid #ffffff18;font-weight:800}.brand small{display:block;color:#b9aecf;font-size:10px;margin-top:4px}.nav{margin-top:18px}.nav a{display:block;color:#d9d3e5;text-decoration:none;padding:11px 13px;border-radius:9px;font-size:13px;margin:3px 0}.nav a:hover,.nav a.active{background:#8b5cf633;color:#fff}.main{margin-left:250px}.top{height:72px;background:#fff;border-bottom:1px solid #e5e7eb;padding:0 25px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}.top h1{margin:0;font-size:20px}.top small{color:#6b7280}.content{padding:25px;max-width:1200px;margin:auto}.back{display:inline-block;margin-bottom:15px;color:#6d28d9;text-decoration:none;font-weight:700;font-size:13px}.hero{background:linear-gradient(135deg,#24143f,#6d28d9);border-radius:18px;padding:25px;color:#fff;display:flex;gap:24px;align-items:center;box-shadow:0 10px 30px #24143f22}.photo{width:125px;height:125px;border-radius:50%;background:#eee9ff;color:#6d28d9;display:grid;place-items:center;font-size:42px;font-weight:800;overflow:hidden;flex:none;border:4px solid #fff8}.photo img{width:100%;height:100%;object-fit:cover}.hero h2{margin:0 0 7px;font-size:28px}.hero p{margin:4px 0;color:#ede9fe}.badge{display:inline-block;padding:6px 10px;border-radius:20px;background:#ffffff22;margin:5px 5px 0 0;font-size:11px;font-weight:700}.active{background:#dcfce7;color:#166534}.inactive{background:#fee2e2;color:#991b1b}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:15px;padding:18px}.card h3{font-size:14px;margin:0 0 15px;padding-bottom:10px;border-bottom:1px solid #eee}.info{display:grid;gap:12px}.item span{display:block;color:#6b7280;font-size:10px;text-transform:uppercase}.item b{display:block;font-size:13px;margin-top:3px}.wide{grid-column:1/-1}.timeline{display:grid;gap:10px}.event{border-left:3px solid #6d28d9;padding:8px 12px;background:#faf9ff;border-radius:0 9px 9px 0}.event b{font-size:12px}.event small{display:block;color:#6b7280;margin-top:3px}.empty{color:#6b7280;font-size:12px}.error{background:#fee2e2;color:#991b1b;padding:15px;border-radius:10px}.menu{display:none}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:700px){.side{transform:translateX(-100%);transition:.2s;z-index:10}.side.open{transform:none}.main{margin-left:0}.menu{display:inline-block;border:0;background:#f3f4f6;border-radius:8px;width:38px;height:38px;font-size:20px;margin-right:6px}.top{padding:0 15px}.content{padding:15px}.hero{padding:20px;gap:15px}.photo{width:90px;height:90px;font-size:30px}.hero h2{font-size:21px}.grid{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head><body><aside class="side" id="side"><div class="brand">🎶 KWAYA MANAGEMENT<small>Usimamizi wa Kwaya Kristo Mfalme</small></div><nav class="nav"><a href="index.html">🏠 Dashboard</a><a class="active" href="members.html">👥 Waimbaji</a><a href="attendance.html">📋 Mahudhurio</a><a href="songs.html">🎵 Nyimbo</a><a href="song-books.html">📚 Vitabu vya Nyimbo</a><a href="sacraments.html">⛪ Sakramenti</a><a href="reports.html">📊 Ripoti</a><a href="events.html">📅 Ratiba</a><a href="announcements.html">📢 Taarifa</a><a href="documents.html">📄 Nyaraka</a><a href="settings.html">⚙️ Mipangilio</a></nav></aside><main class="main"><header class="top"><div><button class="menu" onclick="side.classList.toggle('open')">☰</button><h1 style="display:inline">Profile ya Mwimbaji</h1><br><small>Taarifa kamili za mwanachama wa kwaya</small></div><a class="back" href="members.html">← Rudi kwa Waimbaji</a></header><section class="content" id="app"><div class="card">Inapakia taarifa...</div></section></main><script>const db=supabase.createClient('https://xulnkdrgjgajmcqntwga.supabase.co','sb_publishable_J2OrXvOnQXxrf5t3XPmigg_5ULrsWO2');const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]));const full=x=>[x.first_name,x.middle_name,x.last_name].filter(Boolean).join(' ');const fmt=d=>d?new Date(d+'T00:00:00').toLocaleDateString('sw-TZ',{day:'2-digit',month:'2-digit',year:'numeric'}):'—';const role={member:'Mwimbaji',leader:'Kiongozi',choir_teacher:'Mwalimu wa Kwaya',secretary:'Katibu',admin:'Admin'};const status={active:'Active',inactive:'Inactive'};function sac(title,r,date,place,extraLabel,extraValue){if(!r)return '<div class="item"><span>'+title+'</span><b>Haijawekwa</b></div>';let out='<div class="item"><span>'+title+'</span><b>'+fmt(date)+' — '+esc(place||'Mahali haijawekwa')+'</b></div>';if(extraValue)out+='<div class="item"><span>'+extraLabel+'</span><b>'+esc(extraValue)+'</b></div>';return out}async function load(){const id=new URLSearchParams(location.search).get('id');if(!id){$('app').innerHTML='<div class="error">Profile haikupatikana. Fungua profile kupitia orodha ya waimbaji.</div>';return}const [m,v,h,b,e,c,ma]=await Promise.all([db.from('members').select('*').eq('id',id).single(),db.from('voice_parts').select('*').order('sort_order'),db.from('member_voice_history').select('*, voice_parts(name)').eq('member_id',id).order('start_date',{ascending:false}),db.from('baptism_records').select('*').eq('member_id',id).maybeSingle(),db.from('eucharist_records').select('*').eq('member_id',id).maybeSingle(),db.from('confirmation_records').select('*').eq('member_id',id).maybeSingle(),db.from('marriage_records').select('*').eq('member_id',id).maybeSingle()]);if(m.error){$('app').innerHTML='<div class="error">'+esc(m.error.message)+'</div>';return}const x=m.data,voice=(v.data||[]).find(z=>z.id===x.voice_part_id),history=h.data||[];const photo=x.photo_url?'<img src="'+esc(x.photo_url)+'" alt="'+esc(full(x))+'">':esc((x.first_name||'?')[0]);$('app').innerHTML='<a class="back" href="members.html">← Orodha ya Waimbaji</a><div class="hero"><div class="photo">'+photo+'</div><div><h2>'+esc(full(x))+'</h2><p>'+(voice?esc(voice.name):'Nafasi ya sauti haijawekwa')+'</p><span class="badge">'+esc(role[x.choir_role]||x.choir_role||'Mwimbaji')+'</span><span class="badge '+(x.status==='active'?'active':'inactive')+'">'+esc(status[x.status]||x.status)+'</span></div></div><div class="grid"><div class="card"><h3>👤 Taarifa Binafsi</h3><div class="info">'+[['Jinsia',x.gender==='male'?'Mwanaume':x.gender==='female'?'Mwanamke':'—'],['Tarehe ya kuzaliwa',fmt(x.date_of_birth)],['Mahali pa kuzaliwa',x.place_of_birth],['Simu',x.phone],['Makazi',x.residence],['Tarehe ya kujiunga',fmt(x.joined_date)]].map(a=>'<div class="item"><span>'+a[0]+'</span><b>'+esc(a[1]||'—')+'</b></div>').join('')+'</div></div><div class="card"><h3>🎵 Nafasi ya Sauti</h3><div class="info"><div class="item"><span>Nafasi ya sasa</span><b>'+esc(voice?.name||'Haijawekwa')+'</b></div><div class="item"><span>Wadhifa wa Kwaya</span><b>'+esc(role[x.choir_role]||x.choir_role||'Mwimbaji')+'</b></div></div></div><div class="card"><h3>⛪ Sakramenti</h3><div class="info">'+sac('Ubatizo',b.data,b.data?.baptism_date,b.data?.parish_church||b.data?.location,'Baba/Mama wa Ubatizo',b.data?.father_name||b.data?.mother_name||b.data?.spiritual_parent_name)+sac('Ekaristi',e.data,e.data?.eucharist_date,e.data?.parish_church||e.data?.location)+sac('Kipaimara',c.data,c.data?.confirmation_date,c.data?.parish_church||c.data?.location)+sac('Ndoa',ma.data,ma.data?.marriage_date,ma.data?.parish_church||ma.data?.location,'Jina la Mwenza',ma.data?.spouse_name)+'</div></div><div class="card wide"><h3>🎼 Historia ya Nafasi ya Sauti</h3><div class="timeline">'+(history.length?history.map(r=>'<div class="event"><b>'+esc(r.voice_parts?.name||'Nafasi')+'</b><small>'+fmt(r.start_date)+' → '+(r.end_date?fmt(r.end_date):'Sasa')+(r.notes?' · '+esc(r.notes):'')+'</small></div>').join(''):'<div class="empty">Hakuna historia ya nafasi ya sauti iliyorekodiwa.</div>')+'</div></div><div class="card wide"><h3>📝 Maelezo</h3><div class="empty">'+esc(x.notes||'Hakuna maelezo yaliyowekwa.')+'</div></div></div>'}load();</script></body></html>
