<!doctype html>
<html lang="sw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mpango wa Misa | Kwaya ya Kristu Mfalme</title>
<style>
@media print{
  .printtitle{font-size:20pt!important}
  .printsub{font-size:17pt!important}
  .info{font-size:11pt!important}
  .conductor-print{display:block!important;visibility:visible!important;font-size:12pt!important;font-weight:800!important;margin:3mm 0 5mm!important;padding:2.5mm 0!important}
  .conductor-print *{font-size:12pt!important;visibility:visible!important}
  .psec{margin:3pt 0!important;break-inside:avoid!important;page-break-inside:avoid!important}
  .psec h4{font-size:13pt!important;margin:3pt 0!important}
  .psong{font-size:12pt!important;line-height:1.1!important;margin:1pt 0!important}
  .print-note{font-size:11pt!important}
  .sections-fixed.single-column{grid-template-columns:1fr!important}
  .sections-fixed.single-column .col-left{grid-column:1!important;width:100%!important}
  .sections-fixed.single-column .col-right{display:none!important}
  .sections-fixed:not(.single-column){grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;column-gap:8mm!important}
  .sections-fixed:not(.single-column) .col-left{grid-column:1!important}
  .sections-fixed:not(.single-column) .col-right{grid-column:2!important}
}
</style>
</head>
<body>
<script>
const BASE='https://raw.githubusercontent.com/enyonyiabemba94-eng/KWAYA-MANAGEMENT/70a392b58e479adde81562cd70999f4469947288/mass-programmes.html';
fetch(BASE).then(r=>r.text()).then(html=>{
  const css=`<style>@media print{.printtitle{font-size:20pt!important}.printsub{font-size:17pt!important}.info{font-size:11pt!important}.conductor-print{display:block!important;visibility:visible!important;font-size:12pt!important;font-weight:800!important;margin:3mm 0 5mm!important;padding:2.5mm 0!important}.conductor-print *{font-size:12pt!important;visibility:visible!important}.psec{margin:3pt 0!important;break-inside:avoid!important;page-break-inside:avoid!important}.psec h4{font-size:13pt!important;margin:3pt 0!important}.psong{font-size:12pt!important;line-height:1.1!important;margin:1pt 0!important}.print-note{font-size:11pt!important}.sections-fixed.single-column{grid-template-columns:1fr!important}.sections-fixed.single-column .col-left{grid-column:1!important;width:100%!important}.sections-fixed.single-column .col-right{display:none!important}.sections-fixed:not(.single-column){grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;column-gap:8mm!important}.sections-fixed:not(.single-column) .col-left{grid-column:1!important}.sections-fixed:not(.single-column) .col-right{grid-column:2!important}}</style>`;
  html=html.replace('</head>',css+'</head>');
  document.open();document.write(html);document.close();
}).catch(e=>{document.body.innerHTML='<p style="padding:20px;font-family:Arial">Imeshindikana kupakia Mpango wa Misa.</p>';console.error(e)});
</script>
</body>
</html>
