<!doctype html>
<html lang="sw">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mpango wa Misa | Kwaya ya Kristu Mfalme</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main><h1>Mpango wa Misa</h1><label>CONDUCTOR / WAONGOZA NYIMBO</label><div><input id="conductor" placeholder="Jina la conductor"><button type="button" id="addConductorBtn">＋ Ongeza</button></div><div id="conductors"></div><div id="preview"></div></main><script>
const db=supabase.createClient('https://xulnkdrgjgajmcqntwga.supabase.co','sb_publishable_J2OrXvOnQXxrf5t3XPmigg_5ULrsWO2');
let conductors=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function renderConductors(){ $('conductors').innerHTML=conductors.map((n,i)=>`<span class="chip">${esc(n)} <button type="button" onclick="removeConductor(${i})">×</button></span>`).join(''); }
function addConductor(){const input=$('conductor');const n=input.value.trim();if(!n)return;if(!conductors.includes(n))conductors.push(n);input.value='';renderConductors();showPreview();}
function removeConductor(i){conductors.splice(i,1);renderConductors();showPreview();}
function getConductorNames(){const names=[...conductors];const typed=$('conductor').value.trim();if(typed&&!names.includes(typed))names.push(typed);return names;}
function showPreview(){const names=getConductorNames();$('preview').innerHTML=`<section class="print-preview"><h2>WAONGOZA NYIMBO</h2><div class="conductor-names">${names.length?names.map(esc).join(' • '):'—'}</div></section>`;}
$('addConductorBtn').addEventListener('click',addConductor);
$('conductor').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addConductor();}});
showPreview();
</script><style>.chip{display:inline-flex;gap:5px;margin:4px;padding:5px 9px;border-radius:20px;background:#f3e8ff}.print-preview{margin-top:20px;text-align:center;border-top:1px solid #ddd;border-bottom:1px solid #ddd;padding:10px}.print-preview h2{font-size:14pt;margin:0 0 5px}.conductor-names{font-size:13pt;font-weight:800}.print-preview{display:block}@media print{.print-preview{display:block!important}.conductor-names{font-size:12pt!important}}</style></body></html>
