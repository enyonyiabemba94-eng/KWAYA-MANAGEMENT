<!doctype html>
<html lang="sw">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mpango wa Misa | Kwaya ya Kristu Mfalme</title>
<style>
@media print{
.printtitle{font-size:20pt!important}.printsub{font-size:17pt!important}.info{font-size:11pt!important}
.conductor-print{display:block!important;visibility:visible!important;opacity:1!important;height:auto!important;overflow:visible!important;font-size:12pt!important;font-weight:800!important;margin:3mm 0 4mm!important;padding:2mm 0!important}

.psec{margin:2pt 0!important;break-inside:avoid!important;page-break-inside:avoid!important}.psec h4{font-size:13pt!important;margin:2pt 0!important}.psong{font-size:12pt!important;line-height:1.05!important;margin:.5pt 0!important}.print-note{font-size:11pt!important}
#preview,.preview{height:267mm!important;max-height:267mm!important;overflow:hidden!important}
.fit-page{height:auto!important;max-height:none!important;overflow:visible!important;transform-origin:top left!important}
.sections-fixed.single-column{display:grid!important;grid-template-columns:1fr!important;column-gap:0!important}.sections-fixed.single-column:before{display:none!important}.sections-fixed.single-column .col-left{grid-column:1!important;width:100%!important;padding-right:0!important}.sections-fixed.single-column .col-right{display:none!important}

}
</style>
</head>
<body>
<script>
const BASE='https://raw.githubusercontent.com/enyonyiabemba94-eng/KWAYA-MANAGEMENT/70a392b58e479adde81562cd70999f4469947288/mass-programmes.html';
fetch(BASE).then(r=>r.text()).then(html=>{
const inject='<style>@media print{.printtitle{font-size:20pt!important}.printsub{font-size:17pt!important}.info{font-size:11pt!important}.conductor-print{display:block!important;visibility:visible!important;opacity:1!important;height:auto!important;overflow:visible!important;font-size:12pt!important;font-weight:800!important;margin:3mm 0 4mm!important;padding:2mm 0!important}.conductor-print *{font-size:12pt!important;visibility:visible!important;opacity:1!important}.psec{margin:2pt 0!important;break-inside:avoid!important;page-break-inside:avoid!important}.psec h4{font-size:13pt!important;margin:2pt 0!important}.psong{font-size:12pt!important;line-height:1.05!important;margin:.5pt 0!important}.print-note{font-size:11pt!important}#preview,.preview{height:267mm!important;max-height:267mm!important;overflow:hidden!important}.fit-page{height:auto!important;max-height:none!important;overflow:visible!important;transform-origin:top left!important}.sections-fixed.single-column{display:grid!important;grid-template-columns:1fr!important;column-gap:0!important}.sections-fixed.single-column:before{display:none!important}.sections-fixed.single-column .col-left{grid-column:1!important;width:100%!important;padding-right:0!important}.sections-fixed.single-column .col-right{display:none!important}.sections-fixed:not(.single-column){display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;column-gap:8mm!important}.sections-fixed:not(.single-column) .col-left{grid-column:1!important}.sections-fixed:not(.single-column) .col-right{grid-column:2!important}}</style>';
const fix='<script>(function(){const SPECIAL={Ubatizo:"UBATIZO",Kipaimara:"KIPAIMARA","Roho Mtakatifu":"ROHO MTAKATIFU",Ndoa:"NDOA","Misa ya Mtakatifu":"MISA YA MTAKATIFU"};const SP=Object.values(SPECIAL);function getNames(){const a=[];document.querySelectorAll("#conductors .chip").forEach(x=>{const t=x.textContent.replace(/×/g,"").trim();if(t&&!a.includes(t))a.push(t)});const i=document.getElementById("conductor");if(i&&i.value.trim()&&!a.includes(i.value.trim()))a.push(i.value.trim());return a}function fit(){const p=document.getElementById("preview"),b=p&&p.firstElementChild;if(!p||!b)return;b.style.transform="none";b.style.width="100%";b.style.height="auto";const natural=Math.max(b.scrollHeight,b.getBoundingClientRect().height,1),max=p.clientHeight||1120;const scale=Math.min(1,max/natural);b.style.transformOrigin="top left";b.style.transform=scale<1?"scale("+scale+")":"none";b.style.width=scale<1?(100/scale)+"%":"100%"}function organize(){const p=document.getElementById("preview");if(!p)return;const r=p.querySelector(".sections-fixed");if(!r)return;let l=r.querySelector(".col-left"),q=r.querySelector(".col-right");if(!l){l=document.createElement("div");l.className="col-left";r.prepend(l)}if(!q){q=document.createElement("div");q.className="col-right";r.append(q)}const chosen=[...document.querySelectorAll("input[type=checkbox][value]")].filter(x=>x.checked&&SPECIAL[x.value]).map(x=>SPECIAL[x.value]);const all=[...r.querySelectorAll(":scope>.col-left>.psec,:scope>.col-right>.psec")],normal=[],special=[];all.forEach(x=>{const h=(x.querySelector("h4")?.textContent||"").trim().toUpperCase();(SP.includes(h)?special:normal).push(x)});l.replaceChildren();q.replaceChildren();normal.forEach(x=>l.appendChild(x));chosen.forEach(h=>{const x=special.find(y=>(y.querySelector("h4")?.textContent||"").trim().toUpperCase()===h);if(x)q.appendChild(x);else{const z=document.createElement("div");z.className="psec";z.innerHTML="<h4>"+h+"</h4>";q.appendChild(z)}});r.classList.toggle("single-column",!chosen.length);q.style.display=chosen.length?"block":"none";r.style.gridTemplateColumns=chosen.length?"minmax(0,1fr) minmax(0,1fr)":"1fr";let z=p.querySelector(".conductor-print");const ns=getNames();if(!z){z=document.createElement("div");z.className="conductor-print";const h=p.querySelector(".printhead");h?h.insertAdjacentElement("afterend",z):p.prepend(z)}z.innerHTML=ns.length?"<b>WAONGOZA NYIMBO:</b> "+ns.map(x=>String(x).replace(/[&<>\\\"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",\"":"&quot;",\"'\":\"&#039;\"}[m]))).join(" • "):"<b>WAONGOZA NYIMBO:</b> —";z.style.display="block";z.style.visibility="visible";z.style.opacity="1";fit()}function hook(){if(window.__massFix)return;window.__massFix=true;const old=window.showPreview;if(typeof old==="function")window.showPreview=function(){old.apply(this,arguments);setTimeout(organize,30);setTimeout(organize,150);setTimeout(organize,400)};const oldPrint=window.printProgramme;if(typeof oldPrint==="function")window.printProgramme=function(){old.apply(this,arguments);setTimeout(organize,40);setTimeout(()=>{fit();window.print()},180)};setTimeout(organize,500);setTimeout(organize,1000)}document.addEventListener("DOMContentLoaded",hook);window.addEventListener("load",hook);setTimeout(hook,100)})();<'+"/script>";
html=html.replace('</head>',inject+'</head>').replace('</body>',fix+'</body>');document.open();document.write(html);document.close();
}).catch(e=>{document.body.innerHTML='<p style="padding:20px;font-family:Arial">Imeshindikana kupakia Mpango wa Misa.</p>';console.error(e)});
</script>
</body>
</html>
