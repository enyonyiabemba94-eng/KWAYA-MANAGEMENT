<!doctype html>
<html lang="sw">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mpango wa Misa | Kwaya ya Kristu Mfalme</title>
<style>
@media print{
  .printtitle{font-size:20pt!important}.printsub{font-size:17pt!important}.info{font-size:11pt!important}
  .conductor-print{display:block!important;visibility:visible!important;font-size:12pt!important;font-weight:800!important;margin:3mm 0 5mm!important;padding:2.5mm 0!important}
  .conductor-print *{font-size:12pt!important;visibility:visible!important}.psec{margin:3pt 0!important;break-inside:avoid!important;page-break-inside:avoid!important}
  .psec h4{font-size:13pt!important;margin:3pt 0!important}.psong{font-size:12pt!important;line-height:1.1!important;margin:1pt 0!important}.print-note{font-size:11pt!important}
  .sections-fixed.single-column{display:grid!important;grid-template-columns:1fr!important;column-gap:0!important}.sections-fixed.single-column:before{display:none!important}
  .sections-fixed.single-column .col-left{grid-column:1!important;width:100%!important;padding-right:0!important}.sections-fixed.single-column .col-right{display:none!important}
  .sections-fixed:not(.single-column){display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;column-gap:8mm!important}
  .sections-fixed:not(.single-column) .col-left{grid-column:1!important}.sections-fixed:not(.single-column) .col-right{grid-column:2!important}
}
</style>
</head>
<body>
<script>
const BASE='https://raw.githubusercontent.com/enyonyiabemba94-eng/KWAYA-MANAGEMENT/70a392b990f6d1b8d7d5b9c0c5f1a8c3f6d9e2a1/mass-programmes.html';
const FALLBACK='https://raw.githubusercontent.com/enyonyiabemba94-eng/KWAYA-MANAGEMENT/70a392b990f6d1b8d7d5b9c0c5f1a8c3f6d9e2a1/mass-programmes.html';
fetch('https://raw.githubusercontent.com/enyonyiabemba94-eng/KWAYA-MANAGEMENT/70a392b990f6d1b8d7d5b9c0c5f1a8c3f6d9e2a1/mass-programmes.html').then(r=>r.text()).then(html=>{
  const css=`<style>@media print{.sections-fixed.single-column{display:grid!important;grid-template-columns:1fr!important;column-gap:0!important}.sections-fixed.single-column:before{display:none!important}.sections-fixed.single-column .col-left{grid-column:1!important;width:100%!important;padding-right:0!important}.sections-fixed.single-column .col-right{display:none!important}.sections-fixed:not(.single-column){display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;column-gap:8mm!important}.sections-fixed:not(.single-column) .col-left{grid-column:1!important}.sections-fixed:not(.single-column) .col-right{grid-column:2!important}.printtitle{font-size:20pt!important}.printsub{font-size:17pt!important}.info{font-size:11pt!important}.conductor-print{display:block!important;visibility:visible!important;font-size:12pt!important;font-weight:800!important;margin:3mm 0 5mm!important;padding:2.5mm 0!important}.conductor-print *{font-size:12pt!important;visibility:visible!important}.psec{margin:3pt 0!important}.psec h4{font-size:13pt!important;margin:3pt 0!important}.psong{font-size:12pt!important;line-height:1.1!important;margin:1pt 0!important}.print-note{font-size:11pt!important}}</style>`;
  const js=`<script>(function(){
    const SPECIAL=['UBATIZO','KIPAIMARA','ROHO MTAKATIFU','NDOA'];
    function arrange(){
      const p=document.getElementById('preview'); if(!p)return;
      const root=p.querySelector('.sections-fixed'); if(!root)return;
      let left=root.querySelector('.col-left'), right=root.querySelector('.col-right');
      if(!left){left=document.createElement('div');left.className='col-left';root.prepend(left)}
      if(!right){right=document.createElement('div');right.className='col-right';root.append(right)}
      const chosen=Array.from(document.querySelectorAll('input[type="checkbox"]')).filter(x=>x.checked&&['Ubatizo','Kipaimara','Roho Mtakatifu','Ndoa'].includes(x.value)).map(x=>({Ubatizo:'UBATIZO',Kipaimara:'KIPAIMARA','Roho Mtakatifu':'ROHO MTAKATIFU',Ndoa:'NDOA'}[x.value]));
      const all=Array.from(root.querySelectorAll(':scope > .col-left > .psec, :scope > .col-right > .psec'));
      const normal=[], special=[];
      all.forEach(s=>{const h=(s.querySelector('h4')?.textContent||'').trim().toUpperCase();(SPECIAL.includes(h)?special:normal).push(s)});
      left.replaceChildren();right.replaceChildren();normal.forEach(s=>left.appendChild(s));
      chosen.forEach(name=>{const s=special.find(x=>(x.querySelector('h4')?.textContent||'').trim().toUpperCase()===name);if(s)right.appendChild(s)});
      root.classList.toggle('single-column',chosen.length===0);right.style.display=chosen.length?'block':'none';root.style.gridTemplateColumns=chosen.length?'minmax(0,1fr) minmax(0,1fr)':'1fr';
      const chips=Array.from(document.querySelectorAll('#conductors .chip')).map(x=>x.textContent.replace(/^×\\s*/,'').trim()).filter(Boolean);const input=document.getElementById('conductor');if(input?.value.trim()&&!chips.includes(input.value.trim()))chips.push(input.value.trim());
      let c=p.querySelector('.conductor-print');if(chips.length){if(!c){c=document.createElement('div');c.className='conductor-print';const h=p.querySelector('.printhead');if(h)h.insertAdjacentElement('afterend',c);else p.prepend(c)}c.innerHTML='<b>CONDUCTOR / WAONGOZA NYIMBO</b><div>'+chips.join(' • ')+'</div>';c.style.display='block';c.style.visibility='visible'}
    }
    function hook(){if(typeof window.showPreview==='function'&&!window.__fixedMass){const old=window.showPreview;window.showPreview=function(){old.apply(this,arguments);setTimeout(arrange,30);setTimeout(arrange,180)};window.__fixedMass=true}setTimeout(arrange,250)}
    document.addEventListener('DOMContentLoaded',hook);window.addEventListener('load',hook);setTimeout(hook,100);
  })();<\\/script>`;
  html=html.replace('</head>',css+'</head>').replace('</body>',js+'</body>');
  document.open();document.write(html);document.close();
}).catch(e=>{document.body.innerHTML='<p style="padding:20px;font-family:Arial">Imeshindikana kupakia Mpango wa Misa.</p>';console.error(e)});
</script>
</body>
</html>
