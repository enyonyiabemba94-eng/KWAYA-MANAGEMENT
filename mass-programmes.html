<!doctype html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mpango wa Misa</title></head><body><div style="font-family:Arial,sans-serif;padding:24px;text-align:center">Inapakia Mpango wa Misa…</div><script>(async()=>{const src='https://raw.githubusercontent.com/enyonyiabemba94-eng/KWAYA-MANAGEMENT/main/mass-programmes-core.html';try{let h=await fetch(src).then(r=>{if(!r.ok)throw new Error('core');return r.text()});const css=`<style id="mass-layout-fix">@media print{.sections-fixed{display:block!important}.sections-fixed:before{display:none!important}.mass-special-grid{display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;column-gap:8mm!important;position:relative!important;align-items:start!important}.mass-special-grid:before{content:"";position:absolute;top:0;bottom:0;left:calc(50% - 4mm);width:.5px;background:#b8b8b8}.mass-special-left,.mass-special-right{min-width:0!important}.mass-special-left{grid-column:1!important;padding-right:1mm!important}.mass-special-right{grid-column:2!important;padding-left:1mm!important}.mass-below{display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;column-gap:8mm!important;position:relative!important;align-items:start!important}.mass-below:before{content:"";position:absolute;top:0;bottom:0;left:calc(50% - 4mm);width:.5px;background:#b8b8b8}.mass-below-left,.mass-below-right{min-width:0!important}.mass-below-left{padding-right:1mm!important}.mass-below-right{padding-left:1mm!important}.psec{break-inside:avoid!important;page-break-inside:avoid!important}}`;
if(!h.includes('mass-layout-fix'))h=h.replace('</style>',css+'</style>');
const js=`<script id="mass-layout-script">(function(){const oldShowPreview=window.showPreview;function U(s){return String(s||'').trim().toUpperCase()}function isSpecial(name){return /UBATIZO|KIPAIMARA|ROHO MTAKATIFU|ROHO|NDOA/.test(U(name))}function isStandard(name){return ['MTAKATIFU','MWANA KONDOO','KOMUNIO','SHUKRANI','TAFAKARI','MWISHO'].includes(U(name))}function rebuild(){const p=document.getElementById('preview');if(!p)return;const old=p.querySelector('.sections-fixed');if(!old)return;const sections=[...old.querySelectorAll('.psec')];const special=sections.filter(x=>isSpecial(x.querySelector('h4')?.textContent));const normal=sections.filter(x=>!isSpecial(x.querySelector('h4')?.textContent));const sadakaIndex=normal.findIndex(x=>U(x.querySelector('h4')?.textContent)==='SADAKA');const pre=sadakaIndex<0?normal:normal.slice(0,sadakaIndex+1);const after=sadakaIndex<0?[]:normal.slice(sadakaIndex+1);const standard=after.filter(x=>isStandard(x.querySelector('h4')?.textContent));const extra=after.filter(x=>!isStandard(x.querySelector('h4')?.textContent));const below=[...extra,...standard];const top=document.createElement('div');top.className='mass-special-grid';const tl=document.createElement('div');tl.className='mass-special-left';const tr=document.createElement('div');tr.className='mass-special-right';pre.forEach(x=>tl.appendChild(x));special.forEach(x=>tr.appendChild(x));top.append(tl,tr);const bot=document.createElement('div');bot.className='mass-below';const bl=document.createElement('div');bl.className='mass-below-left';const br=document.createElement('div');br.className='mass-below-right';below.forEach((x,i)=>(i%2?br:bl).appendChild(x));bot.append(bl,br);old.replaceWith(top,bot);if(typeof fitOnePage==='function')fitOnePage()}window.showPreview=function(){if(typeof oldShowPreview==='function')oldShowPreview();setTimeout(rebuild,0)}})();<\\/script>`;
h=h.replace('</body>',js+'</body>');document.open();document.write(h);document.close();}catch(e){document.body.innerHTML='<div style="font-family:Arial,sans-serif;padding:24px;color:#991b1b">Imeshindikana kupakia Mpango wa Misa. Tafadhali refresh ukurasa.</div>'}})();</script></body></html>
