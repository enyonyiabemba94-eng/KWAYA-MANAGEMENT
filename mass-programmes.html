<script>

fetch(BASE).then(r=>r.text()).then(html=>{
 const css='<style>@media print{.sections-fixed.single-column{display:grid!important;grid-template-columns:1fr!important;column-gap:0!important}.sections-fixed.single-column:before{display:none!important}.sections-fixed.single-column .col-left{grid-column:1!important;width:100%!important;padding-right:0!important}.sections-fixed.single-column .col-right{display:none!important}.sections-fixed:not(.single-column){display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;column-gap:8mm!important}.sections-fixed:not(.single-column) .col-left{grid-column:1!important}.sections-fixed:not(.single-column) .col-right{grid-column:2!important}.printtitle{font-size:18pt!important}.printsub{font-size:15pt!important}.info{font-size:10pt!important}.conductor-print{display:block!important;visibility:visible!important;opacity:1!important;font-size:10pt!important;font-weight:800!important;margin:2mm 0 3mm!important;padding:2mm 0!important;height:auto!important;overflow:visible!important}.conductor-print *{font-size:10pt!important;visibility:visible!important;opacity:1!important}.psec{margin:2pt 0!important;break-inside:avoid!important;page-break-inside:avoid!important}.psec h4{font-size:11pt!important;margin:2pt 0!important}.psong{font-size:10pt!important;line-height:1.05!important;margin:.5pt 0!important}.print-note{font-size:9pt!important}#preview,.preview,.fit-page{height:auto!important;max-height:none!important;overflow:visible!important}.fit-page{width:100%!important}}</style>';
 const js='<script>(function(){\nconst SPECIAL=["UBATIZO","KIPAIMARA","ROHO MTAKATIFU","NDOA","MISA YA MTAKATIFU"];\nconst MAP={"Ubatizo":"UBATIZO","Kipaimara":"KIPAIMARA","Roho Mtakatifu":"ROHO MTAKATIFU","Ndoa":"NDOA","Misa ya Mtakatifu":"MISA YA MTAKATIFU"};\nfunction selected(){return Array.from(document.querySelectorAll("input[type=checkbox][value]")).filter(x=>x.checked&&MAP[x.value]).map(x=>MAP[x.value])}\nfunction conductorNames(){const out=[];document.querySelectorAll("#conductors .chip").forEach(x=>{let t=x.textContent.replace(/^×\\s*/,"").trim();if(t&&!out.includes(t))out.push(t)});const i=document.getElementById("conductor");if(i&&i.value.trim()&&!out.includes(i.value.trim()))out.push(i.value.trim());return out}\nfunction putConductors(p){let names=conductorNames(),z=p.querySelector(".conductor-print");if(!names.length){if(z)z.remove();return}if(!z){z=document.createElement("div");z.className="conductor-print";const h=p.querySelector(".printhead");if(h)h.insertAdjacentElement("afterend",z);else p.prepend(z)}z.innerHTML="<b>CONDUCTOR / WAONGOZA NYIMBO</b><div style=\"margin-top:1mm\">"+names.map(n=>"<span>"+n.replace(/[&<>\"']/g,m=>({\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",\"\\\"\":\"&quot;\",\"'\":\"&#039;\"}[m]))+"</span>").join(" • ")+"</div>";z.style.display="block";z.style.visibility="visible";z.style.opacity="1"}\nfunction arrange(){const p=document.getElementById("preview");if(!p)return;const r=p.querySelector(".sections-fixed");if(!r)return;let l=r.querySelector(".col-left"),q=r.querySelector(".col-right");if(!l){l=document.createElement("div");l.className="col-left";r.prepend(l)}if(!q){q=document.createElement("div");q.className="col-right";r.append(q)}const chosen=selected(),all=Array.from(r.querySelectorAll(":scope>.col-left>.psec,:scope>.col-right>.psec")),normal=[],special=[];all.forEach(x=>{const h=(x.querySelector("h4")?.textContent||"").trim().toUpperCase();(SPECIAL.includes(h)?special:normal).push(x)});l.replaceChildren();q.replaceChildren();normal.forEach(x=>l.appendChild(x));chosen.forEach(h=>{let x=special.find(y=>(y.querySelector("h4")?.textContent||"").trim().toUpperCase()===h);if(x)q.appendChild(x)});r.classList.toggle("single-column",chosen.length===0);q.style.display=chosen.length?"block":"none";r.style.gridTemplateColumns=chosen.length?"minmax(0,1fr) minmax(0,1fr)":"1fr";putConductors(p);p.querySelectorAll(".fit-page").forEach(x=>{x.style.height="auto";x.style.maxHeight="none";x.style.overflow="visible"})}\nfunction hook(){if(window.__kwayaFix)return;window.__kwayaFix=true;const old=window.showPreview;if(typeof old==="function")window.showPreview=function(){old.apply(this,arguments);setTimeout(arrange,30);setTimeout(arrange,150);setTimeout(arrange,400)};const oldPrint=window.printProgramme;if(typeof oldPrint==="function")window.printProgramme=function(){arrange();setTimeout(()=>oldPrint.apply(this,arguments),60)};document.addEventListener("change",e=>{if(e.target.matches("input[type=checkbox][value],#conductor"))setTimeout(arrange,20)});const obs=new MutationObserver(()=>setTimeout(arrange,0));const p=document.getElementById("preview");if(p)obs.observe(p,{childList:true,subtree:true});setTimeout(arrange,300);setTimeout(arrange,800)}document.addEventListener("DOMContentLoaded",hook);window.addEventListener("load",hook);setTimeout(hook,100);\n})();<\\/script>';
 html=html.replace('</head>',css+'</head>').replace('</body>',js+'</body>');document.open();document.write(html);document.close();
}).catch(e=>{document.body.innerHTML='<p style="padding:20px;font-family:Arial">Imeshindikana kupakia Mpango wa Misa.</p>';console.error(e)});
