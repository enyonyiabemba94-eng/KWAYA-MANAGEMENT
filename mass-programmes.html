<!doctype html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mpango wa Misa</title></head><body><div style="font-family:Arial,sans-serif;padding:24px;text-align:center">Inapakia Mpango wa Misa…</div><script>(async()=>{const src='https://raw.githubusercontent.com/enyonyiabemba94-eng/KWAYA-MANAGEMENT/a263b9909f08986961e974b00cb062bf7c4812ca/mass-programmes.html';try{const r=await fetch(src);if(!r.ok)throw Error('load');let h=await r.text();const js=`<script>(function(){const old=window.showPreview;window.showPreview=function(){if(typeof old==='function')old();setTimeout(function(){const p=document.getElementById('preview');if(!p)return;const box=p.querySelector('.sections-fixed');if(!box)return;const left=box.querySelector('.col-left'),right=box.querySelector('.col-right');if(!left||!right)return;const specialMap={'Ubatizo':'UBATIZO','Kipaimara':'KIPAIMARA','Ndoa':'NDOA','Roho Mtakatifu':'ROHO MTAKATIFU'};const selected=Array.from(document.querySelectorAll('input[type=checkbox]:checked')).map(x=>String(x.value||'').trim()).filter(x=>specialMap[x]);const all=Array.from(box.querySelectorAll('.psec'));const nameOf=s=>(s.querySelector('h4')?.textContent||'').trim().toUpperCase();const specialNames=['UBATIZO','KIPAIMARA','ROHO MTAKATIFU','NDOA'];const by={};all.forEach(s=>by[nameOf(s)]=s);selected.forEach(v=>{const n=specialMap[v];if(!by[n]){const s=document.createElement('section');s.className='psec';s.innerHTML='<h4>'+n+'</h4>';by[n]=s;}});const hasSpecial=selected.length>0||all.some(s=>specialNames.includes(nameOf(s)));all.forEach(s=>left.appendChild(s));right.innerHTML='';if(hasSpecial){selected.forEach(v=>right.appendChild(by[specialMap[v]]));all.filter(s=>specialNames.includes(nameOf(s))).forEach(s=>{if(!right.contains(s))right.appendChild(s)});box.classList.remove('single-column')}else{box.classList.add('single-column');const st=document.createElement('style');st.textContent='@media print{.sections-fixed.single-column{display:grid!important;grid-template-columns:1fr!important;column-gap:0!important;width:100%!important}.sections-fixed.single-column:before{display:none!important}.sections-fixed.single-column .col-left{grid-column:1!important;width:100%!important;padding-right:0!important}.sections-fixed.single-column .col-right{display:none!important}.sections-fixed.single-column .psec{width:100%!important;max-width:100%!important}}';p.appendChild(st)}const st2=document.createElement('style');st2.textContent='@media print{.sections-fixed:not(.single-column){display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;column-gap:10mm!important}.sections-fixed:not(.single-column) .col-left{grid-column:1!important}.sections-fixed:not(.single-column) .col-right{grid-column:2!important}.sections-fixed:not(.single-column) .col-right .psec{margin-top:4mm!important;margin-bottom:6mm!important}.sections-fixed:not(.single-column) .col-right .psec h4{margin-bottom:2.5mm!important}}';p.appendChild(st2);if(typeof fitOnePage==='function')fitOnePage()},60)}})();<\\/script>`;h=h.replace('</body>',js+'</body>');document.open();document.write(h);document.close()}catch(e){document.body.innerHTML='<div style="font-family:Arial;padding:24px;color:#991b1b">Imeshindikana kupakia Mpango wa Misa. Tafadhali refresh ukurasa.</div>'}})();</script></body></html>
