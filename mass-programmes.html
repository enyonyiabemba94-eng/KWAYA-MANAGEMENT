<!doctype html>
<html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mpango wa Misa | Kwaya ya Kristu Mfalme</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
/* Print refinement: smaller, clearer A4 typography */
@media print{.printtitle{font-size:20pt!important}.printsub{font-size:17pt!important}.info{font-size:12pt!important}.psec h4{font-size:13pt!important}.psong{font-size:12pt!important}.print-note{font-size:11pt!important}.conductor-print{font-size:12pt!important;font-weight:800!important;margin:3mm 0 5mm!important;padding:2.5mm 0!important;display:block!important;visibility:visible!important}.conductor-print *{font-size:12pt!important;visibility:visible!important}.psec{margin:3pt 0!important}.psec h4{margin:3pt 0!important}.psong{margin:1pt 0!important}.special-print .psec{margin-bottom:4mm!important}}
/* Keep the existing application layout and functionality. */
</style></head><body>
<div id="app"></div><script>
/* Load the stable application source and apply only presentation fixes. */
const BASE='https://raw.githubusercontent.com/enyonyiabemba94-eng/KWAYA-MANAGEMENT/a263b9909f08986961e974b00cb062bf7c4812ca/mass-programmes.html';
fetch(BASE).then(r=>r.text()).then(html=>{
  const extra=`<style>@media print{.printtitle{font-size:20pt!important}.printsub{font-size:17pt!important}.info{font-size:12pt!important}.psec h4{font-size:13pt!important}.psong{font-size:12pt!important}.print-note{font-size:11pt!important}.conductor-print{font-size:12pt!important;font-weight:800!important;margin:3mm 0 5mm!important;padding:2.5mm 0!important;display:block!important;visibility:visible!important}.conductor-print *{font-size:12pt!important;visibility:visible!important}.psec{margin:3pt 0!important}.psec h4{margin:3pt 0!important}.psong{margin:1pt 0!important}.special-print .psec{margin-bottom:4mm!important}}</style>`;
  html=html.replace('</head>',extra+'</head>');
  html=html.replace(/<label class="hint"><input type="checkbox" value="Ndoa">([^<]*)Ndoa<\/label>/,m=>m+'<label class="hint"><input type="checkbox" value="Roho Mtakatifu"> 🕊️ Roho Mtakatifu</label>');
  html=html.replace('</body>',`<script>(function(){const old=window.showPreview;window.showPreview=function(){old&&old();setTimeout(function(){const p=document.getElementById('preview');if(!p)return;let c=p.querySelector('.conductor-print');if(!c){const names=Array.isArray(window.conductors)?window.conductors.filter(Boolean):[];const input=document.getElementById('conductor');if(input&&input.value.trim())names.push(input.value.trim());if(names.length){c=document.createElement('div');c.className='conductor-print';c.innerHTML='<strong>WAONGOZA NYIMBO:</strong> '+names.map(function(x){return String(x).replace(/[&<>\"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]})}).join(' • ');const h=p.querySelector('.printhead');if(h)h.insertAdjacentElement('afterend',c);else p.prepend(c)}}else{c.style.display='block';c.style.visibility='visible'}},50)}})();<\/script></body>`);
  document.open();document.write(html);document.close();
}).catch(e=>{document.getElementById('app').innerHTML='<p style="padding:20px">Imeshindikana kupakia programme.</p>';console.error(e)});
</script></body></html>
