<!doctype html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mpango wa Misa</title></head><body><div style="font-family:Arial,sans-serif;padding:24px;text-align:center">Inapakia Mpango wa Misa…</div><script>(async()=>{const src='https://raw.githubusercontent.com/enyonyiabemba94-eng/KWAYA-MANAGEMENT/a263b9909f08986961e974b00cb062bf7c4812ca/mass-programmes.html';try{const r=await fetch(src);if(!r.ok)throw Error('load');let h=await r.text();const js=`<script>(function(){const old=window.showPreview;window.showPreview=function(){if(typeof old==='function')old();setTimeout(function(){const p=document.getElementById('preview');if(!p)return;const box=p.querySelector('.sections-fixed');if(box){const left=box.querySelector('.col-left'),right=box.querySelector('.col-right');if(left&&right){const all=Array.from(box.querySelectorAll('.psec'));const nameOf=s=>(s.querySelector('h4')?.textContent||'').trim().toUpperCase();const special=['UBATIZO','KIPAIMARA','ROHO MTAKATIFU','NDOA'];const leftOrder=['MWANZO','BWANA UTUHURUMIE','SIFA / UTUKUFU','ZABURI','SHANGILIO','MAOMBEZI','SADAKA','MTAKATIFU','MWANA KONDOO','KOMUNIO','SHUKRANI','MWISHO'];const specialNodes=all.filter(s=>special.includes(nameOf(s)));if(specialNodes.length===0){all.forEach(s=>left.appendChild(s));right.innerHTML='';box.classList.add('single-column');const st=document.createElement('style');st.textContent='@media print{.sections-fixed.single-column{grid-template-columns:1fr!important;column-gap:0!important}.sections-fixed.single-column:before{display:none!important}.sections-fixed.single-column .col-left{grid-column:1!important;padding-right:0!important}.sections-fixed.single-column .col-right{display:none!important}.sections-fixed.single-column .psec{max-width:100%!important}}';p.appendChild(st)}else{const by={};all.forEach(s=>{by[nameOf(s)]=s});leftOrder.forEach(n=>{if(by[n])left.appendChild(by[n])});special.forEach(n=>{if(by[n])right.appendChild(by[n])})}}}const box2=p.querySelector('.sections-fixed');if(box2&&typeof fitOnePage==='function')fitOnePage()},40)}})();<\\/script>`;h=h.replace('</body>',js+'</body>');document.open();document.write(h);document.close()}catch(e){document.body.innerHTML='<div style="font-family:Arial;padding:24px;color:#991b1b">Imeshindikana kupakia Mpango wa Misa. Tafadhali refresh ukurasa.</div>'}})();</script></body></html>
