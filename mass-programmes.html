<!doctype html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mpango wa Misa | Kwaya ya Kristu Mfalme</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial;margin:0;background:#f5f6fa;color:#222}.top{background:#fff;padding:14px 20px;border-bottom:1px solid #ddd}.layout{display:grid;grid-template-columns:300px 1fr;gap:16px;padding:18px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:16px}.saved{padding:10px;border:1px solid #ddd;border-radius:9px;margin:7px 0;cursor:pointer}.saved:hover,.saved.sel{background:#faf5ff;border-color:#7c3aed}input,select,textarea{width:100%;padding:9px;border:1px solid #ddd;border-radius:8px;box-sizing:border-box;margin:4px 0 9px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{border:0;border-radius:8px;padding:9px 12px;font-weight:bold;cursor:pointer}.primary{background:#6d28d9;color:#fff}.muted{background:#eee}.danger{background:#fee2e2;color:#991b1b}.section{border:1px solid #ddd;border-radius:10px;padding:10px;margin:9px 0}.song{display:grid;grid-template-columns:1fr 85px 32px;gap:6px;margin:6px 0}.actions{display:flex;gap:7px;flex-wrap:wrap}.preview{display:none;background:#fff;margin-top:15px;padding:10px}.printhead{display:grid;grid-template-columns:52px 1fr 52px;text-align:center;align-items:center;border-bottom:2px solid #222}.logo{width:42px;height:42px;object-fit:contain}.printtitle{font-size:28pt;font-weight:900}.sub{font-size:22pt;font-weight:900}.info{font-size:22pt;padding:4px 0}.psec h4{font-size:23pt;margin:3px 0}.psong,.note{font-size:22pt;line-height:1.05}.hint{font-size:10px;color:#666}@media(max-width:800px){.layout{grid-template-columns:1fr}.row{grid-template-columns:1fr}}@media print{@page{size:A4 portrait;margin:5mm}.top,.no-print{display:none!important}.layout{display:block;padding:0}.layout>.card:first-child{display:none}.card{border:0;padding:0}.preview{display:block!important;width:200mm;height:287mm;overflow:hidden}.printtitle{font-size:28pt}.sub{font-size:22pt}.info{font-size:22pt}.psec h4{font-size:23pt}.psong,.note{font-size:22pt}.programme-name{font-size:25pt!important}}</style></head><body><header class="top no-print"><b>📖 Mpango wa Misa</b></header><main class="layout"><aside class="card no-print"><h3>Zilizohifadhiwa</h3><input id="search" placeholder="🔎 Tafuta" oninput="renderSaved()"><div id="saved">Inapakia...</div><button class="btn primary" style="width:100%" onclick="newProgramme()">＋ Mpango Mpya</button></aside><section class="card"><div class="no-print"><h2 id="formTitle">Mpango mpya</h2><div class="row"><div>Aina<select id="type"><option>Misa ya Dominika</option><option>Sherehe Kuu</option><option>Sikukuu</option><option>Kumbukumbu ya Mtakatifu</option><option>Misa Maalum</option><option>Nyingine</option></select></div><div>Kipindi cha Kanisa<select id="season"><option>Majilio</option><option>Noeli</option><option>Kipindi cha Kawaida</option><option>Kwaresima</option><option>Pasaka</option><option>Pentekoste</option><option>Nyingine</option></select></div></div><label>Jina la Dominika / Sherehe</label><input id="name"><div class="row"><div>Tarehe<input id="date" type="date"></div><div>Mwaka wa Liturujia<select id="year"><option>A</option><option>B</option><option>C</option></select></div></div><label>Mahali</label><input id="location"><label>Waongoza Nyimbo</label><input id="conductor" placeholder="Jina la conductor"><button class="btn muted" onclick="addConductor()">＋ Ongeza</button><div id="conductors"></div><p class="hint">Nyimbo zinachaguliwa moja kwa moja kutoka sehemu ya <b>Nyimbo</b>. Hakuna utegemezi wa Kitabu cha Nyimbo. Unaweza pia kuandika wimbo mwenyewe.</p><div id="sections"></div><label>Maelezo</label><textarea id="notes"></textarea><div class="actions"><button class="btn primary" onclick="saveProgramme()">💾 Hifadhi</button><button class="btn muted" onclick="showPreview()">👁️ Hakiki</button><button class="btn primary" onclick="printProgramme()">🖨️ PDF / A4</button><button class="btn danger" onclick="deleteProgramme()">🗑️ Futa</button></div></div><div id="preview" class="preview"></div></section></main><script>const db=supabase.createClient('https://xulnkdrgjgajmcqntwga.supabase.co','sb_publishable_J2OrXvOnQXxrf5t3XPmigg_5ULrsWO2');const LOGO='https://raw.githubusercontent.com/enyonyiabemba94-eng/KWAYA-MANAGEMENT/main/KWAYA%20YA%20KRISTO%20MFALME%20NYARUGUSU%2020260902_141303.jpg';const KEYS=['DO','DO#','RE','RE#','MI','FA','FA#','SOL','SOL#','LA','LA#','SI'];const DEFAULT=['MWANZO','BWANA UTUHURUMIE','SIFA / UTUKUFU','ZABURI','SHANGILIO','MAOMBEZI','SADAKA','MTAKATIFU','MWANA KONDOO','KOMUNIO','TAFAKARI','MWISHO'];let songs=[],programmes=[],sections=[],conductors=[],selectedId=null;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]));const normKey=k=>{let s=String(k??'').trim().toUpperCase().replace('♯','#').replace('♭','');return KEYS.includes(s)?s:''};function blank(){return{id:'',title:'',key:''}}function normalizeProgramme(m){if(!m)return null;let src=Array.isArray(m.sections)?m.sections:null;if(!src&&m.songs){const map=[['opening','MWANZO'],['penitential','BWANA UTUHURUMIE'],['kyrie','BWANA UTUHURUMIE'],['gloria','SIFA / UTUKUFU'],['psalm','ZABURI'],['acclamation','SHANGILIO'],['prayers','MAOMBEZI'],['offertory','SADAKA'],['sanctus','MTAKATIFU'],['holy','MTAKATIFU'],['lamb','MWANA KONDOO'],['communion','KOMUNIO'],['reflection','TAFAKARI'],['closing','MWISHO']];src=map.map(([k,n])=>({name:n,songs:Array.isArray(m.songs[k])?m.songs[k]:[]})).filter(x=>x.songs.length)}src=src||[];return{...m,id:m.id||crypto.randomUUID(),name:m.name||m.sunday||m.title||'Mpango wa Misa',date:m.date||'',type:m.type||'Misa ya Dominika',season:m.season||m.liturgical_period||'Kipindi cha Kawaida',liturgical_year:m.liturgical_year||m.litYear||'A',location:m.location||'',conductors:Array.isArray(m.conductors)?m.conductors:String(m.conductors||'').split(/\n|,/).map(x=>x.trim()).filter(Boolean),sections:src.map(s=>({name:s.name||'',songs:(s.songs||[]).map(v=>({...blank(),...v,title:v.title||v.name||'',key:normKey(v.key||v.key_signature||'')}))})),notes:m.notes||''}}function loadLocal(){const keys=['kwaya_mass_programmes','mass_programmes','kwayaMassProgrammes','programmes','massProgrammes'];for(const k of keys){try{const v=JSON.parse(localStorage.getItem(k)||'null');if(Array.isArray(v)&&v.length)return v.map(normalizeProgramme).filter(Boolean)}catch(e){}}return[]}function saveLocal(){localStorage.setItem('kwaya_mass_programmes',JSON.stringify(programmes))}function defaultSections(){sections=DEFAULT.map(name=>({name,songs:[]}));renderSections()}function addConductor(){let v=$('conductor').value.trim();if(v){conductors.push(v);$('conductor').value='';renderConductors()}}function renderConductors(){$('conductors').innerHTML=conductors.map((x,i)=>`<span>${esc(x)} <button onclick="conductors.splice(${i},1);renderConductors()">×</button></span>`).join(' ')}function addSong(si){sections[si].songs.push(blank());renderSections()}function removeSong(si,pi){sections[si].songs.splice(pi,1);renderSections()}function renderSections(){$('sections').innerHTML=sections.map((s,si)=>`<div class="section"><b>${esc(s.name)}</b><button class="btn muted" onclick="addSong(${si})">＋ Wimbo</button>${s.songs.map((v,pi)=>`<div class="song"><select onchange="changeSong(${si},${pi},this.value)"><option value="">🎵 Chagua kutoka Nyimbo</option>${songs.map(x=>`<option value="${x.id}" ${x.id===v.id?'selected':''}>${esc(x.song_number?x.song_number+' - ':'')}${esc(x.title)}</option>`).join('')}</select><select onchange="sections[${si}].songs[${pi}].key=this.value"><option value="">Key</option>${KEYS.map(k=>`<option ${k===normKey(v.key)?'selected':''}>${k}</option>`).join('')}</select><button class="btn danger" onclick="removeSong(${si},${pi})">×</button></div><input placeholder="Au andika jina la wimbo mwenyewe" value="${esc(v.title)}" oninput="sections[${si}].songs[${pi}].title=this.value"></div>`).join('')}</div>`).join('')}function changeSong(si,pi,id){let s=songs.find(x=>x.id===id);sections[si].songs[pi].id=id;sections[si].songs[pi].title=s?s.title:'';sections[si].songs[pi].key=s?normKey(s.key_signature):'';renderSections()}async function loadAll(){const q=await db.from('songs').select('*').order('song_number');if(!q.error)songs=q.data||[];programmes=loadLocal();renderSaved();if(programmes[0])choose(programmes[0]);else newProgramme()}function renderSaved(){let term=($('search').value||'').toLowerCase();$('saved').innerHTML=programmes.filter(m=>`${m.name||''} ${m.date||''}`.toLowerCase().includes(term)).map(m=>`<div class="saved ${m.id===selectedId?'sel':''}" onclick='choose(${JSON.stringify(m).replace(/'/g,'&#039;')})'><b>${esc(m.name)}</b><small>${esc(m.date)}</small></div>`).join('')||'<span class="hint">Hakuna mpango uliohifadhiwa kwenye kifaa hiki.</span>'}function choose(m){m=normalizeProgramme(m);selectedId=m.id;sections=m.sections;conductors=m.conductors||[];$('name').value=m.name||'';$('date').value=m.date||'';$('location').value=m.location||'';$('type').value=m.type||'Misa ya Dominika';$('season').value=m.season||'Kipindi cha Kawaida';$('year').value=m.liturgical_year||'A';$('notes').value=m.notes||'';$('formTitle').textContent='Hariri Mpango';renderConductors();renderSections();showPreview()}function newProgramme(){selectedId=null;conductors=[];$('name').value='';$('date').value=new Date().toISOString().slice(0,10);$('location').value='';$('notes').value='';$('formTitle').textContent='Mpango mpya';renderConductors();defaultSections();$('preview').style.display='none'}function saveProgramme(){let name=$('name').value.trim(),date=$('date').value;if(!name||!date)return alert('Jaza jina na tarehe');let m={id:selectedId||crypto.randomUUID(),name,date,type:$('type').value,season:$('season').value,liturgical_year:$('year').value,location:$('location').value,conductors:[...conductors],sections:JSON.parse(JSON.stringify(sections)),notes:$('notes').value};let i=programmes.findIndex(x=>x.id===m.id);if(i>=0)programmes[i]=m;else programmes.unshift(m);selectedId=m.id;saveLocal();renderSaved();showPreview()}function deleteProgramme(){if(!selectedId)return;if(!confirm('Futa mpango huu?'))return;programmes=programmes.filter(x=>x.id!==selectedId);saveLocal();selectedId=null;renderSaved();newProgramme()}function showPreview(){let name=$('name').value.trim()||'Mpango wa Misa';let info=`${$('date').value||'—'} • ${$('location').value||'—'} • ${$('season').value||'—'} • Mwaka ${$('year').value||'—'} • ${conductors.join(', ')||'—'}`;$('preview').innerHTML=`<div><div class="printhead"><img class="logo" src="${LOGO}"><div><div class="printtitle">KWAYA YA KRISTU MFALME</div><div class="sub">MPANGO WA MISA / SHEREHE</div></div><img class="logo" src="${LOGO}"></div><div class="programme-name" style="text-align:center;font-size:25pt;font-weight:900;text-transform:uppercase">${esc(name)}</div><div class="info">${esc(info)}</div>${sections.filter(s=>s.songs.length).map(s=>`<div class="psec"><h4>${esc(s.name)}</h4>${s.songs.map(v=>`<div class="psong">• ${esc(v.title||'Wimbo')}${normKey(v.key)?` — <b>${normKey(v.key)}</b>`:''}</div>`).join('')}</div>`).join('')}${$('notes').value.trim()?`<div class="note"><b>Maelezo:</b> ${esc($('notes').value)}</div>`:''}</div>`;$('preview').style.display='block'}function printProgramme(){showPreview();setTimeout(()=>window.print(),150)}loadAll().catch(console.error)</script></body></html>
