<!doctype html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unganisha Akaunti | Kwaya</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./auth-guard.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f6fa;color:#1f2937}.top{background:#18122b;color:#fff;padding:16px}.wrap{max-width:900px;margin:auto;padding:16px}.card{background:#fff;border-radius:14px;border:1px solid #e5e7eb;margin-bottom:15px;padding:18px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-size:11px;font-weight:700;display:block;margin-bottom:6px}select,input{width:100%;height:42px;border:1px solid #ddd;border-radius:9px;padding:9px;font-size:13px}.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:#6d28d9;color:#fff}.muted{background:#f3f4f6}.status{padding:11px;border-radius:9px;background:#f8f7ff;margin-top:12px;font-size:12px}.linked{font-size:12px;color:#166534}@media(max-width:650px){.row{grid-template-columns:1fr}}a{color:#6d28d9;text-decoration:none;font-weight:700}</style></head><body><header class="top"><b>KWAYA YA KRISTU MFALME</b><div style="font-size:12px;margin-top:4px">🔗 Unganisha Akaunti ya Mwimbaji na Member</div></header><main class="wrap"><div class="card"><h2 style="margin-top:0">Unganisha Akaunti</h2><p style="font-size:12px;color:#6b7280">Admin chagua akaunti ya mwimbaji kisha uchague jina lake kwenye orodha ya members.</p><div class="row"><div><label>Akaunti ya Mwimbaji</label><select id="profile"><option value="">Inapakia...</option></select></div><div><label>Member</label><select id="member"><option value="">Chagua member...</option></select></div></div><div style="margin-top:14px"><button class="btn primary" onclick="linkAccount()">🔗 Unganisha</button> <a class="btn muted" href="members.html">← Waimbaji</a></div><div id="status" class="status">Tayari.</div></div><div class="card"><h3 style="margin-top:0">Akaunti zilizounganishwa</h3><div id="linked">Inapakia...</div></div></main><script>const db=supabase.createClient('https://xulnkdrgjgajmcqntwga.supabase.co','sb_publishable_J2OrXvOnQXxrf5t3XPmigg_5ULrsWO2');const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]));let profiles=[],members=[];function nm(m){return [m.first_name,m.middle_name,m.last_name].filter(Boolean).join(' ')}async function init(){const {data:{session}}=await db.auth.getSession();if(!session)return;const {data:me}=await db.from('profiles').select('role').eq('id',session.user.id).maybeSingle();if(!me||!['admin','super_admin'].includes(me.role)){location.replace('login.html');return}const p=await db.from('profiles').select('id,full_name,member_id,role').eq('role','member').order('full_name');profiles=p.data||[];const m=await db.from('members').select('id,first_name,middle_name,last_name,phone,status').order('first_name');members=m.data||[];render();}function render(){const ps=profiles.filter(x=>!x.member_id);$('profile').innerHTML='<option value="">Chagua akaunti...</option>'+ps.map(x=>'<option value="'+x.id+'">'+esc(x.full_name||'Akaunti')+'</option>').join('');$('member').innerHTML='<option value="">Chagua member...</option>'+members.map(x=>'<option value="'+x.id+'">'+esc(nm(x))+(x.phone?' • '+esc(x.phone):'')+'</option>').join('');const linked=profiles.filter(x=>x.member_id);$('linked').innerHTML=linked.length?linked.map(x=>{const m=members.find(y=>y.id===x.member_id);return '<div style="padding:9px 0;border-bottom:1px solid #eee"><b>'+esc(x.full_name||'Akaunti')+'</b> → '+esc(m?nm(m):'Member')+'</div>'}).join(''):'Hakuna akaunti iliyounganishwa.'}async function linkAccount(){const pid=$('profile').value,mid=$('member').value;if(!pid||!mid){$('status').textContent='Chagua akaunti na member kwanza.';return}$('status').textContent='Inaunganisha...';const {error}=await db.rpc('admin_link_member',{profile_user_id:pid,target_member_id:mid});if(error){$('status').textContent='Imeshindikana: '+error.message;return}$('status').textContent='✅ Akaunti imeunganishwa kikamilifu.';await init()}init().catch(e=>$('status').textContent='Hitilafu: '+e.message);</script></body></html>
