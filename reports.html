<!doctype html><html lang="sw"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ripoti | KWAYA MANAGEMENT</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f6fa;color:#1f2937}.side{position:fixed;inset:0 auto 0 0;width:250px;background:#18122b;padding:18px 12px}.brand{color:#fff;padding:10px;border-bottom:1px solid #ffffff18;font-weight:800}.brand small{display:block;color:#b9aecf;font-size:10px}.nav{margin-top:18px}.nav a{display:block;color:#d9d3e5;text-decoration:none;padding:11px 13px;border-radius:9px;font-size:13px}.nav a.active,.nav a:hover{background:#8b5cf633;color:#fff}.main{margin-left:250px}.top{height:72px;background:#fff;border-bottom:1px solid #e5e7eb;padding:0 25px;display:flex;justify-content:space-between;align-items:center}.top h1{font-size:21px;margin:0}.content{padding:25px}.panel,.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:16px;margin-bottom:18px}.filters{display:grid;grid-template-columns:1fr 1fr auto;gap:10px}.field label{display:block;font-size:11px;font-weight:700;margin-bottom:5px}input{height:40px;width:100%;border:1px solid #dfe3ea;border-radius:9px;padding:0 10px}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:#6d28d9;color:#fff}.muted{background:#f3f4f6}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:18px}.stat{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:13px}.stat span{font-size:10px;color:#6b7280}.stat b{display:block;font-size:21px;margin-top:5px}.table{overflow:auto}table{border-collapse:collapse;width:100%;min-width:800px}th,td{padding:10px;border-bottom:1px solid #eee;text-align:center;font-size:11px}th{background:#fafafa;color:#6b7280;white-space:nowrap}th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:#fff}.y{color:#15803d;font-weight:800}.l{color:#b45309;font-weight:800}.r{color:#1d4ed8;font-weight:800}.h{color:#b91c1c;font-weight:800}.dash{color:#9ca3af}.toast{display:none;position:fixed;right:20px;bottom:20px;background:#166534;color:#fff;padding:12px 16px;border-radius:9px}.toast.show{display:block}.menu{display:none}@media(max-width:850px){.stats{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr}}@media(max-width:700px){.side{transform:translateX(-100%);transition:.2s;z-index:5}.side.open{transform:none}.main{margin-left:0}.menu{display:inline-block;border:0;background:#f3f4f6;border-radius:8px;width:38px;height:38px}.top{padding:0 15px}.content{padding:15px}}
</style></head><body><aside class="side" id="side"><div class="brand">🎶 KWAYA MANAGEMENT<small>Usimamizi wa Kwaya Kristo Mfalme</small></div><nav class="nav"><a href="index.html">🏠 Dashboard</a><a href="members.html">👥 Waimbaji</a><a href="attendance.html">📋 Mahudhurio</a><a href="songs.html">🎵 Nyimbo</a><a href="song-books.html">📚 Vitabu vya Nyimbo</a><a href="sacraments.html">⛪ Sakramenti</a><a class="active" href="reports.html">📊 Ripoti</a><a href="events.html">📅 Ratiba</a><a href="announcements.html">📢 Taarifa</a><a href="documents.html">📄 Nyaraka</a><a href="settings.html">⚙️ Mipangilio</a></nav></aside><main class="main"><header class="top"><div><button class="menu" onclick="side.classList.toggle('open')">☰</button> <h1 style="display:inline">Ripoti za Mahudhurio</h1></div><button class="btn muted" onclick="logout()">Toka</button></header><section class="content"><div class="panel"><div class="filters"><div class="field"><label>Tarehe kuanzia</label><input id="from" type="date"></div><div class="field"><label>Tarehe hadi</label><input id="to" type="date"></div><button class="btn primary" onclick="generate()">Tengeneza Ripoti</button></div></div><div class="stats"><div class="stat"><span>Waimbaji</span><b id="members">0</b></div><div class="stat"><span>Vipindi</span><b id="sessions">0</b></div><div class="stat"><span>Yupo</span><b id="present">0</b></div><div class="stat"><span>Amechelewa</span><b id="late">0</b></div><div class="stat"><span>Hayupo</span><b id="absent">0</b></div></div><div class="card"><div style="display:flex;gap:10px;justify-content:space-between;align-items:center;margin-bottom:12px"><input id="search" placeholder="Tafuta mwimbaji..." oninput="render()" style="max-width:350px"><div><button class="btn muted" onclick="window.print()">🖨️ Print</button> <button class="btn primary" onclick="pdf()">PDF</button></div></div><div class="table"><table><thead id="head"></thead><tbody id="rows"></tbody></table></div></div></section></main><div class="toast" id="toast"></div><script>const db=supabase.createClient('https://xulnkdrgjgajmcqntwga.supabase.co','sb_publishable_J2OrXvOnQXxrf5t3XPmigg_5ULrsWO2');let members=[],sessions=[],records=[],matrix={};const $=x=>document.getElementById(x);function toast(m,e=false){$('toast').textContent=m;$('toast').style.background=e?'#991b1b':'#166534';$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2500)}function nm(x){return [x.first_name,x.middle_name,x.last_name].filter(Boolean).join(' ')}function dates(){return sessions.map(x=>x.attendance_date).filter((x,i,a)=>a.indexOf(x)===i).sort()}async function generate(){let f=$('from').value,t=$('to').value;if(!f||!t)return toast('Chagua tarehe zote mbili',true);if(f>t)return toast('Tarehe ya kuanzia haiwezi kuzidi tarehe ya mwisho',true);let m=await db.from('members').select('id,first_name,middle_name,last_name,voice_part_id').eq('status','active').order('first_name');if(m.error)return toast(m.error.message,true);members=m.data||[];let s=await db.from('attendance_sessions').select('*').gte('attendance_date',f).lte('attendance_date',t).order('attendance_date');if(s.error)return toast(s.error.message,true);sessions=s.data||[];records=[];if(sessions.length){let r=await db.from('attendance_records').select('*').in('session_id',sessions.map(x=>x.id));if(r.error)return toast(r.error.message,true);records=r.data||[]}matrix={};records.forEach(r=>{matrix[`${r.member_id}|${r.session_id}`]=r.status});render();toast('Ripoti imetengenezwa')}function code(st){return st==='present'?['Y','y']:st==='late'?['L','l']:st==='permission'?['R','r']:st==='absent'?['H','h']:['—','dash']}function render(){let ds=dates(),q=$('search').value.toLowerCase(),ms=members.filter(m=>!q||nm(m).toLowerCase().includes(q));$('head').innerHTML='<tr><th>Mwimbaji</th>'+ds.map(d=>`<th>${d}</th>`).join('')+'<th>Y</th><th>L</th><th>R</th><th>H</th><th>%</th></tr>';$('rows').innerHTML=ms.length?ms.map(m=>{let c={present:0,late:0,permission:0,absent:0};let cells=ds.map(d=>{let ss=sessions.filter(s=>s.attendance_date===d);let r=ss.map(s=>matrix[`${m.id}|${s.id}`]).find(Boolean);if(r)c[r]++;let z=code(r);return `<td class="${z[1]}">${z[0]}</td>`}).join('');let total=ds.length,pct=total?Math.round((c.present+c.late)/total*100):0;return `<tr><td><b>${nm(m)}</b></td>${cells}<td>${c.present}</td><td>${c.late}</td><td>${c.permission}</td><td>${c.absent}</td><td>${pct}%</td></tr>`}).join(''):'<tr><td colspan="20" style="padding:30px;color:#6b7280">Hakuna data kwa kipindi hiki.</td></tr>';let all={present:0,late:0,absent:0};records.forEach(r=>{if(r.status==='present')all.present++;if(r.status==='late')all.late++;if(r.status==='absent')all.absent++});$('members').textContent=members.length;$('sessions').textContent=sessions.length;$('present').textContent=all.present;$('late').textContent=all.late;$('absent').textContent=all.absent}function pdf(){if(!members.length)return toast('Tengeneza ripoti kwanza',true);const {jsPDF}=window.jspdf;let doc=new jsPDF('l','a4');let ds=dates();let body=members.map(m=>{let c={present:0,late:0,permission:0,absent:0};let row=[nm(m)];ds.forEach(d=>{let ss=sessions.filter(s=>s.attendance_date===d),r=ss.map(s=>matrix[`${m.id}|${s.id}`]).find(Boolean);if(r)c[r]++;row.push(code(r)[0])});row.push(c.present,c.late,c.permission,c.absent,(ds.length?Math.round((c.present+c.late)/ds.length*100):0)+'%');return row});doc.text('KWAYA MANAGEMENT - RIPOTI YA MAHUDHURIO',14,15);doc.text(`Kipindi: ${$('from').value} hadi ${$('to').value}`,14,22);doc.autoTable({startY:28,head:[['Mwimbaji',...ds,'Y','L','R','H','%']],body,styles:{fontSize:7},headStyles:{fontSize:7}});doc.save(`ripoti-mahudhurio-${$('from').value}-${$('to').value}.pdf`)}async function logout(){await db.auth.signOut();location.href='index.html'}let today=new Date().toISOString().slice(0,10);$('from').value=today;$('to').value=today;generate();</script></body></html>
