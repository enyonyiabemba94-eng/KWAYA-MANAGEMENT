</style></head><body><aside class="side" id="side"><div class="brand">🎶 KWAYA MANAGEMENT<small>Usimamizi wa Kwaya Kristo Mfalme</small></div><nav class="nav"><a href="index.html">🏠 Dashboard</a><a href="members.html">👥 Waimbaji</a><a href="attendance.html">📋 Mahudhurio</a><a href="songs.html">🎵 Nyimbo</a><a href="song-books.html">📚 Vitabu vya Nyimbo</a><a href="sacraments.html">⛪ Sakramenti</a><a href="reports.html">📊 Ripoti</a><a href="events.html">📅 Ratiba</a><a href="announcements.html">📢 Taarifa</a><a href="documents.html">📄 Nyaraka</a><a class="active" href="settings.html">⚙️ Mipangilio</a></nav></aside><main class="main"><header class="top"><div><button class="menu" onclick="side.classList.toggle('open')">☰</button> <h1 style="display:inline">Mipangilio</h1></div><button class="btn muted" onclick="logout()">Toka</button></header><section class="content"><div class="card"><h2>Maelezo ya Kwaya</h2><p style="color:#6b7280;font-size:12px">Sehemu hizi zinaendana moja kwa moja na <b>choir_settings</b>.</p><form class="grid" onsubmit="save(event)"><div class="field"><label>Jina la Kwaya *</label><input id="name" required></div><div class="field"><label>Parokia</label><input id="parish"></div><div class="field"><label>Kanisa</label><input id="church"></div><div class="field"><label>Mahali</label><input id="location"></div><div class="field"><label>Jimbo / Diocese</label><input id="diocese"></div><div class="field"><label>Simu</label><input id="phone"></div><div class="field full"><label>Logo URL</label><input id="logo" type="url" oninput="preview()"><img class="logo" id="previewImg" alt="Logo"></div><div class="field full"><label>Maelezo</label><textarea id="desc" rows="5"></textarea></div><div class="foot"><button class="btn primary">Hifadhi Mipangilio</button></div></form></div></section></main><div class="toast" id="toast"></div><script>const db=supabase.createClient('https://xulnkdrgjgajmcqntwga.supabase.co','sb_publishable_J2OrXvOnQXxrf5t3XPmigg_5ULrsWO2');let sid=null;const $=x=>document.getElementById(x);function toast(m,e=false){$('toast').textContent=m;$('toast').style.background=e?'#991b1b':'#166534';$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2500)}async function load(){let r=await db.from('choir_settings').select('*').order('created_at').limit(1).maybeSingle();if(r.error)return toast(r.error.message,true);if(r.data){sid=r.data.id;$('name').value=r.data.choir_name||'';$('parish').value=r.data.parish||'';$('church').value=r.data.church||'';$('location').value=r.data.location||'';$('diocese').value=r.data.diocese||'';$('phone').value=r.data.phone||'';$('logo').value=r.data.logo_url||'';$('desc').value=r.data.description||'';preview()}}function preview(){let u=$('logo').value.trim();$('previewImg').style.display=u?'block':'none';$('previewImg').src=u}async function save(e){e.preventDefault();let o={choir_name:$('name').value.trim(),parish:$('parish').value.trim()||null,church:$('church').value.trim()||null,location:$('location').value.trim()||null,diocese:$('diocese').value.trim()||null,phone:$('phone').value.trim()||null,logo_url:$('logo').value.trim()||null,description:$('desc').value.trim()||null,updated_at:new Date().toISOString()};let r=sid?await db.from('choir_settings').update(o).eq('id',sid):await db.from('choir_settings').insert(o);if(r.error)return toast(r.error.message,true);toast('Mipangilio imehifadhiwa');load()}async function logout(){await db.auth.signOut();location.href='index.html'}load()</script></body></html>
