<!doctype html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mahudhurio | Kwaya ya Kristu Mfalme</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;font-family:Arial,sans-serif;background:#f4f5f8;color:#202431}.top{background:#18122b;color:#fff;padding:16px;display:flex;justify-content:space-between;align-items:center}.wrap{padding:14px;max-width:1200px;margin:auto}.card{background:#fff;border-radius:14px;border:1px solid #e5e7eb;padding:14px;margin-bottom:14px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.btn,input{border:1px solid #d9dde5;border-radius:8px;padding:10px;font-size:13px}.btn{font-weight:800;cursor:pointer}.primary{background:#6d28d9;color:#fff}.success{background:#16a34a;color:#fff}.info{background:#dbeafe;color:#1d4ed8}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:850px}th,td{border:1px solid #d1d5db;padding:7px;text-align:center;font-size:12px}th{background:#f3f4f6}.name{text-align:left;position:sticky;left:0;background:#fff}.mark{width:30px;height:30px;padding:0;border:1px solid #ddd;border-radius:6px}.present{background:#dcfce7;color:#15803d}.late{background:#fee2e2;color:#b91c1c}.sick{background:#fef3c7;color:#a16207}.permission{background:#dbeafe;color:#1d4ed8}.status{padding:10px;background:#f8fafc;border-radius:8px;margin-top:10px}.error{color:#b91c1c;background:#fee2e2}.ok{color:#166534;background:#dcfce7}@media(max-width:600px){.toolbar{display:grid}.btn,input{width:100%;box-sizing:border-box}}</style><script src="./i18n.js"></script></head><body><header class="top"><b>📋 KITABU CHA MAHUDHURIO</b><button class="btn" id="logout">Toka</button></header><main class="wrap"><section class="card"><div class="toolbar"><input id="month" type="month"><button class="btn primary" id="prepare">Andaa Kitabu</button><button class="btn success" id="save">Hifadhi</button><button class="btn info" id="all">Weka Wote ✓</button><button class="btn" id="reload">Refresh</button><button class="btn" id="pdf">📥 PDF</button></div><div id="status" class="status">Inapakia...</div></section><section class="card"><h2>KWAYA YA KRISTU MFALME</h2><h3 id="bookMonth">CHAGUA MWEZI</h3><div id="tableBox" class="table-wrap">Inapakia...</div></section></main><script>const db=supabase.createClient('https://xulnkdrgjgajmcqntwga.supabase.co','sb_publishable_J2OrXvOnQXxrf5t3XPmigg_5ULrsWO2');let members=[],sessions=[],marks={},monthValue='';const $=id=>document.getElementById(id);const days=['Jumapili','Jumatatu','Jumanne','Jumatano','Alhamisi','Ijumaa','Jumamosi'];function msg(t,bad){$('status').textContent=t;$('status').className='status '+(bad?'error':'ok')}function dates(v){const[y,m]=v.split('-').map(Number),out=[];for(let i=1;i<=new Date(y,m,0).getDate();i++){const d=new Date(y,m-1,i),w=d.getDay();if(w===3||w===4||w===6)out.push({date:v+'-'+String(i).padStart(2,'0'),day:days[w]})}return out}async function start(){try{const ss=await db.auth.getSession();if(!ss.data.session){location.replace('login.html');return}const rr=await db.rpc('get_my_role');if(rr.error)throw rr.error;if(!['admin','super_admin'].includes(rr.data)){location.replace(rr.data==='member'?'member-attendance.html':'login.html');return}const mm=await db.from('members').select('id,first_name,middle_name,last_name').eq('status','active').order('first_name');if(mm.error)throw mm.error;members=mm.data||[];const now=new Date();monthValue=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');$('month').value=monthValue;await load();msg('Mahudhurio yamepakiwa.')}catch(e){msg('Hitilafu: '+(e.message||e),true)}}async function load(){const ds=dates(monthValue),end=monthValue+'-'+String(new Date(+monthValue.slice(0,4),+monthValue.slice(5),0).getDate()).padStart(2,'0');let q=await db.from('attendance_sessions').select('*').eq('activity_type','rehearsal').gte('attendance_date',monthValue+'-01').lte('attendance_date',end).order('attendance_date');if(q.error)throw q.error;sessions=q.data||[];marks={};if(sessions.length){q=await db.from('attendance_records').select('session_id,member_id,status').in('session_id',sessions.map(x=>x.id));if(q.error)throw q.error;(q.data||[]).forEach(x=>marks[x.session_id+'_'+x.member_id]=x.status)}render(ds)}function render(ds){$('bookMonth').textContent=new Date(monthValue+'-01').toLocaleDateString('sw-TZ',{month:'long',year:'numeric'}).toUpperCase();let h='<table><thead><tr><th class="name">JINA KAMILI</th>';ds.forEach(d=>h+='<th>'+d.day+'<br>'+d.date.slice(8)+'</th>');h+='<th>✓</th><th>A</th><th>M</th><th>R</th><th>%</th></tr></thead><tbody>';members.forEach(m=>{let p=0,a=0,s=0,r=0,n=[m.first_name,m.middle_name,m.last_name].filter(Boolean).join(' ');h+='<tr><td class="name"><b>'+n+'</b></td>';ds.forEach(d=>{const x=sessions.find(z=>z.attendance_date===d.date),st=x?marks[x.id+'_'+m.id]:'';if(st==='present')p++;if(st==='late')a++;if(st==='sick')s++;if(st==='permission')r++;h+='<td><button class="mark '+st+'" data-s="'+(x?x.id:'')+'" data-m="'+m.id+'">'+(st==='present'?'✓':st==='late'?'A':st==='sick'?'M':st==='permission'?'R':'')+'</button></td>'});const t=p+a+s+r;h+='<td>'+p+'</td><td>'+a+'</td><td>'+s+'</td><td>'+r+'</td><td>'+(t?Math.round(p/t*100):0)+'%</td></tr>'});$('tableBox').innerHTML=h+'</tbody></table>';document.querySelectorAll('.mark').forEach(b=>b.onclick=cycle)}function cycle(e){const b=e.currentTarget;if(!b.dataset.s)return;const k=b.dataset.s+'_'+b.dataset.m,c=marks[k]||'';marks[k]=c===''?'present':c==='present'?'late':c==='late'?'sick':c==='sick'?'permission':'';render(dates(monthValue))}async function prepare(){if(!monthValue)return msg('Chagua mwezi kwanza',true);for(const d of dates(monthValue)){const q=await db.from('attendance_sessions').upsert({attendance_date:d.date,activity_type:'rehearsal',title:'Mazoezi ya Kwaya'},{onConflict:'attendance_date,activity_type',ignoreDuplicates:true});if(q.error)throw q.error}await load();msg('Kitabu kimeandaliwa.')}async function save(){const rows=Object.entries(marks).filter(([,v])=>v).map(([k,status])=>{const p=k.split('_');return{session_id:p[0],member_id:p[1],status}});if(!rows.length)return msg('Hakuna mabadiliko ya kuhifadhi',true);const q=await db.from('attendance_records').upsert(rows,{onConflict:'session_id,member_id'});if(q.error)throw q.error;await load();msg('Mahudhurio yamehifadhiwa.')}$('prepare').onclick=()=>prepare().catch(e=>msg('Hitilafu: '+e.message,true));$('save').onclick=()=>save().catch(e=>msg('Hitilafu: '+e.message,true));$('reload').onclick=()=>load().catch(e=>msg('Hitilafu: '+e.message,true));$('month').onchange=()=>{monthValue=$('month').value;load().catch(e=>msg('Hitilafu: '+e.message,true))};$('all').onclick=()=>{sessions.forEach(s=>members.forEach(m=>marks[s.id+'_'+m.id]='present'));render(dates(monthValue))};$('pdf').onclick=()=>window.print();$('logout').onclick=()=>db.auth.signOut().finally(()=>location.replace('login.html'));start();</script><!-- COMPLETE_I18N_STATIC_UI_V1 --><script>(function(){const D={sw:{"Dashboard":"Dashboard","Waimbaji":"Waimbaji","Mahudhurio":"Mahudhurio","Nyimbo":"Nyimbo","Sakramenti":"Sakramenti","Mpango wa Misa":"Mpango wa Misa","Michango":"Michango","Sare":"Sare","Ripoti":"Ripoti","Ratiba":"Ratiba","Matukio":"Matukio","Taarifa":"Taarifa","Matangazo":"Matangazo","Nyaraka":"Nyaraka","Chat":"Chat","Mipangilio":"Mipangilio","Usalama":"Usalama","Toka":"Toka","Hifadhi":"Hifadhi","Ghairi":"Ghairi","Ongeza":"Ongeza","Hariri":"Hariri","Futa":"Futa","Tafuta":"Tafuta","Refresh":"Refresh","Inapakia...":"Inapakia...","Hakuna taarifa.":"Hakuna taarifa.","Jina":"Jina","Tarehe":"Tarehe","Muda":"Muda","Mahali":"Mahali","Maelezo":"Maelezo","Hali":"Hali","Vitendo":"Vitendo","Jumla":"Jumla","Kiasi":"Kiasi","Mwezi":"Mwezi","Mwaka":"Mwaka","Chagua":"Chagua","Chagua mwezi":"Chagua mwezi","Chagua mwaka":"Chagua mwaka","Pakua PDF":"Pakua PDF","Chapisha":"Chapisha","Tuma":"Tuma","Andika ujumbe...":"Andika ujumbe...","Ingia":"Ing
