</style></head><body><header class="top"><h1>📋 KITABU CHA MAHUDHURIO</h1><button class="btn" onclick="logout()">Toka</button></header><main class="wrap"><section class="toolbar no-print"><div class="field"><label>MWEZI</label><input id="month" type="month"></div><button class="btn primary" id="prepare">Andaa Kitabu</button><button class="btn success" id="save">Hifadhi Mahudhurio</button><button class="btn info" id="all">Weka Wote ✓</button><button class="btn" id="reload">Refresh</button><button class="btn" id="extra">🚨 Siku ya Ziada</button><button class="btn" id="download">📥 Pakua PDF</button></section><section class="book"><div class="bookhead"><h2>KWAYA YA KRISTU MFALME</h2><h3>KITABU CHA MAHUDHURIO</h3><p id="bookMonth">CHAGUA MWEZI</p></div><div id="tableBox" class="table">Inapakia...</div></section></main><div id="toast" class="toast"></div><div id="modal" class="modal"><div class="box"><h3>Siku ya Ziada</h3><form id="extraForm"><label>Tarehe</label><input id="extraDate" type="date" required><label>Jina la shughuli</label><input id="extraTitle" value="Mazoezi maalum"><button class="btn primary" type="submit">Hifadhi</button> <button class="btn" type="button" onclick="closeModal()">Ghairi</button></form></div></div><script>const db=supabase.createClient('https://xulnkdrgjgajmcqntwga.supabase.co','sb_publishable_J2OrXvOnQXxrf5t3XPmigg_5ULrsWO2');let members=[],sessions=[],records=[],map={},monthValue='';const $=id=>document.getElementById(id);const days=['Jumapili','Jumatatu','Jumanne','Jumatano','Alhamisi','Ijumaa','Jumamosi'];function toast(m,e=false){$('toast').textContent=m;$('toast').style.background=e?'#991b1b':'#166534';$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),3000)}function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function monthDates(v){let[y,m]=v.split('-').map(Number),o=[];for(let day=1;day<=new Date(y,m,0).getDate();day++){let d=new Date(y,m-1,day),w=d.getDay();if(w===3||w===4||w===6)o.push({date:fmt(d),day:days[w]})}return o}async function guard(){const{data:{session}}=await db.auth.getSession();if(!session){location.href='login.html';return false}const{data:r,error}=await db.rpc('get_my_role');if(error||!['admin','super_admin'].includes(r)){if(r==='member')location.href='member-attendance.html';else location.href='login.html';return false}return true}async function loadMembers(){const{data,error}=await db.from('members').select('id,first_name,middle_name,last_name').eq('status','active').order('first_name');if(error){toast(error.message,true);return}members=data||[]}async function load(){if(!monthValue)return;let y=+monthValue.slice(0,4),m=+monthValue.slice(5),start=monthValue+'-01',end=monthValue+'-'+String(new Date(y,m,0).getDate()).padStart(2,'0');const{data:s,error:e}=await db.from('attendance_sessions').select('*').eq('activity_type','rehearsal').gte('attendance_date',start).lte('attendance_date',end).order('attendance_date');if(e){toast(e.message,true);return}sessions=s||[];const ids=sessions.map(x=>x.id);const{data:r,error:er}=ids.length?await db.from('attendance_records').select('*').in('session_id',ids):{data:[],error:null};if(er){toast(er.message,true);return}records=r||[];map={};records.forEach(x=>map[x.session_id+'_'+x.member_id]=x.status);render()}function render(){if(!monthValue)return;$('bookMonth').textContent=new Date(monthValue+'-01').toLocaleDateString('sw-TZ',{month:'long',year:'numeric'}).toUpperCase();let dates=monthDates(monthValue);sessions.forEach(s=>{if(!dates.some(d=>d.date===s.attendance_date)&&String(s.notes||'').includes('Emergency'))dates.push({date:s.attendance_date,day:new Date(s.attendance_date+'T00:00:00').toLocaleDateString('sw-TZ',{weekday:'short'})})});dates.sort((a,b)=>a.date.localeCompare(b.date));let h='<table><thead><tr><th class="name">JINA KAMILI</th>';dates.forEach(d=>h+='<th>'+d.day+'<br>'+d.date.slice(8)+'</th>');h+='<th>✓</th><th>A</th><th>M</th><th>
