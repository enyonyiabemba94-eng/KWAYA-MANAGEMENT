<!doctype html>
<html lang="sw">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mahudhurio | KWAYA YA KRISTU MFALME</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f5f8;color:#202431}.top{height:64px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:5}.top h1{font-size:20px;margin:0}.content{padding:16px}.toolbar{background:#fff;padding:14px;border:1px solid #ddd;border-radius:12px;display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.toolbar input{height:40px}.btn,input{border:1px solid #d7dbe2;border-radius:8px}.btn{padding:10px 13px;font-weight:700;cursor:pointer;background:#f3f4f6}.primary{background:#6d28d9;color:#fff;border-color:#6d28d9}.success{background:#16a34a;color:#fff;border-color:#16a34a}.book{background:#fff;border:1px solid #ddd;border-radius:12px;overflow:hidden}.head{text-align:center;padding:14px;border-bottom:2px solid #222}.head h2{margin:0;font-size:21px}.head p{margin:5px 0;font-size:12px;color:#666}.table-wrap{overflow:auto}.status{padding:30px;text-align:center;color:#666}.error{color:#b91c1c;background:#fff1f2}.table{border-collapse:collapse;width:100%;min-width:900px}th,td{border:1px solid #ccc;text-align:center;padding:7px;font-size:11px}th{background:#f1f2f4}.name{position:sticky;left:0;background:#fff;text-align:left;min-width:220px}.mark{width:29px;height:29px;border:1px solid #ddd;border-radius:6px;background:#fff;font-weight:900;cursor:pointer}.present{background:#dcfce7;color:#15803d}.late{background:#fee2e2;color:#b91c1c}.sick{background:#fef3c7;color:#a16207}.permission{background:#dbeafe;color:#1d4ed8}.legend{padding:10px;font-size:11px;border-top:2px solid #222}.toast{position:fixed;right:15px;bottom:15px;background:#166534;color:#fff;padding:12px 15px;border-radius:8px;display:none;z-index:20}.toast.show{display:block}@media(max-width:700px){.content{padding:10px}.top h1{font-size:17px}.toolbar{display:grid}.toolbar>*{width:100%}}
</style>
</head>
<body>
<header class="top"><h1>📋 Kitabu cha Mahudhurio</h1><button class="btn" onclick="location.href='index.html'">← Rudi</button></header>
<main class="content">
<div class="toolbar"><input id="month" type="month"><button class="btn primary" id="prepare">Andaa Kitabu</button><button class="btn success" id="save">Hifadhi Mahudhurio</button><button class="btn" id="all">✓ Weka Wote</button><button class="btn" id="refresh">↻ Refresh</button></div>
<section class="book"><div class="head"><h2>KWAYA YA KRISTU MFALME</h2><p>KITABU CHA MAHUDHURIO — Jumatano • Alhamisi • Jumamosi</p><b id="bookMonth">CHAGUA MWEZI</b></div><div id="tableBox" class="status">Inapakia Mahudhurio...</div><div class="legend"><b>✓</b> Amehudhuria &nbsp; <b>A</b> Amechelewa &nbsp; <b>M</b> Mgonjwa &nbsp; <b>R</b> Ruhusa</div></section>
</main><div id="toast" class="toast"></div>
<script>
(function(){'use strict';
const SUPABASE_URL='https://xulnkdrgjgajmcqntwga.supabase.co';
const SUPABASE_KEY='sb_publishable_J2OrXvOnQXxrf5t3XPmigg_5ULrsWO2';
let db,members=[],sessions=[],records={},month='';
const $=id=>document.getElementById(id);
function message(text,error=false){$('tableBox').innerHTML='<div class="status '+(error?'error':'')+'">'+text+'</div>';}
function toast(text,error=false){const t=$('toast');t.textContent=text;t.style.background=error?'#991b1b':'#166534';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
function nm(m){return [m.first_name,m.middle_name,m.last_name].filter(Boolean).join(' ')||m.name||'—'}
function datesFor(v){const [yy,mm]=v.split('-').map(Number),last=new Date(yy,mm,0).getDate(),out=[];for(let d=1;d<=last;d++){const x=new Date(yy,mm-1,d),w=x.getDay();if([3,4,6].includes(w))out.push({date:`${yy}-${String(mm).padStart(2,'0')}-${String(d).padStart(2,'0')}`,day:['Jumapili','Jumatatu','Jumanne','Jumatano','Alhamisi','Ijumaa','Jumamosi'][w]})}return out}
async function query(promise,label){const timeout=new Promise((_,rej)=>setTimeout(()=>rej(new Error(label+' imechukua muda mrefu. Angalia internet au ruhusa za Supabase.')),12000));return Promise.race([promise,timeout])}
async function load(){
if(!month)return;message('Inapakia Mahudhurio...');
try{
const [yy,mm]=month.split('-').map(Number),last=new Date(yy,mm,0).getDate();
const a=await query(db.from('members').select('*').eq('status','active').order('first_name'),'Ombi la waimbaji');if(a.error)throw a.error;members=a.data||[];
const s=await query(db.from('attendance_sessions').select('*').eq('activity_type','rehearsal').gte('attendance_date',month+'-01').lte('attendance_date',month+'-'+String(last).padStart(2,'0')).order('attendance_date'),'Ombi la vipindi');if(s.error)throw s.error;sessions=s.data||[];
records={};if(sessions.length){const ids=sessions.map(x=>x.id);const r=await query(db.from('attendance_records').select('*').in('session_id',ids),'Ombi la rekodi');if(r.error)throw r.error;(r.data||[]).forEach(x=>records[x.session_id+'_'+x.member_id]=x.status)}
render();
}catch(e){console.error(e);message('<b>Imeshindwa kupakia.</b><br>'+String(e.message||e)+'<br><br><button class="btn" onclick="location.reload()">Jaribu tena</button>',true)}
}
function render(){const dates=datesFor(month);$('bookMonth').textContent=new Date(month+'-01T00:00:00').toLocaleDateString('sw-TZ',{month:'long',year:'numeric'}).toUpperCase();let h='<div class="table-wrap"><table class="table"><thead><tr><th class="name">JINA KAMILI</th>';dates.forEach(d=>h+='<th>'+d.day+'<br>'+d.date.slice(8)+'</th>');h+='<th>✓</th><th>A</th><th>M</th><th>R</th><th>%</th></tr></thead><tbody>';members.forEach(m=>{const c={present:0,late:0,sick:0,permission:0};h+='<tr><td class="name"><b>'+nm(m)+'</b></td>';dates.forEach(d=>{const s=sessions.find(x=>x.attendance_date===d.date),st=s?(records[s.id+'_'+m.id]||''):'';if(c[st]!==undefined)c[st]++;h+='<td><button type="button" class="mark '+st+'" data-s="'+(s?s.id:'')+'" data-m="'+m.id+'">'+(st==='present'?'✓':st==='late'?'A':st==='sick'?'M':st==='permission'?'R':'')+'</button></td>'});const total=c.present+c.late+c.sick+c.permission;h+='<td>'+c.present+'</td><td>'+c.late+'</td><td>'+c.sick+'</td><td>'+c.permission+'</td><td><b>'+(total?Math.round(c.present/total*100):0)+'%</b></td></tr>'});h+='</tbody></table></div>';if(!members.length)h='<div class="status">Hakuna waimbaji wenye status <b>active</b>.</div>';$('tableBox').innerHTML=h;document.querySelectorAll('.mark').forEach(b=>b.onclick=()=>{const s=b.dataset.s,m=b.dataset.m;if(!s){toast('Andaa kitabu kwanza',true);return}const k=s+'_'+m,c=records[k]||'';records[k]=c===''?'present':c==='present'?'late':c==='late'?'sick':c==='sick'?'permission':'';render()})}
async function prepare(){month=$('month').value;if(!month){toast('Chagua mwezi kwanza',true);return}try{for(const d of datesFor(month)){const r=await query(db.from('attendance_sessions').upsert({attendance_date:d.date,activity_type:'rehearsal',title:'Mazoezi ya Kwaya'},{onConflict:'attendance_date,activity_type',ignoreDuplicates:true}),'Kuandaa siku');if(r.error)throw r.error}await load();toast('Kitabu kimeandaliwa')}catch(e){toast(e.message||e,true)}}
async function save(){const a=[];Object.keys(records).forEach(k=>{const st=records[k];if(['present','late','sick','permission'].includes(st)){const p=k.split('_');a.push({session_id:p[0],member_id:p[1],status:st})}});if(!a.length){toast('Hakuna mahudhurio ya kuhifadhi',true);return}try{const r=await query(db.from('attendance_records').upsert(a,{onConflict:'session_id,member_id'}),'Kuhifadhi mahudhurio');if(r.error)throw r.error;toast('Mahudhurio yamehifadhiwa');await load()}catch(e){toast(e.message||e,true)}}
$('prepare').onclick=prepare;$('save').onclick=save;$('all').onclick=()=>{sessions.forEach(s=>members.forEach(m=>records[s.id+'_'+m.id]='present'));render()};$('refresh').onclick=load;$('month').onchange=()=>{month=$('month').value;load()};
try{if(!window.supabase)throw new Error('Supabase library haijapakia.');db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const n=new Date();$('month').value=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0');month=$('month').value;load()}catch(e){message('<b>Hitilafu ya kuanzisha mfumo:</b><br>'+e.message,true)}
})();
</script>
</body></html>
