<!doctype html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mahudhurio | KWAYA YA KRISTU MFALME</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f5f8;color:#202431}.top{height:64px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:5}.top h1{font-size:20px;margin:0}.content{padding:16px}.toolbar{background:#fff;padding:14px;border:1px solid #ddd;border-radius:12px;display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.toolbar input{height:40px}.btn,input{border:1px solid #d7dbe2;border-radius:8px}.btn{padding:10px 13px;font-weight:700;cursor:pointer;background:#f3f4f6}.primary{background:#6d28d9;color:#fff;border-color:#6d28d9}.success{background:#16a34a;color:#fff;border-color:#16a34a}.book{background:#fff;border:1px solid #ddd;border-radius:12px;overflow:hidden}.head{text-align:center;padding:14px;border-bottom:2px solid #222}.head h2{margin:0;font-size:21px}.head p{margin:5px 0;font-size:12px;color:#666}.table-wrap{overflow:auto}.status{padding:30px;text-align:center;color:#666}.error{color:#b91c1c;background:#fff1f2}.table{border-collapse:collapse;width:100%;min-width:900px}th,td{border:1px solid #ccc;text-align:center;padding:7px;font-size:11px}th{background:#f1f2f4}.name{position:sticky;left:0;background:#fff;text-align:left;min-width:220px}.mark{width:29px;height:29px;border:1px solid #ddd;border-radius:6px;background:#fff;font-weight:900;cursor:pointer}.present{background:#dcfce7;color:#15803d}.late{background:#fee2e2;color:#b91c1c}.sick{background:#fef3c7;color:#a16207}.permission{background:#dbeafe;color:#1d4ed8}.legend{padding:10px;font-size:11px;border-top:2px solid #222}.toast{position:fixed;right:15px;bottom:15px;background:#166534;color:#fff;padding:12px 15px;border-radius:8px;display:none;z-index:20}.toast.show{display:block}@media(max-width:700px){.content{padding:10px}.top h1{font-size:17px}.toolbar{display:grid}.toolbar>*{width:100%}}</style></head><body><header class="top"><h1>📋 Kitabu cha Mahudhurio</h1><button class="btn" onclick="location.href='index.html'">← Rudi</button></header><main class="content"><div class="toolbar"><input id="month" type="month"><button class="btn primary" id="prepare">Andaa Kitabu</button><button class="btn success" id="save">Hifadhi Mahudhurio</button><button class="btn" id="all">✓ Weka Wote</button><button class="btn" id="refresh">↻ Refresh</button></div><section class="book"><div class="head"><h2>KWAYA YA KRISTU MFALME</h2><p>KITABU CHA MAHUDHURIO — Jumatano • Alhamisi • Jumamosi</p><b id="bookMonth">CHAGUA MWEZI</b></div><div id="tableBox" class="status">Inapakia...</div><div class="legend"><b>✓</b> Amehudhuria &nbsp; <b>A</b> Amechelewa/Hakuhudhuria &nbsp; <b>M</b> Mgonjwa &nbsp; <b>R</b> Ruhusa</div></section></main><div id="toast" class="toast"></div><script>(function(){'use strict';var db=window.supabase.createClient('https://xulnkdrgjgajmcqntwga.supabase.co','sb_publishable_J2OrXvOnQXxrf5t3XPmigg_5ULrsWO2');var members=[],sessions=[],records={},month='';function $(id){return document.getElementById(id)}function toast(m,e){var t=$('toast');t.textContent=m;t.style.background=e?'#991b1b':'#166534';t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2500)}function nm(m){return[m.first_name,m.middle_name,m.last_name].filter(Boolean).join(' ')||m.name||'—'}function ds(v){var p=v.split('-'),y=+p[0],m=+p[1],n=new Date(y,m,0).getDate(),a=[];for(var d=1;d<=n;d++){var x=new Date(y,m-1,d),w=x.getDay();if(w===3||w===4||w===6)a.push({date:y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0'),day:['Jumapili','Jumatatu','Jumanne','Jumatano','Alhamisi','Ijumaa','Jumamosi'][w]})}return a}async function load(){if(!month)return;try{var p=month.split('-'),y=+p[0],m=+p[1],last=new Date(y,m,0).getDate();var a=await db.from('members').select('*').eq('status','active').order('first_name');if(a.error)throw a.error;members=a.data||[];var s=await db.from('attendance_sessions').select('*').eq('activity_type','rehearsal').gte('attendance_date',month+'-01').lte('attendance_date',month+'-'+String(last).padStart(2,'0')).order('attendance_date');if(s.error)throw s.error;sessions=s.data||[];records={};if(sessions.length){var ids=sessions.map(function(x){return x.id}),r=await db.from('attendance_records').select('*').in('session_id',ids);if(r.error)throw r.error;(r.data||[]).forEach(function(x){records[x.session_id+'_'+x.member_id]=x.status})}render()}catch(e){$('tableBox').innerHTML='<div class="status error"><b>Hitilafu:</b><br>'+String(e.message||e)+'</div>';console.error(e)}}function render(){var dates=ds(month);$('bookMonth').textContent=new Date(month+'-01T00:00:00').toLocaleDateString('sw-TZ',{month:'long',year:'numeric'}).toUpperCase();var h='<div class="table-wrap"><table class="table"><thead><tr><th class="name">JINA KAMILI</th>';dates.forEach(function(d){h+='<th>'+d.day+'<br>'+d.date.slice(8)+'</th>'});h+='<th>✓</th><th>A</th><th>M</th><th>R</th><th>%</th></tr></thead><tbody>';members.forEach(function(m){var c={present:0,late:0,sick:0,permission:0};h+='<tr><td class="name"><b>'+nm(m)+'</b></td>';dates.forEach(function(d){var s=sessions.find(function(x){return x.attendance_date===d.date}),st=s?(records[s.id+'_'+m.id]||''):'';if(c[st]!==undefined)c[st]++;h+='<td><button type="button" class="mark '+st+'" data-s="'+(s?s.id:'')+'" data-m="'+m.id+'">'+(st==='present'?'✓':st==='late'?'A':st==='sick'?'M':st==='permission'?'R':'')+'</button></td>'});var total=c.present+c.late+c.sick+c.permission;h+='<td>'+c.present+'</td><td>'+c.late+'</td><td>'+c.sick+'</td><td>'+c.permission+'</td><td><b>'+(total?Math.round(c.present/total*100):0)+'%</b></td></tr>'});h+='</tbody></table></div>';$('tableBox').innerHTML=h;document.querySelectorAll('.mark').forEach(function(b){b.onclick=function(){var s=b.dataset.s,m=b.dataset.m;if(!s){toast('Andaa kitabu kwanza',true);return}var k=s+'_'+m,c=records[k]||'';records[k]=c===''?'present':c==='present'?'late':c==='late'?'sick':c==='sick'?'permission':'';render()}})}async function prepare(){month=$('month').value;if(!month){toast('Chagua mwezi kwanza',true);return}try{var dates=ds(month);for(var i=0;i<dates.length;i++){var r=await db.from('attendance_sessions').upsert({attendance_date:dates[i].date,activity_type:'rehearsal',title:'Mazoezi ya Kwaya'},{onConflict:'attendance_date,activity_type',ignoreDuplicates:true});if(r.error)throw r.error}await load();toast('Kitabu kimeandaliwa')}catch(e){toast(e.message||e,true)}}async function save(){var a=[];Object.keys(records).forEach(function(k){var st=records[k];if(['present','late','sick','permission'].includes(st)){var p=k.split('_');a.push({session_id:p[0],member_id:p[1],status:st})}});if(!a.length){toast('Hakuna mahudhurio ya kuhifadhi',true);return}try{var r=await db.from('attendance_records').upsert(a,{onConflict:'session_id,member_id'});if(r.error)throw r.error;toast('Mahudhurio yamehifadhiwa');await load()}catch(e){toast(e.message||e,true)}}$('prepare').onclick=prepare;$('save').onclick=save;$('all').onclick=function(){sessions.forEach(function(s){members.forEach(function(m){records[s.id+'_'+m.id]='present'})});render()};$('refresh').onclick=function(){load()};var n=new Date();$('month').value=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0');month=$('month').value;load()})()</script></body></html>
