<!doctype html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mahudhurio | Kwaya ya Kristu Mfalme</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./auth-guard.js?v=20260905"></script><style>body{margin:0;font-family:Arial,sans-serif;background:#f4f5f8;color:#202431}.top{background:#18122b;color:#fff;padding:16px;display:flex;justify-content:space-between;align-items:center}.wrap{padding:14px;max-width:1200px;margin:auto}.card{background:#fff;border-radius:14px;border:1px solid #e5e7eb;padding:14px;margin-bottom:14px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.btn,input{border:1px solid #d9dde5;border-radius:8px;padding:10px;font-size:13px}.btn{font-weight:800;cursor:pointer}.primary{background:#6d28d9;color:#fff}.success{background:#16a34a;color:#fff}.info{background:#dbeafe;color:#1d4ed8}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:850px}th,td{border:1px solid #d1d5db;padding:7px;text-align:center;font-size:12px}th{background:#f3f4f6}.name{text-align:left;position:sticky;left:0;background:#fff}.mark{width:30px;height:30px;padding:0}.present{background:#dcfce7;color:#15803d}.late{background:#fee2e2;color:#b91c1c}.sick{background:#fef3c7;color:#a16207}.permission{background:#dbeafe;color:#1d4ed8}.status{padding:10px;background:#f8fafc;border-radius:8px;margin-top:10px}.error{color:#b91c1c}.ok{color:#166534}@media(max-width:600px){.toolbar{display:grid}.btn,input{width:100%;box-sizing:border-box}}</style></head><body><header class="top"><b>📋 KITABU CHA MAHUDHURIO</b><button class="btn" onclick="logout()">Toka</button></header><main class="wrap"><section class="card"><div class="toolbar"><input id="month" type="month"><button class="btn primary" id="prepare">Andaa Kitabu</button><button class="btn success" id="save">Hifadhi</button><button class="btn info" id="all">Weka Wote ✓</button><button class="btn" id="reload">Refresh</button><button class="btn" id="pdf">📥 PDF</button></div><div id="status" class="status">Inapakia...</div></section><section class="card"><h2>KWAYA YA KRISTU MFALME</h2><h3 id="bookMonth">CHAGUA MWEZI</h3><div id="tableBox" class="table-wrap">Inapakia...</div></section></main><script>const db=supabase.createClient('https://xulnkdrgjgajmcqntwga.supabase.co','sb_publishable_J2OrXvOnQXxrf5t3XPmigg_5ULrsWO2');let members=[],sessions=[],map={},monthValue='';const $=x=>document.getElementById(x);const days=['Jumapili','Jumatatu','Jumanne','Jumatano','Alhamisi','Ijumaa','Jumamosi'];function setStatus(t,e=false){$('status').textContent=t;$('status').className='status '+(e?'error':'ok')}function ds(v){let[y,m]=v.split('-').map(Number),a=[];for(let i=1;i<=new Date(y,m,0).getDate();i++){let d=new Date(y,m-1,i),w=d.getDay();if(w===3||w===4||w===6)a.push({date:y+'-'+String(m).padStart(2,'0')+'-'+String(i).padStart(2,'0'),day:days[w]})}return a}async function guard(){let{data:{session}}=await db.auth.getSession();if(!session){location.href='login.html';return false}let{data:r,error}=await db.rpc('get_my_role');if(error){setStatus('Role error: '+error.message,true);return false}if(!['admin','super_admin'].includes(r)){location.href=r==='member'?'member-attendance.html':'login.html';return false}return true}async function loadMembers(){let{data,error}=await db.from('members').select('id,first_name,middle_name,last_name').eq('status','active').order('first_name');if(error)throw error;members=data||[]}async function load(){if(!monthValue)return;let y=+monthValue.slice(0,4),m=+monthValue.slice(5),start=monthValue+'-01',end=monthValue+'-'+String(new Date(y,m,0).getDate()).padStart(2,'0');let{data:s,error}=await db.from('attendance_sessions').select('*').eq('activity_type','rehearsal').gte('attendance_date',start).lte('attendance_date',end).order('attendance_date');if(error)throw error;sessions=s||[];map={};if(sessions.length){let{data:r,error:er}=await db.from('attendance_records').select('session_id,member_id,status').in('session_id',sessions.map(x=>x.id));if(er)throw er;(r||[]).forEach(x=>map[x.session_id+'_'+x.member_id]=x.status)}render(ds(monthValue));setStatus('Mahudhurio yamepakiwa.')}function render(dates){$('bookMonth').textContent=new Date(monthValue+'-01').toLocaleDateString('sw-TZ',{month:'long',year:'numeric'}).toUpperCase();let h='<table><thead><tr><th class="name">JINA KAMILI</th>';dates.forEach(d=>h+='<th>'+d.day+'<br>'+d.date.slice(8)+'</th>');h+='<th>✓</th><th>A</th><th>M</th><th>R</th><th>%</th></tr></thead><tbody>';members.forEach(m=>{let y=0,a=0,s=0,r=0,n=[m.first_name,m.middle_name,m.last_name].filter(Boolean).join(' ');h+='<tr><td class="name"><b>'+n+'</b></td>';dates.forEach(d=>{let x=sessions.find(q=>q.attendance_date===d.date),st=x?map[x.id+'_'+m.id]:'';if(st==='present')y++;if(st==='late')a++;if(st==='sick')s++;if(st==='permission')r++;h+='<td><button class="mark '+st+'" data-s="'+(x?x.id:'')+'" data-m="'+m.id+'">'+(st==='present'?'✓':st==='late'?'A':st==='sick'?'M':st==='permission'?'R':'')+'</button></td>'});let t=y+a+s+r;h+='<td>'+y+'</td><td>'+a+'</td><td>'+s+'</td><td>'+r+'</td><td>'+(t?Math.round(y/t*100):0)+'%</td></tr>'});$('tableBox').innerHTML=h+'</tbody></table>';document.querySelectorAll('.mark').forEach(b=>b.onclick=cycle)}function cycle(e){let b=e.currentTarget;if(!b.dataset.s)return;let k=b.dataset.s+'_'+b.dataset.m,c=map[k]||'';map[k]=c===''?'present':c==='present'?'late':c==='late'?'sick':c==='sick'?'permission':'';render(ds(monthValue))}async function prepare(){monthValue=$('month').value;if(!monthValue){setStatus('Chagua mwezi kwanza',true);return}for(const d of ds(monthValue)){let{error}=await db.from('attendance_sessions').upsert({attendance_date:d.date,activity_type:'rehearsal',title:'Mazoezi ya Kwaya'},{onConflict:'attendance_date,activity_type',ignoreDuplicates:true});if(error)throw error}await load();setStatus('Kitabu kimeandaliwa.')}async function save(){let changes=Object.entries(map).filter(([,v])=>v).map(([k,status])=>{let[s,m]=k.split('_');return{session_id:s,member_id:m,status}});if(!changes.length){setStatus('Hakuna mabadiliko ya kuhifadhi',true);return}let{error}=await db.from('attendance_records').upsert(changes,{onConflict:'session_id,member_id'});if(error)throw error;await load();setStatus('Mahudhurio yamehifadhiwa.')}function logout(){db.auth.signOut().finally(()=>location.href='login.html')}async function start(){if(!(await guard()))return;await loadMembers();let n=new Date();$('month').value=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0');monthValue=$('month').value;await load()}$('prepare').onclick=()=>prepare().catch(e=>setStatus(e.message,true));$('save').onclick=()=>save().catch(e=>setStatus(e.message,true));$('reload').onclick=()=>load().catch(e=>setStatus(e.message,true));$('all').onclick=()=>{sessions.forEach(s=>members.forEach(m=>map[s.id+'_'+m.id]='present'));render(ds(monthValue))};$('pdf').onclick=()=>window.print();$('month').onchange=()=>{monthValue=$('month').value;load().catch(e=>setStatus(e.message,true))};start().catch(e=>setStatus(e.message,true));</script><!-- ATTENDANCE_I18N_RUNTIME_PATCH --><script>(function(){const D={sw:{"Kitabu cha Mahudhurio":"Kitabu cha Mahudhurio","Toka":"Toka","MWEZI":"MWEZI","Andaa Kitabu":"Andaa Kitabu","Hifadhi Mahudhurio":"Hifadhi Mahudhurio","Weka Wote ✓":"Weka Wote ✓","Refresh":"Refresh","🚨 Siku ya Ziada":"🚨 Siku ya Ziada","📥 Pakua Kitabu (PDF)":"📥 Pakua Kitabu (PDF)","KITABU CHA MAHUDHURIO":"KITABU CHA MAHUDHURIO","Jumatano • Alhamisi • Jumamosi":"Jumatano • Alhamisi • Jumamosi","CHAGUA MWEZI":"CHAGUA MWEZI","MAHUDHURIO":"MAHUDHURIO","Jina":"Jina","Jumla":"Jumla","Asilimia":"Asilimia","LEO":"LEO","✓ Yupo":"✓ Yupo","✕ Hayupo":"✕ Hayupo","🤒 Anaumwa":"🤒 Anaumwa","Ruhusa":"Ruhusa","Siku ya Ziada":"Siku ya Ziada"},fr:{"Kitabu cha Mahudhurio":"Registre des présences","Toka":"Déconnexion","MWEZI":"MOIS","Andaa Kitabu":"Préparer le registre","Hifadhi Mahudhurio":"Enregistrer les présences","Weka Wote ✓":"Marquer tous ✓","Refresh":"Actualiser","🚨 Siku ya Ziada":"🚨 Jour supplémentaire","📥 Pakua Kitabu (PDF)":"📥 Télécharger le registre (PDF)","KITABU CHA MAHUDHURIO":"REGISTRE DES PRÉSENCES","Jumatano • Alhamisi • Jumamosi":"Mercredi • Jeudi • Samedi","CHAGUA MWEZI":"CHOISIR LE MOIS","MAHUDHURIO":"PRÉSENCES","Jina":"Nom","Jumla":"Total","Asilimia":"Pourcentage","LEO":"AUJOURD'HUI","✓ Yupo":"✓ Présent","✕ Hayupo":"✕ Absent","🤒 Anaumwa":"🤒 Malade","Ruhusa":"Permission","Siku ya Ziada":"Jour supplémentaire"},en:{"Kitabu cha Mahudhurio":"Attendance Register","Toka":"Log out","MWEZI":"MONTH","Andaa Kitabu":"Prepare Register","Hifadhi Mahudhurio":"Save Attendance","Weka Wote ✓":"Mark All ✓","Refresh":"Refresh","🚨 Siku ya Ziada":"🚨 Extra Day","📥 Pakua Kitabu (PDF)":"📥 Download Register (PDF)","KITABU CHA MAHUDHURIO":"ATTENDANCE REGISTER","Jumatano • Alhamisi • Jumamosi":"Wednesday • Thursday • Saturday","CHAGUA MWEZI":"SELECT MONTH","MAHUDHURIO":"ATTENDANCE","Jina":"Name","Jumla":"Total","Asilimia":"Percentage","LEO":"TODAY","✓ Yupo":"✓ Present","✕ Hayupo":"✕ Absent","🤒 Anaumwa":"🤒 Sick","Ruhusa":"Permission","Siku ya Ziada":"Extra Day"}};function run(){const l=window.choirI18n&&typeof window.choirI18n.lang==='function'?window.choirI18n.lang():'sw',d=D[l]||D.sw;document.querySelectorAll('[data-i18n]').forEach(e=>{const k=e.getAttribute('data-i18n');if(d[k])e.textContent=d[k]});const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){const k=n.nodeValue.trim();if(d[k]&&k)n.nodeValue=n.nodeValue.replace(k,d[k])}}if(document.body){run();new MutationObserver(run).observe(document.body,{childList:true,subtree:true,characterData:true});setInterval(run,1500)}})();</script></body></html>
