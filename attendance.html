<!doctype html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mahudhurio | Kwaya ya Kristu Mfalme</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;font-family:Arial,sans-serif;background:#f4f5f8;color:#202431}.top{background:#18122b;color:#fff;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:10px}.wrap{padding:14px;max-width:1200px;margin:auto}.card{background:#fff;border-radius:14px;border:1px solid #e5e7eb;padding:14px;margin-bottom:14px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.btn,input{border:1px solid #d9dde5;border-radius:8px;padding:10px;font-size:13px}.btn{font-weight:800;cursor:pointer}.primary{background:#6d28d9;color:#fff}.success{background:#16a34a;color:#fff}.info{background:#dbeafe;color:#1d4ed8}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:850px}th,td{border:1px solid #d1d5db;padding:7px;text-align:center;font-size:12px}th{background:#f3f4f6}.name{text-align:left;position:sticky;left:0;background:#fff}.mark{width:30px;height:30px;padding:0;border:1px solid #ddd;border-radius:6px;cursor:pointer}.present{background:#dcfce7;color:#15803d}.late{background:#fee2e2;color:#b91c1c}.sick{background:#fef3c7;color:#a16207}.permission{background:#dbeafe;color:#1d4ed8}.status{padding:10px;background:#f8fafc;border-radius:8px;margin-top:10px}.error{color:#991b1b;background:#fee2e2}.ok{color:#166534;background:#dcfce7}@media(max-width:600px){.toolbar{display:grid}.btn,input{width:100%;box-sizing:border-box}}</style><script src="./i18n.js"></script></head><body><header class="top"><b>📋 KITABU CHA MAHUDHURIO</b><button class="btn" id="logout">Toka</button></header><main class="wrap"><section class="card"><div class="toolbar"><input id="month" type="month"><button class="btn primary" id="prepare">Andaa Kitabu</button><button class="btn success" id="save">Hifadhi</button><button class="btn info" id="all">Weka Wote ✓</button><button class="btn" id="reload">Refresh</button><button class="btn" id="pdf">📥 PDF</button></div><div id="status" class="status">Inathibitisha akaunti...</div></section><section class="card"><h2>KWAYA YA KRISTU MFALME</h2><h3 id="bookMonth">CHAGUA MWEZI</h3><div id="tableBox" class="table-wrap">Inapakia...</div></section></main><script>(function(){'use strict';const db=supabase.createClient('https://xulnkdrgjgajmcqntwga.supabase.co','sb_publishable_J2OrXvOnQXxrf5t3XPmigg_5ULrsWO2');let members=[],sessions=[],marks={},monthValue='';const $=id=>document.getElementById(id);const days=['Jumapili','Jumatatu','Jumanne','Jumatano','Alhamisi','Ijumaa','Jumamosi'];const wait=(p,ms=10000)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('Muda wa kuwasiliana na mfumo umeisha. Bonyeza Refresh.')),ms))]);function msg(t,bad=false){$('status').textContent=t;$('status').className='status '+(bad?'error':'ok')}function esc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function dates(v){if(!v)return[];const[y,m]=v.split('-').map(Number),out=[];for(let i=1;i<=new Date(y,m,0).getDate();i++){const d=new Date(y,m-1,i),w=d.getDay();if(w===3||w===4||w===6)out.push({date:v+'-'+String(i).padStart(2,'0'),day:days[w]})}return out}async function start(){try{msg('Inathibitisha akaunti...');const ss=await wait(db.auth.getSession());if(!ss.data.session){msg('Hujaingia. Unaelekezwa kwenye ukurasa wa kuingia...',true);setTimeout(()=>location.replace('login.html'),700);return}msg('Inathibitisha ruhusa ya Admin...');const rr=await wait(db.rpc('get_my_role'));if(rr.error)throw rr.error;const role=rr.data;if(!['admin','super_admin'].includes(role)){msg('Akaunti hii si Admin. Unaelekezwa...',true);setTimeout(()=>location.replace(role==='member'?'member-attendance.html':'login.html'),700);return}msg('Inapakia waimbaji...');const mm=await wait(db.from('members').select('id,first_na
