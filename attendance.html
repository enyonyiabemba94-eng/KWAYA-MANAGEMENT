<!doctype html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mahudhurio | Kwaya ya Kristu Mfalme</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;font-family:Arial,sans-serif;background:#f4f5f8;color:#202431}.top{background:#18122b;color:#fff;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:10px}.wrap{padding:14px;max-width:1200px;margin:auto}.card{background:#fff;border-radius:14px;border:1px solid #e5e7eb;padding:14px;margin-bottom:14px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.btn,input{border:1px solid #d9dde5;border-radius:8px;padding:10px;font-size:13px}.btn{font-weight:800;cursor:pointer}.primary{background:#6d28d9;color:#fff}.success{background:#16a34a;color:#fff}.info{background:#dbeafe;color:#1d4ed8}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:850px}th,td{border:1px solid #d1d5db;padding:7px;text-align:center;font-size:12px}th{background:#f3f4f6}.name{text-align:left;position:sticky;left:0;background:#fff}.mark{width:30px;height:30px;padding:0;border:1px solid #ddd;border-radius:6px;cursor:pointer}.present{background:#dcfce7;color:#15803d}.late{background:#fee2e2;color:#b91c1c}.sick{background:#fef3c7;color:#a16207}.permission{background:#dbeafe;color:#1d4ed8}.status{padding:10px;background:#f8fafc;border-radius:8px;margin-top:10px}.error{color:#991b1b;background:#fee2e2}.ok{color:#166534;background:#dcfce7}@media(max-width:600px){.toolbar{display:grid}.btn,input{width:100%;box-sizing:border-box}}</style><script src="./i18n.js"></script></head><body><header class="top"><b>📋 KITABU CHA MAHUDHURIO</b><button class="btn" id="logout">Toka</button></header><main class="wrap"><section class="card"><div class="toolbar"><input id="month" type="month"><button class="btn primary" id="prepare">Andaa Kitabu</button><button class="btn success" id="save">Hifadhi</button><button class="btn info" id="all">Weka Wote ✓</button><button class="btn" id="reload">Refresh</button><button class="btn" id="pdf">📥 PDF</button></div><div id="status" class="status">Inathibitisha akaunti...</div></section><section class="card"><h2>KWAYA YA KRISTU MFALME</h2><h3 id="bookMonth">CHAGUA MWEZI</h3><div id="tableBox" class="table-wrap">Inapakia...</div></section></main><script>(function(){'use strict';const db=supabase.createClient('https://xulnkdrgjgajmcqntwga.supabase.co','sb_publishable_J2OrXvOnQXxrf5t3XPmigg_5ULrsWO2');let members=[],sessions=[],marks={},monthValue='';const $=id=>document.getElementById(id);const days=['Jumapili','Jumatatu','Jumanne','Jumatano','Alhamisi','Ijumaa','Jumamosi'];const wait=(p,ms=10000)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('Muda wa kuwasiliana na mfumo umeisha. Bonyeza Refresh.')),ms))]);function msg(t,bad=false){$('status').textContent=t;$('status').className='status '+(bad?'error':'ok')}function esc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function dates(v){if(!v)return[];const[y,m]=v.split('-').map(Number),out=[];for(let i=1;i<=new Date(y,m,0).getDate();i++){const d=new Date(y,m-1,i),w=d.getDay();if(w===3||w===4||w===6)out.push({date:v+'-'+String(i).padStart(2,'0'),day:days[w]})}return out}async function start(){try{msg('Inathibitisha akaunti...');const ss=await wait(db.auth.getSession());if(!ss.data.session){msg('Hujaingia. Unaelekezwa kwenye ukurasa wa kuingia...',true);setTimeout(()=>location.replace('login.html'),700);return}msg('Inathibitisha ruhusa ya Admin...');const rr=await wait(db.rpc('get_my_role'));if(rr.error)throw rr.error;const role=rr.data;if(!['admin','super_admin'].includes(role)){msg('Akaunti hii si Admin. Unaelekezwa...',true);setTimeout(()=>location.replace(role==='member'?'member-attendance.html':'login.html'),700);return}msg('Inapakia waimbaji...');const mm=await wait(db.from('members').select('id,first_name,middle_name,last_name').eq('status','active').order('first_name'));if(mm.error)throw mm.error;members=mm.data||[];const now=new Date();monthValue=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');$('month').value=monthValue;await load();msg('Mahudhurio yamepakiwa.')}catch(e){console.error(e);msg('Hitilafu: '+(e.message||e),true);$('tableBox').innerHTML='<div class="status error">Mfumo umeshindwa kupakia kitabu. '+esc(e.message||e)+'</div>'}}async function load(){if(!monthValue)return;const ds=dates(monthValue),y=Number(monthValue.slice(0,4)),m=Number(monthValue.slice(5)),end=monthValue+'-'+String(new Date(y,m,0).getDate()).padStart(2,'0');let q=await wait(db.from('attendance_sessions').select('*').eq('activity_type','rehearsal').gte('attendance_date',monthValue+'-01').lte('attendance_date',end).order('attendance_date'));if(q.error)throw q.error;sessions=q.data||[];marks={};if(sessions.length){q=await wait(db.from('attendance_records').select('session_id,member_id,status').in('session_id',sessions.map(x=>x.id)));if(q.error)throw q.error;(q.data||[]).forEach(x=>marks[x.session_id+'_'+x.member_id]=x.status)}render(ds)}function render(ds){$('bookMonth').textContent=new Date(monthValue+'-01').toLocaleDateString('sw-TZ',{month:'long',year:'numeric'}).toUpperCase();let h='<table><thead><tr><th class="name">JINA KAMILI</th>';ds.forEach(d=>h+='<th>'+d.day+'<br>'+d.date.slice(8)+'</th>');h+='<th>✓</th><th>A</th><th>M</th><th>R</th><th>%</th></tr></thead><tbody>';members.forEach(m=>{let p=0,a=0,s=0,r=0,n=[m.first_name,m.middle_name,m.last_name].filter(Boolean).join(' ');h+='<tr><td class="name"><b>'+esc(n)+'</b></td>';ds.forEach(d=>{const x=sessions.find(z=>z.attendance_date===d.date),st=x?marks[x.id+'_'+m.id]:'';if(st==='present')p++;if(st==='late')a++;if(st==='sick')s++;if(st==='permission')r++;h+='<td><button class="mark '+st+'" data-s="'+(x?x.id:'')+'" data-m="'+m.id+'">'+(st==='present'?'✓':st==='late'?'A':st==='sick'?'M':st==='permission'?'R':'')+'</button></td>'});const t=p+a+s+r;h+='<td>'+p+'</td><td>'+a+'</td><td>'+s+'</td><td>'+r+'</td><td>'+(t?Math.round(p/t*100):0)+'%</td></tr>'});$('tableBox').innerHTML=h+'</tbody></table>';document.querySelectorAll('.mark').forEach(b=>b.onclick=cycle)}function cycle(e){const b=e.currentTarget;if(!b.dataset.s)return;const k=b.dataset.s+'_'+b.dataset.m,c=marks[k]||'';marks[k]=c===''?'present':c==='present'?'late':c==='late'?'sick':c==='sick'?'permission':'';render(dates(monthValue))}async function prepare(){try{msg('Inaandaa kitabu...');for(const d of dates(monthValue)){const q=await wait(db.from('attendance_sessions').upsert({attendance_date:d.date,activity_type:'rehearsal',title:'Mazoezi ya Kwaya'},{onConflict:'attendance_date,activity_type',ignoreDuplicates:true}));if(q.error)throw q.error}await load();msg('Kitabu kimeandaliwa.')}catch(e){msg('Hitilafu: '+e.message,true)}}async function save(){try{const rows=Object.entries(marks).filter(([,v])=>v).map(([k,status])=>{const p=k.split('_');return{session_id:p[0],member_id:p[1],status}});if(!rows.length){msg('Hakuna mabadiliko ya kuhifadhi',true);return}msg('Inahifadhi...');const q=await wait(db.from('attendance_records').upsert(rows,{onConflict:'session_id,member_id'}));if(q.error)throw q.error;await load();msg('Mahudhurio yamehifadhiwa.')}catch(e){msg('Hitilafu: '+e.message,true)}}$('prepare').onclick=prepare;$('save').onclick=save;$('reload').onclick=()=>load().then(()=>msg('Imerefreshishwa.')).catch(e=>msg('Hitilafu: '+e.message,true));$('month').onchange=()=>{monthValue=$('month').value;load().catch(e=>msg('Hitilafu: '+e.message,true))};$('all').onclick=()=>{if(!sessions.length){msg('Hakuna siku za mazoezi. Bonyeza Andaa Kitabu kwanza.',true);return}sessions.forEach(s=>members.forEach(m=>marks[s.id+'_'+m.id]='present'));render(dates(monthValue))};$('pdf').onclick=()=>window.print();$('logout').onclick=()=>db.auth.signOut().finally(()=>location.replace('login.html'));start()})();</script></body></html>
