oid;page-break-inside:avoid}thead{display:table-header-group}}
</style></head><body><header class="top"><b>📋 KITABU CHA MAHUDHURIO</b><button class="btn" id="logout">Toka</button></header><div class="brand-header"><img src="KWAYA%20YA%20KRISTO%20MFALME%20NYARUGUSU%2020260902_141303.jpg" alt="Kwaya ya Kristu Mfalme"><div><div class="brand-title">KWAYA YA KRISTU MFALME</div><div class="brand-sub">MFUMO WA USIMAMIZI WA KWAYA</div></div><img src="KWAYA%20YA%20KRISTO%20MFALME%20NYARUGUSU%2020260902_141303.jpg" alt="Kwaya ya Kristu Mfalme"></div><main class="wrap"><section class="card"><div class="toolbar"><input id="month" type="month" aria-label="Chagua mwezi"><button class="btn primary" id="prepare">Andaa Kitabu</button><button class="btn success" id="save">Hifadhi</button><button class="btn info" id="all">Weka Wote ✓</button><button class="btn" id="reload">Onyesha Upya</button><button class="btn" id="pdf">📥 PDF</button></div><div id="status" class="status">Inaanzisha...</div></section><section class="card"><div class="print-head"><img src="KWAYA%20YA%20KRISTO%20MFALME%20NYARUGUSU%2020260902_141303.jpg" alt="Kwaya ya Kristu Mfalme"><div><h2>KWAYA YA KRISTU MFALME</h2><p id="printMonth"></p></div><img src="KWAYA%20YA%20KRISTO%20MFALME%20NYARUGUSU%2020260902_141303.jpg" alt="Kwaya ya Kristu Mfalme"></div><div class="book-title"><h2>KWAYA YA KRISTU MFALME</h2><h3 id="bookMonth">CHAGUA MWEZI</h3></div><div id="tableBox" class="table-wrap">Inapakia...</div><div class="legend"><span><b>✓</b> Umehudhuria</span><span><b>A</b> Amechelewa</span><span><b>M</b> Anaumwa</span><span><b>R</b> Ruhusa</span></div></section></main><script>(async()=>{const db=window.supabase.createClient('https://xulnkdrgjgajmcqntwga.supabase.co','sb_publishable_J2OrXvOnQXxrf5t3XPmigg_5ULrsWO2'),$=x=>document.getElementById(x);let members=[],sessions=[],map={},month='';const days=['Jumapili','Jumatatu','Jumanne','Jumatano','Alhamisi','Ijumaa','Jumamosi'];function stat(t,e=false){$('status').textContent=t;$('status').className='status '+(e?'error':'ok')}function ds(v){if(!v)return[];const[y,m]=v.split('-').map(Number),a=[];for(let d=1;d<=new Date(y,m,0).getDate();d++){const x=new Date(y,m-1,d),w=x.getDay();if([3,4,6].includes(w))a.push({date:v+'-'+String(d).padStart(2,'0'),day:days[w]})}return a}async function guard(){const{data:{session},error}=await db.auth.getSession();if(error)throw error;if(!session){location.href='login.html';return false}const{data:r,error:e}=await db.rpc('get_my_role');if(e)throw e;if(!['admin','super_admin'].includes(r)){location.href=r==='member'?'member-attendance.html':'login.html';return false}return true}async function loadMembers(){const{data,error}=await db.from('members').select('id,first_name,middle_name,last_name').eq('status','active').order('first_name');if(error)throw error;members=data||[]}async function load(){if(!month)return;stat('Inapakia Mahudhurio...');const[y,m]=month.split('-').map(Number),start=month+'-01',end=month+'-'+String(new Date(y,m,0).getDate()).padStart(2,'0');const{data:s,error}=await db.from('attendance_sessions').select('*').eq('activity_type','rehearsal').gte('attendance_date',start).lte('attendance_date',end).order('attendance_date');if(error)throw error;sessions=s||[];map={};if(sessions.length){const{data:r,error:e}=await db.from('attendance_records').select('session_id,member_id,status').in('session_id',sessions.map(x=>x.id));if(e)throw e;(r||[]).forEach(x=>map[x.session_id+'_'+x.member_id]=x.status)}render();stat('Mahudhurio yamepakiwa.')}function render(){const a=ds(month),label=new Date(month+'-01').toLocaleDateString('sw-TZ',{month:'long',year:'numeric'}).toUpperCase();$('bookMonth').textContent=label;$('printMonth').textContent='KITABU CHA MAHUDHURIO — '+label;let h='<table><thead><tr><th>JINA KAMILI</th>';a.forEach(d=>h+='<th>'+d.day+'<br>'+d.date.slice(8)+'</th>');h+='<th>✓</th><th>A</th><th>M</th><th>R</th><th>%</th></tr></thead><tbody>';members.forEach(m=>{let p=0,l=0,s=0,r=0,n=[m.first_name,m.middle_name,m.last_name].filter(Boolean).join(' ');h+='<tr><td class="name"><b>'+n+'</b></td>';a.forEach(d=>{const x=sessions.find(q=>q.attendance_date===d.date),k=x&&x.id+'_'+m.id,st=k&&map[k]||'';if(st==='present')p++;if(st==='late')l++;if(st==='sick')s++;if(st==='permission')r++;h+='<td><button type="button" class="mark '+st+'" data-k="'+(k||'')+'">'+(st==='present'?'✓':st==='late'?'A':st==='sick'?'M':st==='permission'?'R':'')+'</button></td>'});const t=p+l+s+r;h+='<td>'+p+'</td><td>'+l+'</td><td>'+s+'</td><td>'+r+'</td><td>'+(t?Math.round(p/t*100):0)+'%</td></tr>'});if(!members.length)h+='<tr><td colspan="99">Hakuna waimbaji wenye hali ya active.</td></tr>';$('tableBox').innerHTML=h+'</tbody></table>';document.querySelectorAll('.mark').forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(!k)return;const o=map[k]||'';map[k]=o===''?'present':o==='present'?'late':o==='late'?'sick':o==='sick'?'permission':'';render()})}async function prepare(){month=$('month').value;if(!month)return stat('Chagua mwezi kwanza.',true);for(const d of ds(month)){const{error}=await db.from('attendance_sessions').upsert({attendance_date:d.date,activity_type:'rehearsal',title:'Mazoezi ya Kwaya'},{onConflict:'attendance_date,activity_type',ignoreDuplicates:true});if(error)throw error}await load();stat('Kitabu kimeandaliwa.')}async function save(){const rows=Object.entries(map).filter(([,v])=>v).map(([k,status])=>{const[a,b]=k.split('_');return{session_id:a,member_id:b,status}});if(!rows.length)return stat('Hakuna mahudhurio ya kuhifadhi.',true);const{error}=await db.from('attendance_records').upsert(rows,{onConflict:'session_id,member_id'});if(error)throw error;await load();stat('Mahudhurio yamehifadhiwa.')}async function start(){if(!(await guard()))return;await loadMembers();const n=new Date();$('month').value=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0');month=$('month').value;await load()}$('logout').onclick=()=>db.auth.signOut().finally(()=>location.href='login.html');$('prepare').onclick=()=>prepare().catch(e=>stat(e.message,true));$('save').onclick=()=>save().catch(e=>stat(e.message,true));$('reload').onclick=()=>load().catch(e=>stat(e.message,true));$('all').onclick=()=>{sessions.forEach(s=>members.forEach(m=>map[s.id+'_'+m.id]='present'));render()};$('pdf').onclick=()=>window.print();$('month').onchange=()=>{month=$('month').value;load().catch(e=>stat(e.message,true))};start().catch(e=>stat(e.message,true))})()</script></body></html>
