<!doctype html><html lang="sw"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sakramenti | KWAYA MANAGEMENT</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f6fa;color:#1f2937}.side{position:fixed;inset:0 auto 0 0;width:250px;background:#18122b;padding:18px 12px}.brand{color:#fff;padding:10px;border-bottom:1px solid #ffffff18;font-weight:800}.brand small{display:block;color:#b9aecf;font-size:10px;margin-top:4px}.nav{margin-top:18px}.nav a{display:block;color:#d9d3e5;text-decoration:none;padding:11px 13px;border-radius:9px;font-size:13px}.nav a:hover,.nav a.active{background:#8b5cf633;color:#fff}.main{margin-left:250px}.top{height:72px;background:#fff;border-bottom:1px solid #e5e7eb;padding:0 25px;display:flex;justify-content:space-between;align-items:center}.top h1{font-size:21px;margin:0}.content{padding:25px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tab{border:0;border-radius:9px;padding:10px 14px;cursor:pointer;background:#fff}.tab.active{background:#6d28d9;color:#fff}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:20px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:11px;font-weight:700}input,select,textarea{width:100%;border:1px solid #dfe3ea;border-radius:9px;padding:10px;font:inherit;font-size:13px}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:#6d28d9;color:#fff}.muted{background:#f3f4f6}.table{margin-top:22px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:700px}th,td{padding:11px;border-bottom:1px solid #eee;text-align:left;font-size:12px}th{background:#fafafa;color:#6b7280;font-size:11px}.toast{display:none;position:fixed;right:20px;bottom:20px;background:#166534;color:#fff;padding:12px 16px;border-radius:9px}.toast.show{display:block}.menu{display:none}@media(max-width:700px){.side{transform:translateX(-100%);transition:.2s;z-index:5}.side.open{transform:none}.main{margin-left:0}.menu{display:inline-block;border:0;background:#f3f4f6;border-radius:8px;width:38px;height:38px}.top{padding:0 15px}.content{padding:15px}.grid{grid-template-columns:1fr}}
</style></head><body><aside class="side" id="side"><div class="brand">🎶 KWAYA MANAGEMENT<small>Usimamizi wa Kwaya Kristo Mfalme</small></div><nav class="nav"><a href="index.html">🏠 Dashboard</a><a href="members.html">👥 Waimbaji</a><a href="attendance.html">📋 Mahudhurio</a><a href="songs.html">🎵 Nyimbo</a><a href="song-books.html">📚 Vitabu vya Nyimbo</a><a class="active" href="sacraments.html">⛪ Sakramenti</a><a href="reports.html">📊 Ripoti</a><a href="events.html">📅 Ratiba</a><a href="announcements.html">📢 Taarifa</a><a href="documents.html">📄 Nyaraka</a><a href="settings.html">⚙️ Mipangilio</a></nav></aside><main class="main"><header class="top"><div><button class="menu" onclick="side.classList.toggle('open')">☰</button> <h1 style="display:inline">Sakramenti</h1></div><button class="btn muted" onclick="logout()">Toka</button></header><section class="content"><div class="tabs"><button class="tab active" onclick="pick('baptism_records','baptism_date','Ubatizo')">Ubatizo</button><button class="tab" onclick="pick('eucharist_records','eucharist_date','Komunyo ya Kwanza')">Komunyo ya Kwanza</button><button class="tab" onclick="pick('confirmation_records','confirmation_date','Kipaimara')">Kipaimara</button><button class="tab" onclick="pick('marriage_records','marriage_date','Ndoa')">Ndoa</button></div><div class="card"><h2 id="title">Ubatizo</h2><p style="color:#6b7280;font-size:12px">Hifadhi rekodi ya sakramenti ya mwimbaji.</p><form onsubmit="save(event)" class="grid"><input type="hidden" id="rid"><div class="field"><label>Mwimbaji *</label><select id="member" required><option value="">Chagua mwimbaji</option></select></div><div class="field"><label>Tarehe</label><input id="date" type="date"></div><div class="field"><label>Parokia / Kanisa</label><input id="church"></div><div class="field"><label>Mahali</label><input id="location"></div><div class="field"><label>Jimbo / Diocese</label><input id="diocese"></div><div class="field" id="extra"></div><div class="field"><label>Namba ya Rekodi</label><input id="record"></div><div class="field"><label>Certificate URL</label><input id="cert" type="url"></div><div class="field" style="grid-column:1/-1"><label>Maelezo</label><textarea id="notes" rows="3"></textarea></div><div style="grid-column:1/-1;text-align:right"><button class="btn primary">Hifadhi Rekodi</button></div></form><div class="table"><table><thead><tr><th>Mwimbaji</th><th>Tarehe</th><th>Mahali</th><th>Parokia/Kanisa</th><th>Vitendo</th></tr></thead><tbody id="rows"></tbody></table></div></div></section></main><div class="toast" id="toast"></div><script>const db=supabase.createClient('https://xulnkdrgjgajmcqntwga.supabase.co','sb_publishable_J2OrXvOnQXxrf5t3XPmigg_5ULrsWO2');let table='baptism_records',dateCol='baptism_date',label='Ubatizo',members=[],records=[];const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function nm(x){return [x.first_name,x.middle_name,x.last_name].filter(Boolean).join(' ')}function toast(m,e=false){$('toast').textContent=m;$('toast').style.background=e?'#991b1b':'#166534';$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2500)}async function init(){let r=await db.from('members').select('id,first_name,middle_name,last_name').order('first_name');if(r.error)return toast(r.error.message,true);members=r.data||[];$('member').innerHTML='<option value="">Chagua mwimbaji</option>'+members.map(x=>`<option value="${x.id}">${esc(nm(x))}</option>`).join('');loadRecords()}async function loadRecords(){let r=await db.from(table).select('*').order(dateCol,{ascending:false});if(r.error)return toast(r.error.message,true);records=r.data||[];render()}function pick(t,d,l){table=t;dateCol=d;label=l;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.textContent===l));$('title').textContent=l;let extra=l==='Ubatizo'?'<label>Baba</label><input id="extraInput">':l==='Komunyo ya Kwanza'?'<label>Padri</label><input id="extraInput">':l==='Kipaimara'?'<label>Mhudumu</label><input id="extraInput">':'<label>Jina la Mwenzi</label><input id="extraInput">';$('extra').innerHTML=extra;reset();loadRecords()}function reset(){$('rid').value='';$('member').value='';$('date').value='';$('church').value='';$('location').value='';$('diocese').value='';$('record').value='';$('cert').value='';$('notes').value=''}function edit(id){let x=records.find(a=>a.id===id);if(!x)return;reset();$('rid').value=x.id;$('member').value=x.member_id;$('date').value=x[dateCol]||'';$('church').value=x.parish_church||'';$('location').value=x.location||'';$('diocese').value=x.diocese||'';$('record').value=x.record_number||'';$('cert').value=x.certificate_url||'';$('notes').value=x.notes||'';$('extraInput').value=table==='baptism_records'?x.father_name||'':table==='eucharist_records'?x.priest_name||'':table==='confirmation_records'?x.minister_name||'':x.spouse_name||'';scrollTo({top:0,behavior:'smooth'})}async function save(e){e.preventDefault();let id=$('rid').value,o={member_id:$('member').value,[dateCol]:$('date').value||null,parish_church:$('church').value.trim()||null,location:$('location').value.trim()||null,diocese:$('diocese').value.trim()||null,record_number:$('record').value.trim()||null,certificate_url:$('cert').value.trim()||null,notes:$('notes').value.trim()||null,updated_at:new Date().toISOString()};if(table==='baptism_records')o.father_name=$('extraInput').value.trim()||null;if(table==='eucharist_records')o.priest_name=$('extraInput').value.trim()||null;if(table==='confirmation_records')o.minister_name=$('extraInput').value.trim()||null;if(table==='marriage_records')o.spouse_name=$('extraInput').value.trim()||null;let r=id?await db.from(table).update(o).eq('id',id):await db.from(table).upsert(o,{onConflict:'member_id'});if(r.error)return toast(r.error.message,true);toast('Rekodi imehifadhiwa');reset();loadRecords()}function render(){$('rows').innerHTML=records.length?records.map(x=>{let m=members.find(a=>a.id===x.member_id);return `<tr><td>${esc(m?nm(m):'—')}</td><td>${x[dateCol]||'—'}</td><td>${esc(x.location||'—')}</td><td>${esc(x.parish_church||'—')}</td><td><button class="btn muted" onclick="edit('${x.id}')">✏️</button></td></tr>`}).join(''):'<tr><td colspan="5" style="text-align:center;padding:30px;color:#6b7280">Hakuna rekodi.</td></tr>'}async function logout(){await db.auth.signOut();location.href='index.html'}pick('baptism_records','baptism_date','Ubatizo');init();</script></body></html>
