earch" placeholder="Tafuta mwimbaji..."><button class="btn primary" onclick="load()">↻ Refresh</button></div><div class="card"><form onsubmit="save(event)"><input type="hidden" id="id"><div class="field full"><label>Mwimbaji *</label><select id="member" required><option value="">Inapakia...</option></select></div><div class="grid" style="margin-top:12px"><div class="field"><label>Ubatizo — Tarehe</label><input id="bdate" type="date"></div><div class="field"><label>Ubatizo — Parokia/Mahali</label><input id="bplace"></div><div class="field"><label>Komunyo ya Kwanza — Tarehe</label><input id="cdate" type="date"></div><div class="field"><label>Komunyo ya Kwanza — Parokia/Mahali</label><input id="cplace"></div><div class="field"><label>Kipaimara — Tarehe</label><input id="kdate" type="date"></div><div class="field"><label>Kipaimara — Parokia/Mahali</label><input id="kplace"></div><div class="field"><label>Ndoa ya Kanisa — Tarehe</label><input id="mdate" type="date"></div><div class="field"><label>Ndoa ya Kanisa — Parokia/Mahali</label><input id="mplace"></div><div class="field full"><label>Mwenza wa Ndoa</label><input id="mspouse"></div><div class="field full"><label>Maelezo ya ziada</label><textarea id="notes" rows="3"></textarea></div></div><div style="text-align:right;margin-top:14px"><button class="btn muted" type="button" onclick="resetForm()">Futa</button> <button class="btn primary">💾 Hifadhi Taarifa za Sakramenti</button></div></form></div><div class="card"><h3>Orodha ya Waimbaji</h3><div class="table"><table><thead><tr><th>Mwimbaji</th><th>Ubatizo</th><th>Komunyo</th><th>Kipaimara</th><th>Ndoa</th><th>Vitendo</th></tr></thead><tbody id="rows"></tbody></table></div></div></section></main><div class="toast" id="toast"></div><script>const db=supabase.createClient('https://xulnkdrgjgajmcqntwga.supabase.co','sb_publishable_J2OrXvOnQXxrf5t3XPmigg_5ULrsWO2');const ENYONYI_ID='dac73f25-2bbd-4570-bcca-880bd7e63a7d';let rows=[];let status={};const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]));const nm=x=>[x.first_name,x.middle_name,x.last_name].filter(Boolean).join(' ');function toast(t,e=false){$('toast').textContent=t;$('toast').style.background=e?'#991b1b':'#166534';$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),3000)}function buildOptions(editId=''){const q=($('search').value||'').trim().toLowerCase();let list=rows.filter(x=>x.id!==ENYONYI_ID&&nm(x).toLowerCase().includes(q));let available=list.filter(x=>status[x.id]&&!status[x.id].complete);if(editId){const x=rows.find(r=>r.id===editId);if(x&&x.id!==ENYONYI_ID&&!available.some(r=>r.id===editId))available=[x,...available]}$('member').innerHTML='<option value="">Chagua mwimbaji</option>'+available.map(x=>'<option value="'+x.id+'">'+esc(nm(x))+'</option>').join('');if(!available.length)$('member').innerHTML='<option value="">Hakuna mwimbaji mwenye sakramenti ambazo hazijakamilika</option>'}async function load(){try{const r=await db.from('members').select('id,first_name,middle_name,last_name,baptism_date,baptism_place,first_communion_date,first_communion_place,confirmation_date,confirmation_place,church_marriage_date,church_marriage_place,church_marriage_spouse,sacrament_notes').order('first_name');if(r.error)throw r.error;rows=r.data||[];status={};const ids=rows.map(x=>x.id);if(ids.length){const [b,c,e,m]=await Promise.all([db.from('baptism_records').select('member_id,baptism_date').in('member_id',ids),db.from('confirmation_records').select('member_id,confirmation_date').in('member_id',ids),db.from('eucharist_records').select('member_id,eucharist_date').in('member_id',ids),db.from('marriage_records').select('member_id,marriage_date').in('member_id',ids)]);const err=[b,c,e,m].find(x=>x.error);if(err)throw err;const make=(r,date)=>new Set((r.data||[]).filter(x=>x.member_id&&(x[date]||true)).map(x=>x.member_id));const bs=make(b,'baptism_date'),cs=make(c,'confirmation_date'),es=make(e,'eucharist_date'),ms=make(m,'marriage_date');rows.forEach(x=>{const bd=!!x.baptism_date||bs.has(x.id),cd=!!x.first_communion_date||es.has(x.id),kd=!!x.confirmation_date||cs.has(x.id),md=!!x.church_marriage_date||ms.has(x.id);status[x.id]={baptism:bd,communion:cd,confirmation:kd,marriage:md,complete:bd&&cd&&kd&&md}})}buildOptions();render();}catch(e){console.error(e);status={};$('member').innerHTML='<option value="">Haiwezi kupakia orodha ya sakramenti</option>';toast('Imeshindwa kusoma taarifa za sakramenti: '+(e.message||e),true)}}function render(){const q=($('search').value||'').trim().toLowerCase();const list=rows.filter(x=>nm(x).toLowerCase().includes(q));$('rows').innerHTML=list.length?list.map(x=>{const s=status[x.id]||{};return '<tr><td><b>'+esc(nm(x))+'</b></td><td class="status">'+(s.baptism?'✓ Imejazwa':'—')+'</td><td class="status">'+(s.communion?'✓ Imejazwa':'—')+'</td><td class="status">'+(s.confirmation?'✓ Imejazwa':'—')+'</td><td class="status">'+(s.marriage?'✓ Imejazwa':'—')+'</td><td><button class="btn muted" onclick="fill(\''+x.id+'\')">✏️ Hariri</button></td></tr>'}).join(''):'<tr><td colspan="6" class="empty">Hakuna mwimbaji.</td></tr>'}function fill(id){const x=rows.find(r=>r.id===id);if(!x)return;$('id').value=id;buildOptions(id);$('member').value=id;[['bdate','baptism_date'],['bplace','baptism_place'],['cdate','first_communion_date'],['cplace','first_communion_place'],['kdate','confirmation_date'],['kplace','confirmation_place'],['mdate','church_marriage_date'],['mplace','church_marriage_place'],['mspouse','church_marriage_spouse'],['notes','sacrament_notes']].forEach(([a,b])=>$(a).value=x[b]||'');window.scrollTo({top:0,behavior:'smooth'})}function resetForm(){$('id').value='';['bdate','bplace','cdate','cplace','kdate','kplace','mdate','mplace','mspouse','notes'].forEach(x=>$(x).value='');buildOptions()}async function save(e){e.preventDefault();const id=$('member').value;if(!id)return;const payload={baptism_date:$('bdate').value||null,baptism_place:$('bplace').value||null,first_communion_date:$('cdate').value||null,first_communion_place:$('cplace').value||null,confirmation_date:$('kdate').value||null,confirmation_place:$('kplace').value||null,church_marriage_date:$('mdate').value||null,church_marriage_place:$('mplace').value||null,church_marriage_spouse:$('mspouse').value||null,sacrament_notes:$('notes').value||null,updated_at:new Date().toISOString()};const r=await db.from('members').update(payload).eq('id',id);if(r.error){toast(r.error.message,true);return}toast('Taarifa zimehifadhiwa.');await load();}async function logout(){await db.auth.signOut();location.replace('login.html')}$('search').addEventListener('input',()=>{buildOptions();render()});load();</script></body></html>
