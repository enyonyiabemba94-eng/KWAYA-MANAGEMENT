ld full"><label>Mwimbaji *</label><select id="member" required style="height:40px;border:1px solid #dfe3ea;border-radius:9px;padding:10px"></select></div><div class="grid" style="margin-top:12px"><div class="field"><label>Ubatizo — Tarehe</label><input id="bdate" type="date"></div><div class="field"><label>Ubatizo — Parokia/Mahali</label><input id="bplace"></div><div class="field"><label>Komunyo ya Kwanza — Tarehe</label><input id="cdate" type="date"></div><div class="field"><label>Komunyo ya Kwanza — Parokia/Mahali</label><input id="cplace"></div><div class="field"><label>Kipaimara — Tarehe</label><input id="kdate" type="date"></div><div class="field"><label>Kipaimara — Parokia/Mahali</label><input id="kplace"></div><div class="field"><label>Ndoa ya Kanisa — Tarehe</label><input id="mdate" type="date"></div><div class="field"><label>Ndoa ya Kanisa — Parokia/Mahali</label><input id="mplace"></div><div class="field full"><label>Mwenza wa Ndoa</label><input id="mspouse"></div><div class="field full"><label>Maelezo ya ziada</label><textarea id="notes" rows="3"></textarea></div></div><div style="text-align:right;margin-top:14px"><button class="btn muted" type="button" onclick="resetForm()">Futa</button> <button class="btn primary">💾 Hifadhi Taarifa za Sakramenti</button></div></form></div><div class="card"><h3>Orodha ya Waimbaji</h3><div class="table"><table><thead><tr><th>Mwimbaji</th><th>Ubatizo</th><th>Komunyo</th><th>Kipaimara</th><th>Ndoa</th><th>Vitendo</th></tr></thead><tbody id="rows"></tbody></table></div></div></section></main><div class="toast" id="toast"></div><script>const db=supabase.createClient('https://xulnkdrgjgajmcqntwga.supabase.co','sb_publishable_J2OrXvOnQXxrf5t3XPmigg_5ULrsWO2');let rows=[];const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]));const nm=x=>[x.first_name,x.middle_name,x.last_name].filter(Boolean).join(' ');function toast(t,e=false){$('toast').textContent=t;$('toast').style.background=e?'#991b1b':'#166534';$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2500)}function resetForm(){$('id').value='';$('member').value='';['bdate','bplace','cdate','cplace','kdate','kplace','mdate','mplace','mspouse','notes'].forEach(x=>$(x).value='')}function fill(x){$('id').value=x.id;$('member').value=x.id;[['bdate','baptism_date'],['bplace','baptism_place'],['cdate','first_communion_date'],['cplace','first_communion_place'],['kdate','confirmation_date'],['kplace','confirmation_place'],['mdate','church_marriage_date'],['mplace','church_marriage_place'],['mspouse','church_marriage_spouse'],['notes','sacrament_notes']].forEach(([a,b])=>$(a).value=x[b]||'');window.scrollTo({top:0,behavior:'smooth'})}async function load(){const {data,error}=await db.from('members').select('id,first_name,middle_name,last_name,baptism_date,baptism_place,first_communion_date,first_communion_place,confirmation_date,confirmation_place,church_marriage_date,church_marriage_place,church_marriage_spouse,sacrament_notes').order('first_name');if(error){toast(error.message,true);return}rows=data||[];const q=($('search').value||'').toLowerCase();const list=rows.filter(x=>nm(x).toLowerCase().includes(q));$('member').innerHTML='<option value="">Chagua mwimbaji</option>'+list.map(x=>'<option value="'+x.id+'">'+esc(nm(x))+'</option>').join('');$('rows').innerHTML=list.length?list.map(x=>'<tr><td><b>'+esc(nm(x))+'</b></td><td class="status">'+(x.baptism_date?'✓ '+esc(x.baptism_date):'—')+'</td><td class="status">'+(x.first_communion_date?'✓ '+esc(x.first_communion_date):'—')+'</td><td class="status">'+(x.confirmation_date?'✓ '+esc(x.confirmation_date):'—')+'</td><td class="status">'+(x.church_marriage_date?'✓ '+esc(x.church_marriage_date):'—')+'</td><td><button class="btn muted" onclick="fill(rows.find(r=>r.id===\''+x.id+'\'))">✏️ Hariri</button></td></tr>').join(''):'<tr><td colspan="6" class="empty">Hakuna mwimbaji.</td></tr>'}async function save(e){e.preventDefault();const id=$('member').value;if(!id)return;const payload={baptism_date:$('bdate').value||null,baptism_place:$('bplace').value||null,first_communion_date:$('cdate').value||null,first_communion_place:$('cplace').value||null,confirmation_date:$('kdate').value||null,confirmation_place:$('kplace').value||null,church_marriage_date:$('mdate').value||null,church_marriage_place:$('mplace').value||null,church_marriage_spouse:$('mspouse').value||null,sacrament_notes:$('notes').value||null,updated_at:new Date().toISOString()};const {error}=await db.from('members').update(payload).eq('id',id);if(error){toast(error.message,true);return}toast('Taarifa za sakramenti zimehifadhiwa.');await load();const x=rows.find(r=>r.id===id);if(x)fill(x)}$('search').addEventListener('input',load);async function logout(){await db.auth.signOut();location.replace('login.html')}load().catch(e=>toast(e.message,true));</script></body></html>
