<!doctype html><html lang="sw"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#18122b"><title>Dashibodi ya Mwimbaji | Kwaya ya Kristu Mfalme</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./auth-guard.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f6fa;color:#1f2937}.top{background:#18122b;color:#fff;padding:18px 16px}.brand{display:flex;align-items:center;gap:12px;max-width:900px;margin:auto}.brand img{width:50px;height:50px;object-fit:contain}.brand b{font-size:15px}.brand small{display:block;color:#cfc7dc;font-size:10px;margin-top:4px}.wrap{max-width:900px;margin:auto;padding:18px}.welcome{background:linear-gradient(135deg,#4c1d95,#6d28d9);color:#fff;border-radius:16px;padding:22px;margin-bottom:16px}.welcome h2{margin:0 0 7px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px}.card h3{margin:0 0 10px;font-size:15px}.item{padding:10px 0;border-bottom:1px solid #eee;font-size:12px}.item:last-child{border-bottom:0}.links{display:grid;grid-template-columns:1fr 1fr;gap:10px}.links a{padding:13px;background:#f8f7ff;border-radius:10px;text-decoration:none;color:#312e81;font-size:12px;font-weight:700;text-align:center}.logout{float:right;border:0;border-radius:9px;padding:9px 13px;font-weight:700}@media(max-width:600px){.cards{grid-template-columns:1fr}.links{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="brand"><img src="https://raw.githubusercontent.com/enyonyiabemba94-eng/KWAYA-MANAGEMENT/main/KWAYA%20YA%20KRISTO%20MFALME%20NYARUGUSU%2020260902_141303.jpg"><div><b>KWAYA YA KRISTU MFALME</b><small>ENEO LA MWIMBAJI</small></div><button class="logout" onclick="logout()">Toka</button></div></header><main class="wrap"><section class="welcome"><h2 id="hello">Karibu, Mwimbaji</h2><p>Hapa utaona taarifa zinazokuhusu kama mwimbaji wa Kwaya ya Kristu Mfalme.</p></section><section class="cards"><div class="card"><h3>📢 Taarifa Mpya</h3><div id="news">Inapakia...</div></div><div class="card"><h3>📅 Ratiba Zinazokuja</h3><div id="events">Inapakia...</div></div></section><section class="card" style="margin-top:14px"><h3>🎵 Ufikiaji wa Haraka</h3><div class="links"><a href="songs.html">🎵 Nyimbo</a><a href="mass-programmes.html">📖 Mpango wa Misa</a><a href="events.html">📅 Ratiba</a><a href="announcements.html">📢 Taarifa</a></div></section></main><script>const db=supabase.createClient('https://xulnkdrgjgajmcqntwga.supabase.co','sb_publishable_J2OrXvOnQXxrf5t3XPmigg_5ULrsWO2');const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]));async function load(){const {data:{session}}=await db.auth.getSession();if(!session)return;const p=await db.from('profiles').select('full_name,role').eq('id',session.user.id).maybeSingle();if(p.data?.role!=='member')return; $('hello').textContent='Karibu, '+(p.data.full_name||'Mwimbaji');const [n,e]=await Promise.all([db.from('announcements').select('title,content,publish_date').eq('published',true).order('publish_date',{ascending:false}).limit(5),db.from('events').select('title,event_date,start_time,location').gte('event_date',new Date().toISOString().slice(0,10)).order('event_date').limit(5)]);$('news').innerHTML=n.data?.length?n.data.map(x=>`<div class="item"><b>${esc(x.title||'Taarifa')}</b><br>${esc(x.content||'').slice(0,160)}</div>`).join(''):'Hakuna taarifa mpya.';$('events').innerHTML=e.data?.length?e.data.map(x=>`<div class="item"><b>${esc(x.title||'Ratiba')}</b><br>${esc(x.event_date||'')}${x.start_time?' • '+esc(x.start_time):''}${x.location?' • '+esc(x.location):''}</div>`).join(''):'Hakuna ratiba inayokuja.'}async function logout(){await db.auth.signOut();location.replace('login.html')}load().catch(console.error);</script></body></html>
