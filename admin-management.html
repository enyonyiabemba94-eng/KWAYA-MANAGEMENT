<!doctype html>
<html lang="sw">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#18122b"><title>Usimamizi wa Mamlaka | Kwaya ya Kristu Mfalme</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./auth-guard.js"></script>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f6fa;font-family:Arial,sans-serif;color:#1f2937}.wrap{max-width:900px;margin:auto;padding:18px}.head{background:#18122b;color:#fff;border-radius:16px;padding:22px;margin-bottom:16px}.head h1{margin:0 0 7px;font-size:22px}.head p{margin:0;color:#d9d3e5;font-size:12px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px;margin-bottom:16px}.card h2{font-size:16px;margin:0 0 12px}.notice{padding:12px;border-radius:10px;background:#f8f7ff;color:#4338ca;font-size:12px;line-height:1.5}.toolbar{display:flex;gap:10px;margin-bottom:12px}.search{width:100%;border:1px solid #d1d5db;border-radius:9px;padding:11px;font-size:13px;outline:0}.admin{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid #eee}.admin:last-child{border-bottom:0}.name{font-weight:800;font-size:13px}.meta{font-size:11px;color:#6b7280;margin-top:4px}.role{display:inline-block;padding:3px 7px;border-radius:20px;background:#f3f4f6;margin-right:5px}.role.super{background:#ede9fe;color:#5b21b6}.role.admin{background:#e0f2fe;color:#075985}.btn{border:0;border-radius:9px;padding:10px 13px;background:#6d28d9;color:#fff;font-weight:800;cursor:pointer;white-space:nowrap}.btn:disabled{opacity:.5}.msg{display:none;margin-top:12px;padding:10px;border-radius:9px;font-size:12px}.ok{display:block;background:#dcfce7;color:#166534}.err{display:block;background:#fee2e2;color:#991b1b}.empty{color:#6b7280;font-size:12px;padding:10px 0}@media(max-width:600px){.admin{align-items:flex-start;flex-direction:column}.btn{width:100%}.toolbar{display:block}}
</style>
</head><body><main class="wrap"><section class="head"><h1>👑 Usimamizi wa Mamlaka</h1><p>Eneo hili ni la Super Admin pekee.</p></section><section class="card"><h2>Handover ya Super Admin</h2><div class="notice">Ukiamua kuondoka, unaweza kuchagua profile ya mtu unayemwamini. Mfumo utamkabidhi Super Admin na akaunti yako itakuwa Admin. Handover haiwezi kufanywa na Admin wa kawaida.</div></section><section class="card"><h2>Chagua mrithi wa mamlaka</h2><div class="toolbar"><input id="search" class="search" placeholder="🔎 Tafuta kwa jina..." oninput="filterRows()"></div><div id="list" class="empty">Inapakia...</div><div id="msg" class="msg"></div></section></main>
<script>
const db=supabase.createClient('https://xulnkdrgjgajmcqntwga.supabase.co','sb_publishable_J2OrXvOnQXxrf5t3XPmigg_5ULrsWO2');
const $=id=>document.getElementById(id);let currentUser=null,rows=[];
function msg(text,good){$('msg').textContent=text;$('msg').className='msg '+(good?'ok':'err')}
function esc(s){return String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]))}
async function load(){
 const {data:{session}}=await db.auth.getSession();if(!session){location.replace('login.html');return}currentUser=session.user;
 const {data:me}=await db.from('profiles').select('id,full_name,role').eq('id',currentUser.id).maybeSingle();
 if(me?.role!=='super_admin' && currentUser.app_metadata?.role!=='super_admin'){document.body.innerHTML='<main class="wrap"><section class="card"><h2>Huna ruhusa</h2><p>Eneo hili linapatikana kwa Super Admin pekee.</p></section></main>';return}
 const {data,error}=await db.from('profiles').select('id,full_name,role').order('full_name');
 if(error){$('list').textContent='Imeshindikana kusoma profiles.';msg(error.message,false);return}
 rows=data||[];render();
}
function filterRows(){render()}
function render(){
 const q=($('search').value||'').trim().toLowerCase();
 const visible=rows.filter(x=>(x.full_name||'').toLowerCase().includes(q));
 if(!visible.length){$('list').innerHTML='<div class="empty">Hakuna profile inayolingana na utafutaji.</div>';return}
 $('list').innerHTML=visible.map(x=>{const isMe=x.id===currentUser.id;const isSuper=x.role==='super_admin';const role=isSuper?'<span class="role super">👑 Super Admin</span>':x.role==='admin'?'<span class="role admin">🛠️ Admin</span>':'<span class="role">Mwanachama / profile</span>';const can=isMe||isSuper?'':`<button class="btn" onclick="handover('${x.id}')">Mkabidhi Super Admin</button>`;return `<div class="admin"><div><div class="name">${esc(x.full_name||'Akaunti bila jina')}</div><div class="meta">${role}${isMe?' · Akaunti yako':''}</div></div>${can}</div>`}).join('')
}
async function handover(id){
 const target=rows.find(x=>x.id===id);if(!target||id===currentUser.id||target.role==='super_admin')return;
 const ok=confirm(`Unataka kumkabidhi ${target.full_name||'mtu huyu'} mamlaka ya Super Admin?\n\nBaada ya hapo akaunti yako itakuwa Admin.`);if(!ok)return;
 const buttons=document.querySelectorAll('.btn');buttons.forEach(b=>b.disabled=true);
 const {error}=await db.rpc('transfer_super_admin',{target_user_id:id});
 if(error){msg('Handover haikufanikiwa: '+error.message,false);buttons.forEach(b=>b.disabled=false);return}
 msg('Mamlaka yamehamishwa. Akaunti yako sasa ni Admin.',true);setTimeout(()=>location.replace('index.html'),1400)
}
load();
</script></body></html>
