<!doctype html><html lang="sw"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vitabu vya Nyimbo | KWAYA MANAGEMENT</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f6fa;color:#1f2937}.side{position:fixed;inset:0 auto 0 0;width:250px;background:#18122b;padding:18px 12px}.brand{color:#fff;padding:10px;border-bottom:1px solid #ffffff18;font-weight:800}.brand small{display:block;color:#b9aecf;font-size:10px}.nav{margin-top:18px}.nav a{display:block;color:#d9d3e5;text-decoration:none;padding:11px 13px;border-radius:9px;font-size:13px}.nav a.active,.nav a:hover{background:#8b5cf633;color:#fff}.main{margin-left:250px}.top{height:72px;background:#fff;border-bottom:1px solid #e5e7eb;padding:0 25px;display:flex;justify-content:space-between;align-items:center}.top h1{font-size:21px;margin:0}.content{padding:25px}.layout{display:grid;grid-template-columns:1fr 1.5fr;gap:18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px}.card h2{font-size:15px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.field label{font-size:11px;font-weight:700}input,textarea,select{width:100%;border:1px solid #dfe3ea;border-radius:9px;padding:10px;font:inherit;font-size:13px}input,select{height:40px}.btn{border:0;border-radius:9px;padding:10px 13px;font-weight:700;cursor:pointer}.primary{background:#6d28d9;color:#fff}.muted{background:#f3f4f6}.danger{background:#fee2e2;color:#991b1b}.book{border:1px solid #eee;border-radius:10px;padding:12px;margin:8px 0;cursor:pointer}.book.sel{border-color:#8b5cf6;background:#faf7ff}.song{display:flex;justify-content:space-between;gap:10px;padding:10px;border-bottom:1px solid #eee;font-size:12px}.check{display:flex;gap:9px;align-items:center}.actions{display:flex;gap:7px;flex-wrap:wrap}.toast{display:none;position:fixed;right:20px;bottom:20px;background:#166534;color:#fff;padding:12px 16px;border-radius:9px}.toast.show{display:block}.menu{display:none}@media(max-width:850px){.layout{grid-template-columns:1fr}}@media(max-width:700px){.side{transform:translateX(-100%);transition:.2s;z-index:5}.side.open{transform:none}.main{margin-left:0}.menu{display:inline-block;border:0;background:#f3f4f6;border-radius:8px;width:38px;height:38px}.top{padding:0 15px}.content{padding:15px}}
</style></head><body><aside class="side" id="side"><div class="brand">🎶 KWAYA MANAGEMENT<small>Usimamizi wa Kwaya Kristo Mfalme</small></div><nav class="nav"><a href="index.html">🏠 Dashboard</a><a href="members.html">👥 Waimbaji</a><a href="attendance.html">📋 Mahudhurio</a><a href="songs.html">🎵 Nyimbo</a><a class="active" href="song-books.html">📚 Vitabu vya Nyimbo</a><a href="sacraments.html">⛪ Sakramenti</a><a href="reports.html">📊 Ripoti</a><a href="events.html">📅 Ratiba</a><a href="announcements.html">📢 Taarifa</a><a href="documents.html">📄 Nyaraka</a><a href="settings.html">⚙️ Mipangilio</a></nav></aside><main class="main"><header class="top"><div><button class="menu" onclick="side.classList.toggle('open')">☰</button> <h1 style="display:inline">Vitabu vya Nyimbo</h1></div><button class="btn muted" onclick="logout()">Toka</button></header><section class="content"><div class="layout"><div class="card"><h2>Vitabu</h2><div class="field"><label>Jina la Kitabu *</label><input id="title"></div><div class="field"><label>Sub-title</label><input id="sub"></div><div class="field"><label>Maelezo</label><textarea id="desc" rows="3"></textarea></div><div class="actions"><button class="btn primary" onclick="saveBook()">Hifadhi Kitabu</button><button class="btn muted" onclick="newBook()">Kitabu Kipya</button></div><hr><div id="books"></div></div><div class="card"><h2>Nyimbo za Kitabu</h2><input id="search" placeholder="Tafuta wimbo..." oninput="renderSongs()"><div id="songs" style="margin-top:10px"></div><div class="actions" style="margin-top:15px"><button class="btn primary" onclick="saveSongs()">Hifadhi Nyimbo za Kitabu</button><button class="btn muted" onclick="load()">↻ Refresh</button></div></div></div></section></main><div class="toast" id="toast"></div><script>const db=supabase.createClient('https://xulnkdrgjgajmcqntwga.supabase.co','sb_publishable_J2OrXvOnQXxrf5t3XPmigg_5ULrsWO2');let books=[],songs=[],selectedBook=null,selected=[];const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function toast(m,e=false){$('toast').textContent=m;$('toast').style.background=e?'#991b1b':'#166534';$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2500)}async function load(){let [b,s]=await Promise.all([db.from('song_books').select('*').order('created_at',{ascending:false}),db.from('songs').select('id,song_number,title,composer').order('song_number')]);if(b.error||s.error)return toast((b.error||s.error).message,true);books=b.data||[];songs=s.data||[];renderBooks();renderSongs()}function renderBooks(){$('books').innerHTML=books.length?books.map(b=>`<div class="book ${selectedBook===b.id?'sel':''}" onclick="choose('${b.id}')"><b>${esc(b.title)}</b><br><small>${esc(b.subtitle||b.description||'')}</small></div>`).join(''):'<p style="color:#6b7280;font-size:12px">Hakuna kitabu.</p>'}async function choose(id){selectedBook=id;let b=books.find(x=>x.id===id);$('title').value=b.title;$('sub').value=b.subtitle||'';$('desc').value=b.description||'';let r=await db.from('song_book_songs').select('song_id,position').eq('song_book_id',id).order('position');if(r.error)return toast(r.error.message,true);selected=(r.data||[]).sort((a,b)=>a.position-b.position).map(x=>x.song_id);renderBooks();renderSongs()}function renderSongs(){let q=$('search').value.toLowerCase();let a=songs.filter(x=>!q||`${x.song_number} ${x.title} ${x.composer||''}`.toLowerCase().includes(q));$('songs').innerHTML=a.map(x=>`<div class="song"><label class="check"><input type="checkbox" value="${x.id}" ${selected.includes(x.id)?'checked':''} onchange="toggleSong('${x.id}',this.checked)"><span><b>${x.song_number}. ${esc(x.title)}</b><br><small>${esc(x.composer||'')}</small></span></label></div>`).join('')||'<p style="color:#6b7280;font-size:12px">Hakuna wimbo.</p>'}function toggleSong(id,on){if(on&&!selected.includes(id))selected.push(id);if(!on)selected=selected.filter(x=>x!==id)}function newBook(){selectedBook=null;selected=[];$('title').value='';$('sub').value='';$('desc').value='';renderBooks();renderSongs()}async function saveBook(){let title=$('title').value.trim();if(!title)return toast('Weka jina la kitabu',true);let o={title,subtitle:$('sub').value.trim()||null,description:$('desc').value.trim()||null,updated_at:new Date().toISOString()};let r=selectedBook?await db.from('song_books').update(o).eq('id',selectedBook):await db.from('song_books').insert(o).select().single();if(r.error)return toast(r.error.message,true);if(!selectedBook)selectedBook=r.data.id;toast('Kitabu kimehifadhiwa');load()}async function saveSongs(){if(!selectedBook)return toast('Chagua au hifadhi kitabu kwanza',true);let d=await db.from('song_book_songs').delete().eq('song_book_id',selectedBook);if(d.error)return toast(d.error.message,true);if(selected.length){let rows=selected.map((id,i)=>({song_book_id:selectedBook,song_id:id,position:i+1}));let r=await db.from('song_book_songs').insert(rows);if(r.error)return toast(r.error.message,true)}toast('Nyimbo za kitabu zimehifadhiwa');choose(selectedBook)}async function logout(){await db.auth.signOut();location.href='index.html'}load();</script></body></html>
