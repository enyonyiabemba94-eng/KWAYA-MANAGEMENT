<!doctype html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#18122b">
<title>Ingia | Kwaya ya Kristu Mfalme</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#18122b,#4c1d95);font-family:Arial,sans-serif}.box{width:min(92vw,440px);background:#fff;border-radius:20px;padding:28px;box-shadow:0 20px 60px #0005}.logo{width:82px;height:82px;object-fit:contain;display:block;margin:0 auto 14px}.title{text-align:center;color:#18122b;font-size:22px;font-weight:900}.sub{text-align:center;color:#6b7280;font-size:12px;margin:5px 0 18px}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:10px;font-size:14px}.btn{width:100%;border:0;border-radius:10px;padding:13px;background:#6d28d9;color:#fff;font-weight:800;font-size:14px;cursor:pointer}.btn:disabled{opacity:.6}.switch{display:flex;gap:8px;margin:18px 0}.switch button{flex:1;padding:10px;border:1px solid #ddd;border-radius:9px;background:#f7f7f8;font-weight:700}.switch button.active{background:#ede9fe;color:#5b21b6;border-color:#c4b5fd}.forgot{text-align:right;margin:8px 0 4px}.forgot button{border:0;background:none;color:#6d28d9;font-size:12px;font-weight:800;cursor:pointer}.error,.ok{display:none;margin-top:14px;padding:10px;border-radius:9px;font-size:12px}.error{background:#fee2e2;color:#991b1b}.ok{background:#dcfce7;color:#166534}.hint{text-align:center;color:#9ca3af;font-size:10px;margin-top:18px}.hidden{display:none!important}.back{border:0;background:none;color:#6d28d9;font-weight:800;margin-bottom:8px;cursor:pointer}.loading{text-align:center;color:#6b7280;font-size:12px;margin-top:10px;display:none}
</style>
</head>
<body>
<main class="box">
<img class="logo" src="https://raw.githubusercontent.com/enyonyiabemba94-eng/KWAYA-MANAGEMENT/main/KWAYA%20YA%20KRISTO%20MFALME%20NYARUGUSU%2020260902_141303.jpg" alt="Kwaya ya Kristu Mfalme">
<div class="title">KWAYA YA KRISTU MFALME</div>
<div class="sub">MFUMO WA USIMAMIZI WA KWAYA</div>
<div id="authView">
<div class="switch"><button id="loginTab" class="active" type="button">Ingia</button><button id="signupTab" type="button">Jisajili</button></div>
<form id="form">
<div class="field"><label>Email au namba ya simu</label><input id="identity" type="text" autocomplete="username" required></div>
<div class="field"><label>Neno la siri</label><input id="password" type="password" autocomplete="current-password" minlength="6" required></div>
<div class="field" id="nameField" style="display:none"><label>Jina kamili</label><input id="fullName" type="text" autocomplete="name"></div>
<div class="field" id="phoneField" style="display:none"><label>Namba ya simu</label><input id="phone" type="tel" autocomplete="tel" placeholder="+255..." ></div>
<div class="forgot"><button id="forgotBtn" type="button">Umesahau neno la siri?</button></div>
<button class="btn" id="submitBtn" type="submit">Ingia</button>
<div class="loading" id="loading">Inakagua akaunti...</div><div class="error" id="error"></div><div class="ok" id="ok"></div>
</form></div>
<div id="resetView" class="hidden"><button class="back" id="backBtn" type="button">← Rudi</button><h3>Weka OTP</h3>
<div class="field"><label>Email au namba ya simu</label><input id="resetIdentity" type="text" autocomplete="username"></div>
<div id="otpStep"><button class="btn" id="sendOtp" type="button">Tuma OTP</button></div>
<div id="verifyStep" class="hidden"><div class="field"><label>OTP</label><input id="otp" inputmode="numeric" maxlength="6" placeholder="123456"></div><div class="field"><label>Neno jipya la siri</label><input id="newPass" type="password" minlength="6"></div><div class="field"><label>Rudia neno la siri</label><input id="repeatPass" type="password" minlength="6"></div><button class="btn" id="verifyOtp" type="button">Thibitisha OTP na badilisha</button></div>
<div class="error" id="resetError"></div><div class="ok" id="resetOk"></div></div>
<div class="hint">Akaunti mpya hupewa role ya Mwanachama moja kwa moja.</div>
</main>
<script>
const db=supabase.createClient('https://xulnkdrgjgajmcqntwga.supabase.co','sb_publishable_J2OrXvOnQXxrf5t3XPmigg_5ULrsWO2');
const $=id=>document.getElementById(id);let mode='login',resetChannel=null;
function show(id,text,type){const el=$(id);el.textContent=text;el.style.display='block';}
function clearMessages(){['error','ok','resetError','resetOk'].forEach(id=>$(id).style.display='none')}
function setMode(m){mode=m;const signup=m==='signup';$('loginTab').classList.toggle('active',!signup);$('signupTab').classList.toggle('active',signup);$('nameField').style.display=signup?'block':'none';$('phoneField').style.display=signup?'block':'none';$('fullName').required=signup;$('submitBtn').textContent=signup?'Tengeneza Akaunti':'Ingia';clearMessages()}
async function getRole(){const {data,error}=await db.rpc('get_my_role');if(error)throw error;return data||null}
async function waitForRole(attempts=5){for(let i=0;i<attempts;i++){const r=await getRole();if(r)return r;await new Promise(resolve=>setTimeout(resolve,400))}return null}
async function routeByRole(){const {data:{user}}=await db.auth.getUser();if(!user)throw new Error('Hakuna akaunti iliyoingia.');const r=await waitForRole();if(r==='member'){location.replace('member-dashboard.html');return true}if(r==='admin'||r==='super_admin'){location.replace('dashboard.html');return true}await db.auth.signOut();throw new Error('Akaunti hii haina role ya mfumo. Wasiliana na msimamizi.');}
async function existingSession(){const {data:{session}}=await db.auth.getSession();if(!session)return;try{await routeByRole()}catch(e){show('error','Imeshindikana kuthibitisha akaunti: '+e.message)} }
$('loginTab').onclick=()=>setMode('login');$('signupTab').onclick=()=>setMode('signup');
$('form').addEventListener('submit',async e=>{e.preventDefault();clearMessages();$('submitBtn').disabled=true;$('loading').style.display='block';try{const identity=$('identity').value.trim(),password=$('password').value;if(!identity)throw new Error('Weka email au namba ya simu.');if(password.length<6)throw new Error('Neno la siri lazima liwe na angalau herufi 6.');if(mode==='login'){const credentials=identity.includes('@')?{email:identity,password}:{phone:identity,password};const {error}=await db.auth.signInWithPassword(credentials);if(error)throw error;await routeByRole()}else{const name=$('fullName').value.trim(),phone=$('phone').value.trim();if(!name)throw new Error('Weka jina kamili.');if(!identity.includes('@')&&!phone)throw new Error('Weka email au namba ya simu.');const payload=identity.includes('@')?{email:identity,password,options:{data:{full_name:name}}}:{phone:phone,password,options:{data:{full_name:name}}};const {data,error}=await db.auth.signUp(payload);if(error)throw error;if(data.session){await routeByRole()}else{show('ok','Akaunti imetengenezwa. Thibitisha akaunti yako kisha ingia.','ok');setMode('login')}}}catch(err){show('error','Imeshindikana: '+(err?.message||err))}finally{$('submitBtn').disabled=false;$('loading').style.display='none'}});
$('forgotBtn').onclick=()=>{$('authView').classList.add('hidden');$('resetView').classList.remove('hidden');clearMessages()};
$('backBtn').onclick=()=>{$('resetView').classList.add('hidden');$('authView').classList.remove('hidden');clearMessages()};
$('sendOtp').onclick=async()=>{clearMessages();const id=$('resetIdentity').value.trim();if(!id){show('resetError','Weka email au namba ya simu.');return}$('sendOtp').disabled=true;try{const isEmail=id.includes('@');const request=isEmail?{email:id,options:{shouldCreateUser:false}}:{phone:id,options:{shouldCreateUser:false}};const {error}=await db.auth.signInWithOtp(request);if(error)throw error;resetChannel=isEmail?'email':'sms';$('otpStep').classList.add('hidden');$('verifyStep').classList.remove('hidden');show('resetOk','OTP imetumwa. Iingize hapa chini.')}catch(e){show('resetError','Imeshindikana kutuma OTP: '+e.message)}finally{$('sendOtp').disabled=false}};
$('verifyOtp').onclick=async()=>{clearMessages();const id=$('resetIdentity').value.trim(),otp=$('otp').value.trim(),p=$('newPass').value,p2=$('repeatPass').value;if(!/^\d{6}$/.test(otp)){show('resetError','Weka OTP yenye tarakimu 6.');return}if(p.length<6||p!==p2){show('resetError','Maneno ya siri hayafanani au ni mafupi.');return}$('verifyOtp').disabled=true;try{const key=resetChannel==='email'?'email':'phone';const {error}=await db.auth.verifyOtp({[key]:id,token:otp,type:resetChannel==='email'?'email':'sms'});if(error)throw error;const {error:updateError}=await db.auth.updateUser({password:p});if(updateError)throw updateError;show('resetOk','Neno la siri limebadilishwa. Sasa unaweza kuingia.');setTimeout(()=>$('backBtn').click(),1200)}catch(e){show('resetError','OTP si sahihi au imekwisha muda: '+e.message)}finally{$('verifyOtp').disabled=false}};
existingSession();setMode('login');
</script>
</body></html>
