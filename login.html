ton></div><div id="verifyStep" class="hidden"><div class="field"><label>OTP</label><input id="otp" inputmode="numeric" maxlength="6" placeholder="123456"></div><div class="field"><label id="newPassLabel">Neno jipya la siri</label><input id="newPass" type="password" minlength="6"></div><div class="field"><label id="repeatPassLabel">Rudia neno la siri</label><input id="repeatPass" type="password" minlength="6"></div><button class="btn" id="verifyOtp" type="button">Thibitisha OTP na badilisha</button></div><div class="error" id="resetError"></div><div class="ok" id="resetOk"></div></div><div class="hint" id="hint">Waimbaji wanaweza kujisajili wenyewe. Akaunti mpya hupewa role ya Mwanachama.</div></main><script>const db=supabase.createClient('https://xulnkdrgjgajmcqntwga.supabase.co','sb_publishable_J2OrXvOnQXxrf5t3XPmigg_5ULrsWO2');const $=id=>document.getElementById(id);let mode='login',resetChannel=null;const T={sw:{sub:'MFUMO WA USIMAMIZI WA KWAYA',login:'Ingia',signup:'Jisajili',identity:'Email au namba ya simu',pass:'Neno la siri',name:'Jina kamili',forgot:'Umesahau neno la siri?',create:'Tengeneza Akaunti',hint:'Waimbaji wanaweza kujisajili wenyewe. Akaunti mpya hupewa role ya Mwanachama.',send:'Tuma OTP',verify:'Thibitisha OTP na badilisha',reset:'Weka OTP',newpass:'Neno jipya la siri',repeat:'Rudia neno la siri',back:'← Rudi'},fr:{sub:'SYSTÈME DE GESTION DE LA CHORALE',login:'Se connecter',signup:"S'inscrire",identity:'Email ou numéro de téléphone',pass:'Mot de passe',name:'Nom complet',forgot:'Mot de passe oublié ?',create:'Créer le compte',hint:'Les choristes peuvent créer leur compte. Un nouveau compte reçoit le rôle Membre.',send:'Envoyer OTP',verify:"Vérifier l’OTP et changer",reset:'Réinitialisation par OTP',newpass:'Nouveau mot de passe',repeat:'Répéter le mot de passe',back:'← Retour'},en:{sub:'CHOIR MANAGEMENT SYSTEM',login:'Sign in',signup:'Register',identity:'Email or phone number',pass:'Password',name:'Full name',forgot:'Forgot password?',create:'Create Account',hint:'Choir members can register themselves. New accounts receive the Member role.',send:'Send OTP',verify:'Verify OTP and change',reset:'OTP Password Reset',newpass:'New password',repeat:'Repeat password',back:'← Back'}};function lang(){return localStorage.getItem('choirLanguage')||'sw'}function applyLang(){const t=T[lang()]||T.sw;$('language').value=lang();$('sub').textContent=t.sub;$('loginTab').textContent=t.login;$('signupTab').textContent=t.signup;$('identityLabel').textContent=t.identity;$('passwordLabel').textContent=t.pass;$('nameLabel').textContent=t.name;$('forgotBtn').textContent=t.forgot;$('submitBtn').textContent=mode==='signup'?t.create:t.login;$('hint').textContent=t.hint;$('sendOtp').textContent=t.send;$('verifyOtp').textContent=t.verify;$('resetTitle').textContent=t.reset;$('newPassLabel').textContent=t.newpass;$('repeatPassLabel').textContent=t.repeat;$('backBtn').textContent=t.back;$('resetIdentityLabel').textContent=t.identity}function msg(x,ok=false,reset=false){const a=$(reset?(ok?'resetOk':'resetError'):(ok?'ok':'error'));a.textContent=x;a.style.display='block';$(reset?(ok?'resetError':'resetOk'):(ok?'error':'ok')).style.display='none'}async function role(){const {data,error}=await db.from('profiles').select('role').eq('id',(await db.auth.getUser()).data.user.id).maybeSingle();if(error)throw error;return data?.role||null}async function route(){const r=await role();if(r==='member')location.replace('member-dashboard.html');else if(r==='admin'||r==='super_admin')location.replace('dashboard.html');else{await db.auth.signOut();msg('Akaunti hii haijawekewa role ya mfumo.')}}async function existing(){const {data:{session}}=await db.auth.getSession();if(session)try{await route()}catch(e){msg('Imeshindikana kusoma role ya akaunti: '+e.message)}}existing();function setMode(m){mode=m;const signup=m==='signup';$('loginTab').classList.toggle('active',!signup);$('signupTab').classList.toggle('active',signup);$('nameField').style.display=signup?'block':'none';$('phoneField').style.display=signup?'block':'none';$('fullName').required=signup;$('phone').required=false;$('submitBtn').textContent=signup?(T[lang()]||T.sw).create:(T[lang()]||T.sw).login;$('error').style.display='none';$('ok').style.display='none'}$('loginTab').onclick=()=>setMode('login');$('signupTab').onclick=()=>setMode('signup');$('language').onchange=()=>{localStorage.setItem('choirLanguage',$('language').value);applyLang()};$('form').addEventListener('submit',async e=>{e.preventDefault();$('submitBtn').disabled=true;$('error').style.display='none';$('ok').style.display='none';const identity=$('identity').value.trim(),password=$('password').value;if(mode==='login'){const credentials=identity.includes('@')?{email:identity,password}:{phone:identity,password};const {data,error}=await db.auth.signInWithPassword(credentials);if(error){msg((T[lang()]||T.sw).login+' failed: '+error.message);$('submitBtn').disabled=false;return}try{await route()}catch(e){msg('Imeshindikana kusoma role ya akaunti: '+e.message);$('submitBtn').disabled=false}}else{const name=$('fullName').value.trim();if(!name){msg('Weka jina kamili.');$('submitBtn').disabled=false;return}const phone=$('phone').value.trim();if(!identity.includes('@')&&!phone){msg('Weka email au namba ya simu.');$('submitBtn').disabled=false;return}const payload=identity.includes('@')?{email:identity,password,options:{data:{full_name:name}}}:{phone:phone,password,options:{data:{full_name:name}}};const {data,error}=await db.auth.signUp(payload);if(error){msg(error.message);$('submitBtn').disabled=false;return}if(data.session){try{await route()}catch(e){msg(e.message)}}else{msg('Akaunti imetengenezwa. Thibitisha OTP/email kulingana na mipangilio ya Supabase kisha ingia.',true);setMode('login')}$('submitBtn').disabled=false}});$('forgotBtn').onclick=()=>{$('authView').classList.add('hidden');$('resetView').classList.remove('hidden');$('resetError').style.display='none';$('resetOk').style.display='none'};$('backBtn').onclick=()=>{$('resetView').classList.add('hidden');$('authView').classList.remove('hidden')};$('sendOtp').onclick=async()=>{const id=$('resetIdentity').value.trim();if(!id){msg('Weka email au namba ya simu.',false,true);return}$('sendOtp').disabled=true;const isEmail=id.includes('@');const request=isEmail?{email:id,options:{shouldCreateUser:false}}:{phone:id,options:{shouldCreateUser:false}};const {error}=await db.auth.signInWithOtp(request);if(error){msg(error.message,false,true);$('sendOtp').disabled=false;return}resetChannel=isEmail?'email':'sms';$('otpStep').classList.add('hidden');$('verifyStep').classList.remove('hidden');msg('OTP imetumwa. Iingize hapa chini.',true,true);$('sendOtp').disabled=false};$('verifyOtp').onclick=async()=>{const id=$('resetIdentity').value.trim(),otp=$('otp').value.trim(),p=$('newPass').value,p2=$('repeatPass').value;if(!otp||otp.length<6){msg('Weka OTP yenye tarakimu 6.',false,true);return}if(p.length<6||p!==p2){msg('Maneno ya siri hayafanani au ni mafupi.',false,true);return}$('verifyOtp').disabled=true;const {error}=await db.auth.verifyOtp({[resetChannel==='email'?'email':'phone']:id,token:otp,type:resetChannel==='email'?'email':'sms'});if(error){msg('OTP si sahihi au imekwisha muda: '+error.message,false,true);$('verifyOtp').disabled=false;return}const {error:updateError}=await db.auth.updateUser({password:p});if(updateError){msg(updateError.message,false,true);$('verifyOtp').disabled=false;return}msg('Neno la siri limebadilishwa. Sasa unaweza kuingia.',true,true);setTimeout(()=>{$('backBtn').click()},1200);$('verifyOtp').disabled=false};applyLang();setMode('login');</script></body></html>
