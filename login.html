<!doctype html><html lang="sw"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#18122b"><title>Ingia | Kwaya ya Kristu Mfalme</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#18122b,#4c1d95);font-family:Arial,sans-serif}.box{width:min(92vw,420px);background:#fff;border-radius:20px;padding:28px;box-shadow:0 20px 60px #0005}.logo{width:82px;height:82px;object-fit:contain;display:block;margin:0 auto 14px}.title{text-align:center;color:#18122b;font-size:22px;font-weight:900}.sub{text-align:center;color:#6b7280;font-size:12px;margin:5px 0 24px}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:10px;font-size:14px}.btn{width:100%;border:0;border-radius:10px;padding:13px;background:#6d28d9;color:#fff;font-weight:800;font-size:14px}.switch{display:flex;gap:8px;margin:18px 0}.switch button{flex:1;padding:10px;border:1px solid #ddd;border-radius:9px;background:#f7f7f8;font-weight:700}.switch button.active{background:#ede9fe;color:#5b21b6;border-color:#c4b5fd}.error{display:none;margin-top:14px;padding:10px;border-radius:9px;background:#fee2e2;color:#991b1b;font-size:12px}.ok{display:none;margin-top:14px;padding:10px;border-radius:9px;background:#dcfce7;color:#166534;font-size:12px}.hint{text-align:center;color:#9ca3af;font-size:10px;margin-top:18px}</style></head><body><main class="box"><img class="logo" src="https://raw.githubusercontent.com/enyonyiabemba94-eng/KWAYA-MANAGEMENT/main/KWAYA%20YA%20KRISTO%20MFALME%20NYARUGUSU%2020260902_141303.jpg"><div class="title">KWAYA YA KRISTU MFALME</div><div class="sub">MFUMO WA USIMAMIZI WA KWAYA</div><div class="switch"><button id="loginTab" class="active" type="button">Ingia</button><button id="signupTab" type="button">Jisajili</button></div><form id="form"><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" minlength="6" required></div><div class="field" id="nameField" style="display:none"><label>Jina kamili</label><input id="fullName" type="text" autocomplete="name"></div><button class="btn" id="submitBtn" type="submit">Ingia</button><div class="error" id="error"></div><div class="ok" id="ok"></div></form><div class="hint">Waimbaji wanaweza kujisajili wenyewe. Akaunti mpya hupewa role ya Mwanachama.</div></main><script>const db=supabase.createClient('https://xulnkdrgjgajmcqntwga.supabase.co','sb_publishable_J2OrXvOnQXxrf5t3XPmigg_5ULrsWO2');const $=id=>document.getElementById(id);let mode='login';function msg(x,ok=false){$(ok?'ok':'error').textContent=x;$(ok?'ok':'error').style.display='block';$(ok?'error':'ok').style.display='none'}async function role(u){if(!u)return null;const {data}=await db.from('profiles').select('role').eq('id',u.id).maybeSingle();return data?.role||u.app_metadata?.role||null}async function route(u){const r=await role(u);if(r==='member')location.replace('member-dashboard.html');else if(r==='admin'||r==='super_admin')location.replace('dashboard.html');else{await db.auth.signOut();msg('Akaunti hii haijawekewa role ya mfumo.')}}async function existing(){const {data:{session}}=await db.auth.getSession();if(session)route(session.user)}existing();function setMode(m){mode=m;const signup=m==='signup';$('loginTab').classList.toggle('active',!signup);$('signupTab').classList.toggle('active',signup);$('nameField').style.display=signup?'block':'none';$('fullName').required=signup;$('submitBtn').textContent=signup?'Tengeneza Akaunti':'Ingia';$('error').style.display='none';$('ok').style.display='none'}$('loginTab').onclick=()=>setMode('login');$('signupTab').onclick=()=>setMode('signup');$('form').addEventListener('submit',async e=>{e.preventDefault();$('submitBtn').disabled=true;$('error').style.display='none';$('ok').style.display='none';if(mode==='login'){const {data,error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){msg('Email au password si sahihi.');$('submitBtn').disabled=false;return}await route(data.user)}else{const name=$('fullName').value.trim();const email=$('email').value.trim();const password=$('password').value;if(!name){msg('Weka jina kamili.');$('submitBtn').disabled=false;return}const {data,error}=await db.auth.signUp({email,password,options:{data:{full_name:name}}});if(error){msg(error.message.includes('already')?'Email hii tayari imesajiliwa.':error.message);$('submitBtn').disabled=false;return}if(data.user){if(data.session){await route(data.user)}else{msg('Akaunti imetengenezwa. Thibitisha email yako kisha ingia.',true);setMode('login')}}$('submitBtn').disabled=false}});</script></body></html>
