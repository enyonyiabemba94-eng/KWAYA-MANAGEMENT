<!doctype html><html lang="sw"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#18122b"><title>Chat | Kwaya ya Kristu Mfalme</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#f5f6fa;color:#1f2937;font-family:Arial,sans-serif}.top{background:linear-gradient(135deg,#18122b,#4c1d95);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5}.bar{max-width:1050px;margin:auto;display:flex;align-items:center;gap:12px}.back{color:#fff;text-decoration:none;font-size:22px}.brand{flex:1}.brand b{display:block;font-size:14px}.brand small{font-size:10px;color:#ddd}.wrap{max-width:1050px;margin:auto;padding:14px;display:grid;grid-template-columns:330px 1fr;gap:14px;height:calc(100vh - 76px)}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;overflow:hidden}.left{display:flex;flex-direction:column}.head{padding:14px;border-bottom:1px solid #eee;font-weight:800;color:#35145f}.search{margin:10px 12px;padding:11px;border:1px solid #ddd;border-radius:10px;width:calc(100% - 24px)}.people{overflow:auto}.person{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid #f0f0f0;cursor:pointer}.person:hover{background:#faf8ff}.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#ede9fe;flex:none}.pname{font-size:13px;font-weight:800}.sub{font-size:10px;color:#888;margin-top:3px}.chat{display:flex;flex-direction:column;min-width:0}.chathead{padding:13px 15px;border-bottom:1px solid #eee;font-weight:800}.messages{flex:1;overflow:auto;padding:16px;background:#fafafa}.empty{text-align:center;padding:35px;color:#999;font-size:12px}.msg{max-width:75%;margin:7px 0;padding:10px 12px;border-radius:14px;background:#fff;border:1px solid #eee;font-size:13px;line-height:1.4}.mine{margin-left:auto;background:#ede9fe;border-color:#ddd0ff}.time{display:block;font-size:9px;color:#999;margin-top:4px;text-align:right}.composer{display:flex;gap:8px;padding:10px;border-top:1px solid #eee}.input{flex:1;border:1px solid #ddd;border-radius:22px;padding:11px 14px;outline:none}.send{border:0;border-radius:22px;padding:0 18px;background:#5b21b6;color:#fff;font-weight:800}.notice{padding:12px;background:#fff4d6;color:#795b00;font-size:11px}@media(max-width:700px){.wrap{grid-template-columns:1fr;height:auto}.left{height:42vh}.chat{height:55vh}.msg{max-width:85%}}</style></head><body><header class="top"><div class="bar"><a class="back" href="member-dashboard.html">‹</a><div class="brand"><b>KWAYA YA KRISTU MFALME</b><small>CHAT YA WANAKWAYA</small></div></div></header><main class="wrap"><section class="card left"><div class="head">💬 Wanakwaya</div><input id="search" class="search" placeholder="Tafuta mwanakwaya..."><div id="people" class="people"><div class="empty">Inapakia...</div></div></section><section class="card chat"><div id="chathead" class="chathead">Chagua mwanakwaya kuanza chat</div><div id="messages" class="messages"><div class="empty">Ujumbe wako utaonekana hapa.</div></div><div class="composer"><input id="message" class="input" placeholder="Andika ujumbe..." autocomplete="off"><button id="send" class="send">Tuma</button></div></section></main><script>const db=supabase.createClient('https://xulnkdrgjgajmcqntwga.supabase.co','sb_publishable_J2OrXvOnQXxrf5t3XPmigg_5ULrsWO2');const $=id=>document.getElementById(id);let me=null,profiles=[],selected=null,conversation=null,channel=null;const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]));function fullName(p){return p.full_name||'Mwimbaji'}async function init(){const {data:{session}}=await db.auth.getSession();if(!session){location.replace('login.html');return}me=session.user;const {data,error}=await db.from('profiles').select('id,full_name,avatar_url,member_id').neq('id',me.id).order('full_name');if(error){$('people').innerHTML='<div class="notice">Imeshindikana kupakia wanakwaya.</div>';return}profiles=data||[];renderPeople()}function renderPeople(){const q=($('search').value||'').toLowerCase();const rows=profiles.filter(p=>fullName(p).toLowerCase().includes(q));$('people').innerHTML=rows.length?rows.map(p=>'<div class="person" data-id="'+p.id+'">'+(p.avatar_url?'<img class="avatar" src="'+esc(p.avatar_url)+'">':'<div class="avatar"></div>')+'<div><div class="pname">'+esc(fullName(p))+'</div><div class="sub">Mwimbaji</div></div></div>').join(''):'<div class="empty">Hakuna mwanakwaya.</div>';document.querySelectorAll('.person').forEach(el=>el.onclick=()=>selectPerson(el.dataset.id))}async function selectPerson(id){selected=profiles.find(p=>p.id===id);if(!selected)return;$('chathead').textContent='💬 '+fullName(selected);await getConversation();await loadMessages();subscribe()}async function getConversation(){const {data:mine}=await db.from('chat_conversation_members').select('conversation_id').eq('user_id',me.id);const ids=(mine||[]).map(x=>x.conversation_id);conversation=null;if(ids.length){const {data:rows}=await db.from('chat_conversation_members').select('conversation_id,user_id').in('conversation_id',ids).eq('user_id',selected.id);const found=(rows||[]).find(x=>ids.includes(x.conversation_id));if(found){const {data:c}=await db.from('chat_conversations').select('id,is_group,name').eq('id',found.conversation_id).maybeSingle();conversation=c||null}}if(!conversation){const {data:c,error}=await db.from('chat_conversations').insert({is_group:false,created_by:me.id,name:fullName(selected)}).select().single();if(error){$('messages').innerHTML='<div class="notice">Huwezi kuanzisha chat kwa sasa.</div>';return}conversation=c;const {error:e1}=await db.from('chat_conversation_members').insert([{conversation_id:c.id,user_id:me.id},{conversation_id:c.id,user_id:selected.id}]);if(e1){$('messages').innerHTML='<div class="notice">Imeshindikana kuunganisha chat.</div>';return}}}async function loadMessages(){if(!conversation)return;const {data,error}=await db.from('chat_messages').select('id,sender_id,body,created_at').eq('conversation_id',conversation.id).order('created_at',{ascending:true}).limit(200);if(error){$('messages').innerHTML='<div class="notice">Imeshindikana kupakia ujumbe.</div>';return}renderMessages(data||[])}function renderMessages(rows){$('messages').innerHTML=rows.length?rows.map(m=>'<div class="msg '+(m.sender_id===me.id?'mine':'')+'">'+esc(m.body).replace(/\n/g,'<br>')+'<span class="time">'+new Date(m.created_at).toLocaleString('sw-TZ',{hour:'2-digit',minute:'2-digit'})+'</span></div>').join(''):'<div class="empty">Bado hamjaandikiana. Anza mazungumzo 👋</div>';$('messages').scrollTop=$('messages').scrollHeight}function subscribe(){if(channel)db.removeChannel(channel);channel=db.channel('chat-'+conversation.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'chat_messages',filter:'conversation_id=eq.'+conversation.id},payload=>{const m=payload.new;const el=document.createElement('div');el.className='msg '+(m.sender_id===me.id?'mine':'');el.innerHTML=esc(m.body).replace(/\n/g,'<br>')+'<span class="time">'+new Date(m.created_at).toLocaleString('sw-TZ',{hour:'2-digit',minute:'2-digit'})+'</span>';$('messages').appendChild(el);$('messages').scrollTop=$('messages').scrollHeight}).subscribe()}async function send(){const body=$('message').value.trim();if(!body||!conversation)return;const {error}=await db.from('chat_messages').insert({conversation_id:conversation.id,sender_id:me.id,body});if(!error)$('message').value='';else alert('Ujumbe haujatumwa.')}$('send').onclick=send;$('message').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});$('search').addEventListener('input',renderPeople);init().catch(console.error);</script></body></html>
