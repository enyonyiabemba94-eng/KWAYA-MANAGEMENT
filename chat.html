<!doctype html><html lang="sw"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#18122b"><title>Chat | Kwaya ya Kristu Mfalme</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#f5f6fa;color:#1f2937;font-family:Arial,sans-serif}.top{background:linear-gradient(135deg,#18122b,#4c1d95);color:#fff;padding:12px 15px;position:sticky;top:0;z-index:5}.bar{max-width:1100px;margin:auto;display:flex;align-items:center;gap:10px}.back{color:#fff;text-decoration:none;font-size:25px}.brand{flex:1}.brand b{display:block;font-size:14px}.brand small{font-size:10px;color:#ddd}.btn{border:0;border-radius:10px;padding:9px 11px;font-weight:800;cursor:pointer}.new{background:#fff;color:#4c1d95}.wrap{max-width:1100px;margin:auto;padding:12px;display:grid;grid-template-columns:330px 1fr;gap:12px;height:calc(100vh - 64px)}.card{background:#fff;border:1px solid #e5e7eb;border-radius:15px;overflow:hidden}.left{display:flex;flex-direction:column}.head{padding:13px;border-bottom:1px solid #eee;font-weight:800;color:#35145f}.search{margin:9px 11px;padding:11px;border:1px solid #ddd;border-radius:10px;width:calc(100% - 22px)}.people{overflow:auto}.person{display:flex;align-items:center;gap:10px;padding:11px;border-bottom:1px solid #f0f0f0;cursor:pointer}.person.active,.person:hover{background:#faf7ff}.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#ede9fe;flex:none}.pname{font-size:13px;font-weight:800}.sub{font-size:10px;color:#888;margin-top:3px}.meta{margin-left:auto;display:flex;align-items:center;gap:5px}.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:#dc2626;color:#fff;font-size:10px;font-weight:900;display:inline-flex;align-items:center;justify-content:center}.chat{display:flex;flex-direction:column;min-width:0}.chathead{padding:11px 14px;border-bottom:1px solid #eee;font-weight:800}.status{font-size:10px;color:#16a34a;margin-left:8px}.messages{flex:1;overflow:auto;padding:15px;background:#fafafa}.empty{text-align:center;padding:35px;color:#999;font-size:12px}.msg{max-width:78%;margin:7px 0;padding:9px 11px;border-radius:14px;background:#fff;border:1px solid #eee;font-size:13px;line-height:1.4}.mine{margin-left:auto;background:#ede9fe;border-color:#ddd0ff}.time{display:block;font-size:9px;color:#999;margin-top:4px;text-align:right}.ticks{margin-left:4px}.composer{display:flex;align-items:center;gap:7px;padding:9px;border-top:1px solid #eee}.input{flex:1;border:1px solid #ddd;border-radius:22px;padding:11px 14px;outline:none}.send{border:0;border-radius:22px;padding:11px 15px;background:#5b21b6;color:#fff;font-weight:800}.attach,.voice{background:#f3f4f6;color:#4c1d95}.voice.recording{background:#b91c1c;color:#fff;animation:pulse 1s infinite}@keyframes pulse{50%{transform:scale(1.08)}}.file{display:none}.record-time{display:none;font-size:11px;font-weight:800;color:#b91c1c;min-width:42px;text-align:center}.record-time.show{display:block}.audio{width:230px;max-width:100%;height:36px}.filelink{font-size:12px}.danger{color:#b91c1c;cursor:pointer;font-size:10px;margin-left:8px}.notice{padding:12px;background:#fff4d6;color:#795b00;font-size:11px;border-radius:9px}.toast{position:fixed;right:15px;bottom:18px;background:#18122b;color:#fff;padding:12px 14px;border-radius:12px;box-shadow:0 8px 30px #0004;z-index:50;display:none;max-width:min(340px,calc(100vw - 30px));cursor:pointer}.toast.show{display:block}.toast b{display:block;font-size:12px}.toast span{font-size:11px;color:#ddd}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:20;padding:15px}.modal.show{display:flex}.modalbox{background:#fff;border-radius:16px;padding:18px;width:min(440px,100%);max-height:90vh;overflow:auto}.modalbox h3{margin-top:0;color:#35145f}.field{width:100%;padding:11px;border:1px solid #ddd;border-radius:9px;margin:6px 0 12px}.members{max-height:250px;overflow:auto;border:1px solid #eee;border-radius:10px}.memberpick{display:block;padding:9px;border-bottom:1px solid #eee}@media(max-width:700px){.wrap{grid-template-columns:1fr;height:auto}.left{height:40vh}.chat{height:56vh}.msg{max-width:88%}.new{font-size:11px}.composer{gap:5px}.send{padding:10px 12px}.audio{width:190px}.toast{bottom:12px;right:10px}}</style></head><body><header class="top"><div class="bar"><a class="back" href="dashboard.html">‹</a><div class="brand"><b>KWAYA YA KRISTU MFALME</b><small>CHAT YA WANAKWAYA</small></div><button id="newGroup" class="btn new">+ Kundi</button></div></header><main class="wrap"><section class="card left"><div class="head">💬 Mazungumzo</div><input id="search" class="search" placeholder="Tafuta mwanakwaya au kundi..."><div id="people" class="people"><div class="empty">Inapakia...</div></div></section><section class="card chat"><div id="chathead" class="chathead">Chagua mazungumzo kuanza</div><div id="messages" class="messages"><div class="empty">Ujumbe wako utaonekana hapa.</div></div><div class="composer"><button id="attachBtn" class="btn attach" title="Tuma faili">📎</button><input id="file" class="file" type="file" accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.xls,.xlsx,.txt"><button id="voiceBtn" class="btn voice" title="Rekodi sauti">🎙️</button><span id="recordTime" class="record-time">00:00</span><input id="message" class="input" placeholder="Andika ujumbe..." autocomplete="off"><button id="send" class="send">Tuma</button></div></section></main><div id="toast" class="toast"></div><div id="modal" class="modal"><div class="modalbox"><h3>➕ Tengeneza kundi</h3><input id="groupName" class="field" placeholder="Jina la kundi"><input id="memberSearch" class="field" placeholder="Tafuta mwanakwaya..."><div id="members" class="members"></div><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px"><button id="cancel" class="btn">Ghairi</button><button id="create" class="btn new">Tengeneza</button></div></div></div><script>const db=supabase.createClient('https://xulnkdrgjgajmcqntwga.supabase.co','sb_publishable_J2OrXvOnQXxrf5t3XPmigg_5ULrsWO2');const $=id=>document.getElementById(id);let me=null,profiles=[],conversations=[],conversation=null,channel=null,globalChannel=null,mediaRecorder=null,voiceChunks=[],recordStarted=0,recordTimer=null,recordingStream=null,toastTimer=null;const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]));const name=p=>p?.full_name||'Mwimbaji';const avatar=p=>p?.avatar_url?'<img class="avatar" src="'+esc(p.avatar_url)+'">':'<div class="avatar"></div>';const unreadCount=async id=>{const c=conversations.find(x=>x.id===id);if(!c?.myMember?.last_read_at)return 0;const {count,error}=await db.from('chat_messages').select('id',{count:'exact',head:true}).eq('conversation_id',id).gt('created_at',c.myMember.last_read_at).neq('sender_id',me.id);return error?0:(count||0)};async function init(){const {data:{session}}=await db.auth.getSession();if(!session){location.replace('login.html');return}me=session.user;const {data,error}=await db.from('profiles').select('id,full_name,avatar_url,member_id').neq('id',me.id).order('full_name');if(error){$('people').innerHTML='<div class="notice">Imeshindikana kupakia wanakwaya.</div>';return}profiles=data||[];await loadConversations();await requestNotifications();renderList();subscribeGlobal()}async function requestNotifications(){if('Notification'in window&&Notification.permission==='default'){try{await Notification.requestPermission()}catch(e){}}}async function loadConversations(){const {data:m}=await db.from('chat_conversation_members').select('conversation_id,last_read_at,role').eq('user_id',me.id);const ids=(m||[]).map(x=>x.conversation_id);if(!ids.length){conversations=[];return}const {data:c}=await db.from('chat_conversations').select('id,name,is_group,created_by,created_at').in('id',ids).order('created_at',{ascending:false});conversations=(c||[]).map(x=>({...x,myMember:(m||[]).find(z=>z.conversation_id===x.id),unread:0}));for(const c of conversations){const {data:cm}=await db.from('chat_conversation_members').select('user_id').eq('conversation_id',c.id);c.memberIds=(cm||[]).map(x=>x.user_id);c.unread=await unreadCount(c.id)}}function label(c){if(c.is_group)return c.name||'Kundi';const other=c.memberIds?.find(id=>id!==me.id);return name(profiles.find(p=>p.id===other))}function renderList(){const q=($('search').value||'').toLowerCase();const direct=profiles.map(p=>({id:'person-'+p.id,is_person:true,name:p.full_name,is_group:false,memberIds:[me.id,p.id],unread:0})).filter(x=>!conversations.some(c=>!c.is_group&&c.memberIds?.includes(x.memberIds[1])));const rows=[...conversations,...direct].filter(c=>label(c).toLowerCase().includes(q));$('people').innerHTML=rows.length?rows.map(c=>'<div class="person '+(conversation?.id===c.id?'active':'')+'" data-id="'+esc(c.id)+'">'+(c.is_group?'<div class="avatar">👥</div>':avatar(profiles.find(p=>p.id===c.memberIds?.find(id=>id!==me.id))))+'<div><div class="pname">'+esc(label(c))+'</div><div class="sub">'+(c.is_group?'Kundi':'Mwimbaji')+'</div></div><div class="meta">'+(c.unread?'<span class="badge">'+(c.unread>99?'99+':c.unread)+'</span>':'')+'</div></div>').join(''):'<div class="empty">Hakuna mazungumzo.</div>';document.querySelectorAll('.person').forEach(el=>el.onclick=()=>{const c=rows.find(x=>x.id===el.dataset.id);c?.is_person?startDirect(c.memberIds[1]):selectConversation(c)})}async function startDirect(id){let c=conversations.find(x=>!x.is_group&&x.memberIds?.includes(id));if(!c){const {data:convId,error}=await db.rpc('create_direct_chat',{target_user_id:id});if(error||!convId)return alert('Huwezi kuanzisha chat kwa sasa. '+(error?.message||'Hitilafu ya kuunda mazungumzo.'));const {data:conv,error:convError}=await db.from('chat_conversations').select('id,name,is_group,created_by,created_at').eq('id',convId).single();if(convError||!conv)return alert('Chat imeundwa lakini haijafunguka. '+(convError?.message||''));const {data:cm,error:cmError}=await db.from('chat_conversation_members').select('user_id,role,last_read_at').eq('conversation_id',conv.id);if(cmError)return alert('Wanachama hawajasomeka: '+cmError.message);c={...conv,memberIds:(cm||[]).map(x=>x.user_id),myMember:(cm||[]).find(x=>x.user_id===me.id),unread:0};conversations.unshift(c)}selectConversation(c)}async function selectConversation(c){conversation=c;renderList();$('chathead').innerHTML=(c.is_group?'👥 ':'💬 ')+esc(label(c))+(c.is_group?'<span class="status">● Kundi</span>':'');await loadMessages();await markRead();subscribe()}async function loadMessages(){if(!conversation)return;const r=await db.from('chat_messages').select('id,sender_id,body,created_at,message_type,attachment_url,attachment_name,mime_type,deleted_at').eq('conversation_id',conversation.id).order('created_at',{ascending:true}).limit(300);if(r.error)return $('messages').innerHTML='<div class="notice">Imeshindikana kupakia ujumbe.</div>';renderMessages(r.data||[])}function messageHtml(m){let content=m.deleted_at?'<i>Ujumbe umefutwa</i>':esc(m.body||'').replace(/\n/g,'<br>');if(m.attachment_url&&!m.deleted_at){const type=m.mime_type||'';if(type.startsWith('image/'))content+='<br><img src="'+esc(m.attachment_url)+'" style="max-width:240px;border-radius:10px;margin-top:6px">';else if(type.startsWith('audio/'))content='<audio class="audio" controls preload="metadata" src="'+esc(m.attachment_url)+'"></audio>';else if(type.startsWith('video/'))content+='<br><video controls preload="metadata" style="max-width:260px;border-radius:10px;margin-top:6px" src="'+esc(m.attachment_url)+'"></video>';else content+='<br><a class="filelink" href="'+esc(m.attachment_url)+'" target="_blank">📎 '+esc(m.attachment_name||'Kiambatisho')+'</a>'}const mine=m.sender_id===me.id;return '<div class="msg '+(mine?'mine':'')+'">'+content+'<span class="time">'+new Date(m.created_at).toLocaleTimeString('sw-TZ',{hour:'2-digit',minute:'2-digit'})+(mine?'<span class="ticks">✓✓</span>':'')+(mine&&!m.deleted_at?'<span class="danger" data-id="'+m.id+'">Futa</span>':'')+'</span></div>'}function renderMessages(rows){$('messages').innerHTML=rows.length?rows.map(messageHtml).join(''):'<div class="empty">Bado hamjaandikiana. Anza mazungumzo 👋</div>';document.querySelectorAll('.danger').forEach(x=>x.onclick=()=>deleteMessage(x.dataset.id));$('messages').scrollTop=$('messages').scrollHeight}function subscribe(){if(channel)db.removeChannel(channel);channel=db.channel('chat-'+conversation.id).on('postgres_changes',{event:'*',schema:'public',table:'chat_messages',filter:'conversation_id=eq.'+conversation.id},payload=>{if(payload.eventType==='INSERT'&&payload.new?.sender_id!==me.id)markRead();loadMessages()}).subscribe()}function subscribeGlobal(){if(globalChannel)db.removeChannel(globalChannel);globalChannel=db.channel('all-my-chat-messages').on('postgres_changes',{event:'INSERT',schema:'public',table:'chat_messages'},async payload=>{const m=payload.new;if(!m||m.sender_id===me.id)return;const c=conversations.find(x=>x.id===m.conversation_id);if(!c){await loadConversations();renderList();return}if(conversation?.id===m.conversation_id){await loadMessages();await markRead();c.unread=0;renderList();return}c.unread=(c.unread||0)+1;renderList();showIncoming(c,m)}).subscribe()}function showIncoming(c,m){const title=label(c);const text=m.message_type==='voice'?'🎙️ Ujumbe wa sauti':m.message_type==='file'?'📎 '+(m.attachment_name||'Kiambatisho'):(m.body||'Ujumbe mpya');$('toast').innerHTML='<b>💬 '+esc(title)+'</b><span>'+esc(text)+'</span>';$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),6000);$('toast').onclick=()=>{selectConversation(c);$('toast').classList.remove('show')};if('Notification'in window&&Notification.permission==='granted'&&document.hidden){try{new Notification('Kwaya Chat — '+title,{body:text,icon:'icon-192.png'})}catch(e){}}}async function markRead(){if(!conversation)return;const now=new Date().toISOString();await db.from('chat_conversation_members').update({last_read_at:now}).eq('conversation_id',conversation.id).eq('user_id',me.id);const c=conversations.find(x=>x.id===conversation.id);if(c){c.myMember=c.myMember||{};c.myMember.last_read_at=now;c.unread=0}renderList()}async function uploadAndSend(blob,filename,mime,body=''){if(!conversation)return;const safe=filename.replace(/[^a-zA-Z0-9._-]/g,'_'),path=me.id+'/'+conversation.id+'/'+Date.now()+'_'+safe;const up=await db.storage.from('chat-files').upload(path,blob,{upsert:false,contentType:mime});if(up.error)return alert('Sauti haijapakiwa: '+up.error.message);const url=db.storage.from('chat-files').getPublicUrl(path).data.publicUrl;const r=await db.from('chat_messages').insert({conversation_id:conversation.id,sender_id:me.id,body:body||filename,message_type:'voice',attachment_url:url,attachment_name:filename,mime_type:mime});if(r.error)alert('Voice haikutumwa: '+r.error.message)}async function send(){const body=$('message').value.trim(),f=$('file').files[0];if((!body&&!f)||!conversation)return;if(f){const safe=f.name.replace(/[^a-zA-Z0-9._-]/g,'_'),path=me.id+'/'+conversation.id+'/'+Date.now()+'_'+safe;const up=await db.storage.from('chat-files').upload(path,f,{upsert:false});if(up.error)return alert('Kiambatisho hakijapakiwa: '+up.error.message);const url=db.storage.from('chat-files').getPublicUrl(path).data.publicUrl;const r=await db.from('chat_messages').insert({conversation_id:conversation.id,sender_id:me.id,body:body||f.name,message_type:'file',attachment_url:url,attachment_name:f.name,mime_type:f.type||'application/octet-stream'});if(r.error)return alert('Ujumbe haukutumwa: '+r.error.message);$('message').value='';$('file').value='';return}const r=await db.from('chat_messages').insert({conversation_id:conversation.id,sender_id:me.id,body,message_type:'text'});if(r.error)return alert('Ujumbe haukutumwa: '+r.error.message);$('message').value=''}async function deleteMessage(id){if(!confirm('Futa ujumbe huu?'))return;await db.from('chat_messages').update({deleted_at:new Date().toISOString(),deleted_by:me.id,body:''}).eq('id',id).eq('sender_id',me.id);loadMessages()}function resetRecording(){if(recordTimer)clearInterval(recordTimer);recordTimer=null;$('recordTime').classList.remove('show');$('recordTime').textContent='00:00';$('voiceBtn').classList.remove('recording');$('voiceBtn').textContent='🎙️'}async function startRecording(){if(!conversation)return alert('Chagua mazungumzo kwanza.');if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)return alert('Kifaa hiki hakiruhusu kurekodi sauti kwenye browser hii.');try{recordingStream=await navigator.mediaDevices.getUserMedia({audio:true});const preferred=['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus'].find(x=>MediaRecorder.isTypeSupported(x));mediaRecorder=new MediaRecorder(recordingStream,preferred?{mimeType:preferred}:undefined);voiceChunks=[];mediaRecorder.ondataavailable=e=>{if(e.data.size)voiceChunks.push(e.data)};mediaRecorder.onstop=async()=>{const mime=mediaRecorder.mimeType||'audio/webm';const blob=new Blob(voiceChunks,{type:mime});const ext=mime.includes('ogg')?'ogg':'webm';await uploadAndSend(blob,'voice_'+Date.now()+'.'+ext,mime);if(recordingStream)recordingStream.getTracks().forEach(t=>t.stop());resetRecording()};mediaRecorder.start();recordStarted=Date.now();$('voiceBtn').classList.add('recording');$('voiceBtn').textContent='⏹️';$('recordTime').classList.add('show');recordTimer=setInterval(()=>{const s=Math.floor((Date.now()-recordStarted)/1000);$('recordTime').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},250)}catch(e){alert('Ruhusa ya microphone imekataliwa au haipatikani.');resetRecording()}}function stopRecording(){if(mediaRecorder&&mediaRecorder.state!=='inactive')mediaRecorder.stop()}function openGroup(){const ids=new Set();$('members').innerHTML=profiles.map(p=>'<label class="memberpick"><input type="checkbox" value="'+p.id+'"> '+esc(name(p))+'</label>').join('');$('modal').classList.add('show');$('create').onclick=async()=>{const title=$('groupName').value.trim();document.querySelectorAll('#members input:checked').forEach(x=>ids.add(x.value));if(!title||!ids.size)return alert('Weka jina la kundi na uchague mwanakwaya.');const r=await db.from('chat_conversations').insert({name:title,is_group:true,created_by:me.id}).select().single();if(r.error)return alert('Kundi halijatengenezwa: '+r.error.message);const rows=[{conversation_id:r.data.id,user_id:me.id,role:'admin'},...Array.from(ids).map(id=>({conversation_id:r.data.id,user_id:id,role:'member'}))];const e=await db.from('chat_conversation_members').insert(rows);if(e.error)return alert('Wanachama hawakuongezwa: '+e.error.message);const c={...r.data,memberIds:[me.id,...ids],myMember:{role:'admin'},unread:0};conversations.unshift(c);$('modal').classList.remove('show');$('groupName').value='';selectConversation(c)}}$('newGroup').onclick=openGroup;$('cancel').onclick=()=>$('modal').classList.remove('show');$('attachBtn').onclick=()=>$('file').click();$('voiceBtn').onclick=()=>mediaRecorder?.state==='recording'?stopRecording():startRecording();$('send').onclick=send;$('message').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});$('search').addEventListener('input',renderList);init().catch(console.error);</script></body></html>
