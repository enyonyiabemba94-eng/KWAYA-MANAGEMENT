name: Fix Shangilio liturgical support
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch songs.html
        shell: python
        run: |
          from pathlib import Path
          p=Path('songs.html')
          s=p.read_text(encoding='utf-8')
          replacements={
            "liturgical_period:isZ?($('liturgicalPeriod').value||null):null,sunday_name:isZ?($('sundayName').value||null):null,liturgical_year:isZ?($('liturgicalYear').value||null):null": "liturgical_period:isLit?($('liturgicalPeriod').value||null):null,sunday_name:isLit?($('sundayName').value||null):null,liturgical_year:isLit?($('liturgicalYear').value||null):null",
            "$('dLiturgical').innerHTML=x.category==='Zaburi'?": "$('dLiturgical').innerHTML=['Zaburi','Shangilio'].includes(x.category)?",
            "'📖 Zaburi — taarifa za liturujia hazijawekwa.'": "`📖 ${esc(x.category)} — taarifa za liturujia hazijawekwa.`",
          }
          changed=False
          for old,new in replacements.items():
            if old in s:
              s=s.replace(old,new)
              changed=True
          if not changed:
            raise SystemExit('No expected Shangilio bug patterns found')
          p.write_text(s,encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add songs.html
          git diff --cached --quiet || git commit -m 'Fix Shangilio liturgical settings'
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          git rm .github/workflows/fix-shangilio.yml || true
          git diff --cached --quiet || git commit -m 'Remove temporary Shangilio workflow'
          git push || true
