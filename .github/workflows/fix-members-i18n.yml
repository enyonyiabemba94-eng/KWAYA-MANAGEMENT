name: Fix members multilingual UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'chore: patch members i18n'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch members.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('members.html')
          s=p.read_text()
          repl={
          '<title>Waimbaji | KWAYA YA KRISTU MFALME</title>':'<title data-i18n="Waimbaji">Waimbaji</title>',
          '<h1 style="display:inline"> Waimbaji</h1>':'<h1 style="display:inline" data-i18n="Waimbaji"> Waimbaji</h1>',
          '<small>Usimamizi wa taarifa za waimbaji</small>':'<small data-i18n="Usimamizi wa taarifa za waimbaji">Usimamizi wa taarifa za waimbaji</small>',
          'WAIMBAJI WOTE':'Waimbaji wote',
          'WANAOENDELEA':'Wanaoendelea',
          'WASIOENDELEA':'Wasioendelea',
          'WENYE NAFASI YA SAUTI':'Wenye nafasi ya sauti',
          'Orodha ya Waimbaji':'Orodha ya Waimbaji',
          'Tafuta jina, simu au makazi...':'Tafuta jina, simu au makazi...',
          'Nafasi zote':'Nafasi zote',
          'Hali zote':'Hali zote',
          '>Mwimbaji</th>':'>Mwimbaji</th>',
          '>Jinsia</th>':'>Jinsia</th>',
          '>Tarehe ya Kuzaliwa</th>':'>Tarehe ya Kuzaliwa</th>',
          '>Simu</th>':'>Simu</th>',
          '>Makazi</th>':'>Makazi</th>',
          '>Sauti</th>':'>Sauti</th>',
          '>Hali</th>':'>Hali</th>',
          '>Vitendo</th>':'>Vitendo</th>',
          'Inapakia...':'Inapakia...',
          'Ongeza Mwimbaji':'Ongeza Mwimbaji',
          'Jina la kwanza *':'Jina la kwanza *',
          'Jina la kati':'Jina la kati',
          'Jina la mwisho *':'Jina la mwisho *',
          'Mwanaume':'Mwanaume',
          'Mwanamke':'Mwanamke',
          'Tarehe ya kuzaliwa':'Tarehe ya kuzaliwa',
          'Mahali pa kuzaliwa':'Mahali pa kuzaliwa',
          'Nafasi ya sauti':'Nafasi ya sauti',
          'Wajibu':'Wajibu',
          'Tarehe ya kujiunga':'Tarehe ya kujiunga',
          'Picha ya Mwimbaji':'Picha ya Mwimbaji',
          'Maelezo':'Maelezo',
          'Ghairi':'Ghairi',
          'Hifadhi':'Hifadhi',
          'Hakuna waimbaji.':'Hakuna waimbaji.',
          'Inahifadhi...':'Inahifadhi...',
          'Picha isizidi 5MB':'Picha isizidi 5MB',
          'Gusa nje ya picha au ESC kufunga':'Gusa nje ya picha au ESC kufunga',
          'Picha ya mwimbaji':'Picha ya mwimbaji',
          }
          for a,b in repl.items(): s=s.replace(a,b)
          marker='<!-- MEMBERS_I18N_PATCH -->'
          patch=r'''<!-- MEMBERS_I18N_PATCH --><script>(function(){const M={sw:{"Waimbaji wote":"WAIMBAJI WOTE","Wanaoendelea":"WANAOENDELEA","Wasioendelea":"WASIOENDELEA","Wenye nafasi ya sauti":"WENYE NAFASI YA SAUTI"},fr:{"Waimbaji":"Choristes","Waimbaji wote":"Tous les choristes","Wanaoendelea":"Actifs","Wasioendelea":"Inactifs","Wenye nafasi ya sauti":"Avec une voix","Orodha ya Waimbaji":"Liste des choristes","Tafuta jina, simu au makazi...":"Rechercher un nom, téléphone ou résidence...","Nafasi zote":"Toutes les voix","Hali zote":"Tous les statuts","Mwimbaji":"Choriste","Jinsia":"Sexe","Tarehe ya Kuzaliwa":"Date de naissance","Simu":"Téléphone","Makazi":"Résidence","Sauti":"Voix","Hali":"Statut","Vitendo":"Actions","Inapakia...":"Chargement...","Ongeza Mwimbaji":"Ajouter un choriste","Jina la kwanza *":"Prénom *","Jina la kati":"Deuxième prénom","Jina la mwisho *":"Nom *","Chagua":"Choisir","Mwanaume":"Homme","Mwanamke":"Femme","Tarehe de naissance":"Date de naissance","Tarehe ya kuzaliwa":"Date de naissance","Mahali pa kuzaliwa":"Lieu de naissance","Nafasi ya sauti":"Partie vocale","Wajibu":"Rôle","Tarehe ya kujiunga":"Date d'adhésion","Picha ya Mwimbaji":"Photo du choriste","Maelezo":"Notes","Ghairi":"Annuler","Hifadhi":"Enregistrer","Hakuna waimbaji.":"Aucun choriste.","Inahifadhi...":"Enregistrement...","Toka":"Déconnexion","Usimamizi wa taarifa za waimbaji":"Gestion des informations des choristes","Gusa nje ya picha au ESC kufunga":"Touchez à l'extérieur de la photo ou appuyez sur ESC pour fermer"},en:{"Waimbaji":"Singers","Waimbaji wote":"ALL SINGERS","Wanaoendelea":"ACTIVE","Wasioendelea":"INACTIVE","Wenye nafasi ya sauti":"WITH VOICE PART","Orodha ya Waimbaji":"Singers List","Tafuta jina, simu au makazi...":"Search name, phone or residence...","Nafasi zote":"All voice parts","Hali zote":"All statuses","Mwimbaji":"Singer","Jinsia":"Gender","Tarehe ya Kuzaliwa":"Date of Birth","Simu":"Phone","Makazi":"Residence","Sauti":"Voice","Hali":"Status","Vitendo":"Actions","Inapakia...":"Loading...","Ongeza Mwimbaji":"Add Singer","Jina la kwanza *":"First name *","Jina la kati":"Middle name","Jina la mwisho *":"Last name *","Chagua":"Choose","Mwanaume":"Male","Mwanamke":"Female","Tarehe ya kuzaliwa":"Date of birth","Mahali pa kuzaliwa":"Place of birth","Nafasi ya sauti":"Voice part","Wajibu":"Role","Tarehe ya kujiunga":"Join date","Picha ya Mwimbaji":"Singer photo","Maelezo":"Notes","Ghairi":"Cancel","Hifadhi":"Save","Hakuna waimbaji.":"No singers found.","Inahifadhi...":"Saving...","Toka":"Log out","Usimamizi wa taarifa za waimbaji":"Singer information management","Gusa nje ya picha au ESC kufunga":"Tap outside the photo or press ESC to close"}};function run(){const l=window.choirI18n?.lang?.()||'sw',d=M[l]||M.sw;document.querySelectorAll('[data-i18n]').forEach(e=>{const k=e.getAttribute('data-i18n');if(d[k])e.textContent=d[k]});document.querySelectorAll('input[placeholder]').forEach(e=>{const k=e.placeholder;if(d[k])e.placeholder=d[k]});document.querySelectorAll('option').forEach(e=>{const k=e.textContent.trim();if(d[k])e.textContent=d[k]});document.querySelectorAll('.stat span,.head h2,.field label,.foot button,.photo-hint,.photoHint,.photo-title,.top small').forEach(e=>{const k=e.textContent.trim();if(d[k])e.textContent=d[k]})}run();new MutationObserver(run).observe(document.body,{childList:true,subtree:true,characterData:true});setInterval(run,1000)})();</script>'''
          if marker not in s: s=s.replace('</body>',patch+'</body>')
          p.write_text(s)
          PY
      - name: Commit patched file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add members.html
          git diff --cached --quiet || (git commit -m 'chore: patch members i18n' && git push)
