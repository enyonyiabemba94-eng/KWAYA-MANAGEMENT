name: Fix members multilingual UI
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch members.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('members.html')
          s=p.read_text()
          repl={
          '<title>Waimbaji | KWAYA YA KRISTU MFALME</title>':'<title data-i18n="Waimbaji">Waimbaji</title>',
          '<h1 style="display:inline"> Waimbaji</h1>':'<h1 style="display:inline" data-i18n="Waimbaji"> Waimbaji</h1>',
          '<small>Usimamizi wa taarifa za waimbaji</small>':'<small data-i18n="Usimamizi wa taarifa za waimbaji">Usimamizi wa taarifa za waimbaji</small>',
          'WAIMBAJI WOTE':'Waimbaji wote','WANAOENDELEA':'Wanaoendelea','WASIOENDELEA':'Wasioendelea','WENYE NAFASI YA SAUTI':'Wenye nafasi ya sauti',
          }
          for a,b in repl.items(): s=s.replace(a,b)
          marker='<!-- MEMBERS_I18N_PATCH -->'
          patch=r'''<!-- MEMBERS_I18N_PATCH --><script>(function(){const M={sw:{"Waimbaji wote":"WAIMBAJI WOTE","Wanaoendelea":"WANAOENDELEA","Wasioendelea":"WASIOENDELEA","Wenye nafasi ya sauti":"WENYE NAFASI YA SAUTI"},fr:{"Waimbaji":"Choristes","Waimbaji wote":"Tous les choristes","Wanaoendelea":"Actifs","Wasioendelea":"Inactifs","Wenye nafasi ya sauti":"Avec une voix"},en:{"Waimbaji":"Singers","Waimbaji wote":"ALL SINGERS","Wanaoendelea":"ACTIVE","Wasioendelea":"INACTIVE","Wenye nafasi ya sauti":"WITH VOICE PART"}};function run(){const l=window.choirI18n?.lang?.()||'sw',d=M[l]||M.sw;document.querySelectorAll('[data-i18n]').forEach(e=>{const k=e.getAttribute('data-i18n');if(d[k])e.textContent=d[k]})}run();new MutationObserver(run).observe(document.body,{childList:true,subtree:true})})();</script>'''
          if marker not in s: s=s.replace('</body>',patch+'</body>')
          p.write_text(s)
          PY
      - name: Commit patched file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add members.html
          git diff --cached --quiet || (git commit -m 'chore: patch members i18n' && git push)
