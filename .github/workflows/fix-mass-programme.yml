name: Fix Mass Programme
on:
  issues:
    types: [opened]
jobs:
  fix:
    if: contains(github.event.issue.body, '/fix-mass-programme')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixes
        shell: python
        run: |
          from pathlib import Path
          p=Path('mass-programmes.html'); s=p.read_text(encoding='utf-8')
          marker='<div class="field"><label>Mahali</label><input id="location" placeholder="Mf. Kanisa la Kristo Mfalme"></div>'
          if 'id="conductor1"' not in s and marker in s:
              s=s.replace(marker,marker+'<div class="two"><div class="field"><label>Conductor 1</label><input id="conductor1" placeholder="Jina la Conductor 1"></div><div class="field"><label>Conductor 2</label><input id="conductor2" placeholder="Jina la Conductor 2"></div></div>',1)
          s=s.replace("const groups=[['opening','🎵 Nyimbo za Kuingia',3],['offertory','💰 Nyimbo za Sadaka',6],['communion','🍞 Nyimbo za Komunio',6],['thanksgiving','🙏 Nyimbo za Shukrani',4]];","const groups=[['opening','🎵 Nyimbo za Kuingia'],['offertory','💰 Nyimbo za Sadaka'],['communion','🍞 Nyimbo za Komunio'],['thanksgiving','🙏 Nyimbo za Shukrani']];",1)
          start=s.index('function renderSlots('); end=s.index('function toggleManual',start)
          s=s[:start]+'''function renderSlots(values={}){values=values||{};let html=groups.map(([k,label])=>{const arr=Array.isArray(values[k])?values[k]:[];const count=Math.max(1,arr.length);return `<div class="section"><div class="sectionTitle"><h3>${label}</h3><button type="button" class="btn muted" onclick="addSong('${k}')">＋ Ongeza wimbo</button></div><div id="group_${k}">${Array.from({length:count},(_,i)=>renderSongField(k,i,arr[i]||{})).join('')}</div></div>`}).join('');html+=singles.map(([k,label])=>renderSingle(k,label,values[k]||{})).join('');html+=special.map(([k,label])=>{const active=$(k)?.checked;const arr=Array.isArray(values[k])?values[k]:[];const count=Math.max(1,arr.length);return `<div class="section" id="section_${k}" style="display:${active?'block':'none'}"><div class="sectionTitle"><h3>${label}</h3><button type="button" class="btn muted" onclick="addSong('${k}')">＋ Ongeza wimbo</button></div><div id="group_${k}">${Array.from({length:count},(_,i)=>renderSongField(k,i,arr[i]||{})).join('')}</div></div>`}).join('');$('slots').innerHTML=html}function addSong(k){const values=readSongs();const arr=Array.isArray(values[k])?values[k]:[];arr.push({});values[k]=arr;renderSlots(values)}
''' + s[end:]
          start=s.index('function readSongs()'); end=s.index('function specialChanged',start)
          s=s[:start]+'''function readSongs(){const o={};groups.forEach(([k])=>{const els=[...document.querySelectorAll(`[id^="${k}_"]`)].filter(e=>/^${k}_\\d+$/.test(e.id));const n=els.length?Math.max(...els.map(e=>Number(e.id.split('_').pop())))+1:0;o[k]=Array.from({length:n},(_,i)=>readSongField(k,i))});singles.forEach(([k])=>{const id=$(k)?.value||null,key=$(`${k}_key`)?.value||null;o[k]=id==='__manual__'?{manual:true,title:$(`${k}_manual`)?.value.trim()||'',key}:{id:id||null,key}});special.forEach(([k])=>{const els=[...document.querySelectorAll(`[id^="${k}_"]`)].filter(e=>/^${k}_\\d+$/.test(e.id));const n=els.length?Math.max(...els.map(e=>Number(e.id.split('_').pop())))+1:0;o[k]=Array.from({length:n},(_,i)=>readSongField(k,i))});return o}
''' + s[end:]
          start=s.index('function normalizeSongs('); end=s.index('async function load',start)
          s=s[:start]+'''function normalizeSongs(raw){raw=raw||{};const out={};groups.forEach(([k])=>{const a=Array.isArray(raw[k])?raw[k]:[];out[k]=a.map(v=>typeof v==='string'?{id:v,key:null}:v||{id:null,key:null})});singles.forEach(([k])=>{const v=raw[k];out[k]=typeof v==='string'?{id:v,key:null}:v||{id:null,key:null}});special.forEach(([k])=>{const a=Array.isArray(raw[k])?raw[k]:[];out[k]=a.map(v=>typeof v==='string'?{id:v,key:null}:v||{id:null,key:null})});return out}
''' + s[end:]
          s=s.replace("$('location').value='';$('notes').value='';","$('location').value='';$('conductor1').value='';$('conductor2').value='';$('notes').value='';",1)
          s=s.replace("$('location').value=x.location||'';$('notes').value=x.meta.notes||'';","$('location').value=x.location||'';$('conductor1').value=x.meta.conductor1||'';$('conductor2').value=x.meta.conductor2||'';$('notes').value=x.meta.notes||'';",1)
          s=s.replace("songs:readSongs(),notes:","songs:readSongs(),conductor1:$('conductor1').value.trim(),conductor2:$('conductor2').value.trim(),notes:",1)
          p.write_text(s,encoding='utf-8')
      - name: Validate
        run: |
          grep -q 'conductor1' mass-programmes.html
          grep -q '＋ Ongeza wimbo' mass-programmes.html
          grep -q "const groups=[['opening','🎵 Nyimbo za Kuingia']," mass-programmes.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mass-programmes.html
          git diff --cached --quiet || git commit -m 'Fix Mass Programme conductors and dynamic songs'
          git push
