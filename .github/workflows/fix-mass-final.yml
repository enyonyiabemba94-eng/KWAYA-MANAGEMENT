name: Fix Mass Programme A4

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch mass programme
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('mass-programmes.html')
          s = p.read_text()

          s = s.replace('.fit-page{width:100%;height:100%;overflow:hidden}', '.fit-page{width:100%;height:auto;min-height:0;max-height:none;overflow:visible}')
          s = s.replace('.preview{display:block!important;margin:0;padding:0;width:180mm;height:267mm;overflow:hidden}', '.preview{display:block!important;margin:0;padding:0;width:180mm;height:auto;min-height:0;max-height:none;overflow:visible}')
          s = s.replace('.fit-page{width:100%;height:100%;overflow:hidden}}', '.fit-page{width:100%;height:auto!important;min-height:0!important;max-height:none!important;overflow:visible!important}}')

          s = s.replace('.printtitle{font-size:28pt}', '.printtitle{font-size:18pt}')
          s = s.replace('.printsub{font-size:25pt}', '.printsub{font-size:16pt}')
          s = s.replace('font-size:22pt;color:#555;border-bottom', 'font-size:12pt;color:#555;border-bottom')
          s = s.replace('.psec h4{font-size:23pt;', '.psec h4{font-size:14pt;')
          s = s.replace('.psong{font-size:22pt;', '.psong{font-size:12pt;')
          s = s.replace('.print-note{font-size:22pt;', '.print-note{font-size:11pt;')
          s = s.replace('.conductor-print{margin:6mm 0 8mm;padding:4mm 0;border-top:1px solid #ddd;border-bottom:1px solid #ddd;text-align:center;font-size:22pt;', '.conductor-print{margin:3mm 0 4mm;padding:2mm 0;border-top:1px solid #ddd;border-bottom:1px solid #ddd;text-align:center;font-size:12pt;')

          old = '''function fitOnePage(){\n const p=$('preview'),box=p&&p.firstElementChild;if(!box)return;\n box.style.transform='none';\n box.style.transformOrigin='top left';\n let scale=1,maxH=p.clientHeight||1080;\n while(box.scrollHeight>maxH&&scale>.45){\n   scale-=.02;\n   box.style.transform=`scale(${scale})`;\n   box.style.width=`${100/scale}%`\n }\n}'''
          new = '''function fitOnePage(){\n const p=$('preview'),box=p&&p.firstElementChild;if(!p||!box)return;\n box.style.transform='none';\n box.style.transformOrigin='top left';\n box.style.width='100%';\n box.style.height='auto';\n box.style.minHeight='0';\n box.style.maxHeight='none';\n box.style.overflow='visible';\n requestAnimationFrame(()=>{\n   const natural=box.scrollHeight;\n   const maxH=p.clientHeight||p.getBoundingClientRect().height||1080;\n   const scale=Math.min(1,maxH/natural);\n   box.style.transform=`scale(${scale})`;\n   box.style.transformOrigin='top left';\n   box.style.width=`${100/scale}%`;\n });\n}'''
          if old in s:
              s = s.replace(old, new)

          oldc = "html+=`<div class=\"conductor-print\"><b>WAONGOZA NYIMBO:</b> ${conductors.length?conductors.map(esc).join(' • '):'—'}</div>`;"
          newc = "const conductorNames=[...conductors].filter(Boolean);const ci=$('conductor');if(ci&&ci.value.trim()&&!conductorNames.includes(ci.value.trim()))conductorNames.push(ci.value.trim());html+=`<div class=\"conductor-print\"><b>WAONGOZA NYIMBO:</b> ${conductorNames.length?conductorNames.map(esc).join(' • '):'—'}</div>`;"
          if oldc in s:
              s = s.replace(oldc, newc)

          p.write_text(s)
          PY
      - name: Commit fixes and remove fixer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mass-programmes.html
          git commit -m 'Fix mass programme A4 layout and conductor' || exit 0
          git push
