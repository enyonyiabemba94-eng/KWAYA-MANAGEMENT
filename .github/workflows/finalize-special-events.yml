name: Finalize Special Events
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Attach special events CSS and script
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p=Path('mass-programmes.html')
          s=p.read_text()
          css='<link rel="stylesheet" href="./mass-special-events.css?v=20260904">'
          if css not in s:
              s=s.replace('</head>', css+'\n</head>')
          script='<script src="./mass-special-events.js?v=20260904"></script>'
          if script not in s:
              s=s.replace('</body>', script+'\n</body>')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mass-programmes.html
          if git diff --cached --quiet; then
            echo 'No change needed'
            exit 0
          fi
          git commit -m 'Attach special events module to mass programme'
          git push
