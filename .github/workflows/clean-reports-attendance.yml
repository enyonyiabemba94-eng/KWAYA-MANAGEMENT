name: Safisha Ripoti ya Mahudhurio
on:
  push:
    paths:
      - '.github/workflows/clean-reports-attendance.yml'
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Safisha reports.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('reports.html')
          s=p.read_text(encoding='utf-8')
          old="const statusLabel=v=>v==='present'?'✓':v==='late'?'C':v==='permission'?'R':v==='sick'?'M':v==='bereavement'?'F':v==='emergency'?'EM':v?'A':'—';const cls=v=>v==='present'?'att-present':v==='late'?'att-late':v==='permission'?'att-permission':v==='sick'?'att-sick':v==='bereavement'?'att-bereavement':v==='emergency'?'att-extra':v?'att-absent':'';"
          new="const statusLabel=v=>v==='present'?'✓':v==='late'?'A':v==='sick'?'M':v==='permission'?'R':'';const cls=v=>v==='present'?'att-present':v==='late'?'att-late':v==='sick'?'att-sick':v==='permission'?'att-permission':'';"
          if old not in s: raise SystemExit('status mapping not found')
          s=s.replace(old,new)
          old2="let p=0,n=0;const cells=sessions.map(x=>{const v=by.get(x.id+'|'+m.id);if(v){n++;if(v==='present'||v==='late')p++;}"
          new2="let p=0,n=0;const cells=sessions.map(x=>{const v=by.get(x.id+'|'+m.id);if(v){n++;if(v==='present')p++;}"
          if old2 not in s: raise SystemExit('member percentage logic not found')
          s=s.replace(old2,new2)
          old3=".att-present{color:#15803d;background:#dcfce7}.att-late{color:#166534;background:#dcfce7}.att-sick{color:#a16207;background:#fef3c7}.att-permission{color:#1d4ed8;background:#dbeafe}.att-sum"
          new3=".att-present{color:#15803d;background:#dcfce7}.att-late{color:#166534;background:#dcfce7}.att-sick{color:#a16207;background:#fef3c7}.att-permission{color:#1d4ed8;background:#dbeafe}.att-sum"
          s=s.replace(old3,new3)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Kagua alama zilizobaki
        run: |
          ! grep -Eq "'C'|'F'|'EM'|att-bereavement|att-extra|att-absent" reports.html
      - name: Commit na ondoa workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports.html
          git commit -m "Safisha kabisa alama za mahudhurio" || true
          git rm .github/workflows/clean-reports-attendance.yml
          git commit -m "Ondoa workflow ya muda ya kusafisha ripoti" || true
          git push