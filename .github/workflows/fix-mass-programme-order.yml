name: Fix Mass Programme Order

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, 'Mass Programme dynamic form')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair Mass Programme
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('mass-programmes.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'\n<script id="mass-dynamic-repair">.*?</script>\s*</body>', '\n</body>', s, flags=re.S)
          repair=r'''<script id="mass-dynamic-repair">
const MASS_SECTIONS=[['opening','🎵 1. Mwanzo / Kuingia',6],['penitential','🙏 2. Kyrie / Bwana Utuhurumie / Toba',1],['psalm','📖 3. Zaburi',1],['alleluia','📣 4. Shangilio / Aleluya',1],['intercessions','🙏 5. Maombezi',10],['offertory','🍞 6. Sadaka',10],['holy','⛪ 7. Mtakatifu',1],['lamb','🐑 8. Mwana Kondoo wa Mungu',1],['communion','🍷 9. Komunio',10],['thanksgiving','🙏 10. Shukrani',10],['closing','🚪 11. Mwisho / Kutoka',1]];
const MASS_SPECIAL=[['baptism','💧 Ubatizo',10],['confirmation','🕊️ Kipaimara',10],['marriage','💍 Ndoa',10],['funeral','🕯️ Mazishi',10],['feast','🎉 Sherehe / Sikukuu',10],['church','⛪ Sherehe ya Kanisa',10],['other_event','✨ Tukio Lingine',10]];
function massSongRow(k,i,v={}){const manual=!!v.manual,id=k+'_'+i;return `<div class="mass-row" data-k="${k}" data-i="${i}"><div class="songrow"><select id="${id}" onchange="massSongChanged('${k}',${i})">${songOptions(manual?'':(v.id||''))}<option value="__manual__" ${manual?'selected':''}>✍️ Manual — Andika mwenyewe</option></select><select id="${k}_key_${i}">${keyOptions(v.key||'')}</select><button type="button" class="remove" onclick="massRemove('${k}',${i})">×</button></div><div class="manual" id="manual_${id}" style="display:${manual?'grid':'none'}"><input id="${k}_manual_${i}" value="${manual?esc(v.title||''):''}" placeholder="Andika jina la wimbo..."><span></span><button type="button" class="remove" onclick="massRemove('${k}',${i})">×</button></div></div>`}
function massSection(k,label,max,values=[]){return `<div class="section mass-section" data-section="${k}" data-max="${max}"><div class="sectionTitle"><h3>${label}</h3><small>Hadi ${max}</small></div><div class="rows">${values.map((v,i)=>massSongRow(k,i,v)).join('')}</div><div class="addbar"><button type="button" class="addbtn" onclick="massAdd('${k}',${max})">＋ Ongeza wimbo</button></div></div>`}
function massRender(saved={}){const v=saved||{};let h='';for(const [k,l,m] of MASS_SECTIONS)h+=massSection(k,l,m,Array.isArray(v[k])?v[k]:[]);for(const [k,l,m] of MASS_SPECIAL)if($(k)?.checked)h+=massSection(k,l,m,Array.isArray(v[k])?v[k]:[]);$('slots').innerHTML=h;document.querySelectorAll('.mass-section').forEach(massUpdateButton)}
function massAdd(k,max){const sec=document.querySelector(`[data-section="${k}"]`);if(!sec)return;const rows=sec.querySelector('.rows'),n=rows.querySelectorAll('.mass-row').length;if(n>=max)return;rows.insertAdjacentHTML('beforeend',massSongRow(k,n,{}));massUpdateButton(sec)}
function massRemove(k,i){const sec=document.querySelector(`[data-section="${k}"]`);if(!sec)return;const el=sec.querySelector(`.mass-row[data-i="${i}"]`);if(el)el.remove();[...sec.querySelectorAll('.mass-row')].forEach((e,n)=>{const v=massRead(e);e.outerHTML=massSongRow(k,n,v)});massUpdateButton(sec)}
function massRead(el){const k=el.dataset.k,i=+el.dataset.i,sel=el.querySelector(`#${k}_${i}`),key=el.querySelector(`#${k}_key_${i}`);if(!sel)return{};if(sel.value==='__manual__')return{manual:true,title:el.querySelector(`#${k}_manual_${i}`)?.value||'',key:key?.value||''};return{id:sel.value||null,key:key?.value||''}}
function massReadSection(k){const sec=document.querySelector(`[data-section="${k}"]`);return sec?[...sec.querySelectorAll('.mass-row')].map(massRead).filter(v=>v.manual?(v.title||'').trim():v.id):[]}
function massCollect(){const o={};for(const [k] of MASS_SECTIONS)o[k]=massReadSection(k);for(const [k] of MASS_SPECIAL)if($(k)?.checked)o[k]=massReadSection(k);return o}
function massUpdateButton(sec){const b=sec.querySelector('.addbtn');if(b)b.disabled=sec.querySelectorAll('.mass-row').length>=+sec.dataset.max}
function massSongChanged(k,i){const sel=$(`${k}_${i}`),man=$(`manual_${k}_${i}`),key=$(`${k}_key_${i}`);if(!sel)return;if(sel.value==='__manual__'){man.style.display='grid';return}man.style.display='none';const song=songs.find(x=>x.id===sel.value);if(song?.key_signature)key.value=song.key_signature}
const _oldMeta=typeof meta==='function'?meta:null;
meta=function(){const base=_oldMeta?_oldMeta():{};return Object.assign(base,{kind:'mass_programme',type:$('type').value,sunday:$('sundayNo').value,liturgical_year:$('litYear').value,celebration:$('celebrationName').value,other_name:$('otherName').value,conductor1:$('conductor1').value,conductor2:$('conductor2').value,songs:massCollect(),notes:$('notes').value})};
renderSlots=massRender;
</script>'''
          s=s.replace('</body>',repair+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('mass-programmes.html').read_text(encoding='utf-8')
          assert 'mass-dynamic-repair' in s
          assert 'intercessions' in s and '🙏 5. Maombezi' in s
          assert '＋ Ongeza wimbo' in s
          assert 'Hadi 10' in s
          assert 'Conductor 2' in s
          print('Mass programme dynamic repair OK')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mass-programmes.html
          git diff --cached --quiet && exit 0
          git commit -m 'Mass Programme dynamic form'
          git push
