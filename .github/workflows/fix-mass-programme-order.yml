name: Fix Mass Programme Order

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, 'Mass Programme order applied')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix mass programme form
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('mass-programmes.html')
          s = p.read_text(encoding='utf-8')

          new_render = r'''function renderSlots(values={}){values=values||{};let html='';const group=(k,label,n)=>{const a=Array.isArray(values[k])?values[k]:[];return `<div class="section"><div class="sectionTitle"><h3>${label}</h3><small>${n} nafasi</small></div>${Array.from({length:n},(_,i)=>renderSongField(k,i,a[i]||{})).join('')}</div>`};const single=(k,label)=>{const v=values[k]||{};return renderSingle(k,label,v)};html+=group('opening','🎵 1. Mwanzo / Kuingia',6);html+=single('penitential','🙏 2. Kyrie / Bwana Utuhurumie / Toba');html+=single('psalm','📖 3. Zaburi');html+=single('alleluia','📣 4. Shangilio / Aleluya');html+=group('offertory','🍞 5. Sadaka',10);html+=single('holy','⛪ 6. Mtakatifu');html+=single('lamb','🐑 7. Mwana Kondoo wa Mungu');html+=group('communion','🍷 8. Komunio',10);html+=group('thanksgiving','🙏 9. Shukrani',10);html+=single('closing','🚪 10. Mwisho / Kutoka');for(const [k,label,n] of special){if($(k)?.checked)html+=group(k,label,n||10)}$('slots').innerHTML=html}function toggleManual'''

          start = s.find('function renderSlots(values={}){')
          if start < 0:
              raise SystemExit('renderSlots start not found')
          end = s.find('function toggleManual', start)
          if end < 0:
              raise SystemExit('toggleManual marker not found')
          s = s[:start] + new_render + s[end+len('function toggleManual'):]

          # Remove the accidental nested duplicate script block introduced by the previous patch.
          s = s.replace('}<script>\nfunction renderSlots(data){', '}\nfunction renderSlots(data){')
          s = s.replace('</script>newProgramme();load();</script></body>', 'newProgramme();load();</script></body>')
          s = s.replace('function renderSlots(data){', '')

          # Ensure the existing data model also uses the requested slot counts.
          s = s.replace("const groups=[['opening','🎵 Mwanzo / Kuingia',6],['offertory','🍞 Sadaka',10],['communion','🍷 Komunio',10],['thanksgiving','🙏 Shukrani',10]]", "const groups=[['opening','🎵 Mwanzo / Kuingia',6],['offertory','🍞 Sadaka',10],['communion','🍷 Komunio',10],['thanksgiving','🙏 Shukrani',10]]")
          s = s.replace("special.forEach(([k])=>o[k]=Array.from({length:6},(_,i)=>readSongField(k,i)))", "special.forEach(([k,,n])=>o[k]=Array.from({length:n||10},(_,i)=>readSongField(k,i)))")
          s = s.replace("special.forEach(([k])=>{const a=Array.isArray(raw[k])?raw[k]:[];out[k]=Array.from({length:6},(_,i)=>typeof a[i]==='string'?{id:a[i],key:null}:a[i]||{id:null,key:null})})", "special.forEach(([k,,n])=>{const a=Array.isArray(raw[k])?raw[k]:[];out[k]=Array.from({length:n||10},(_,i)=>typeof a[i]==='string'?{id:a[i],key:null}:a[i]||{id:null,key:null})})")
          s = s.replace("special.forEach(([k,label])=>{if($(k).checked){const rows=previewRows(Array.from({length:6},(_,i)=>readSongField(k,i)));", "special.forEach(([k,label,n])=>{if($(k).checked){const rows=previewRows(Array.from({length:n||10},(_,i)=>readSongField(k,i)));" )

          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate and commit
        run: |
          python3 -m py_compile /dev/stdin <<'PY'
          print('ok')
          PY
          grep -q '1. Mwanzo / Kuingia' mass-programmes.html
          grep -q '5. Sadaka' mass-programmes.html
          grep -q '8. Komunio' mass-programmes.html
          grep -q '9. Shukrani' mass-programmes.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mass-programmes.html
          git diff --cached --quiet && exit 0
          git commit -m 'Mass Programme order applied'
          git push
