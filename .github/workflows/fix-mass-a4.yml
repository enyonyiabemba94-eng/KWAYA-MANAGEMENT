name: Fix Mass Programme A4 One Page
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply one-page A4 print layout
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('mass-programmes.html')
          s=p.read_text(encoding='utf-8')
          if 'MASS_A4_ONE_PAGE_V3' not in s:
              css=r'''/* MASS_A4_ONE_PAGE_V3 */
@page{size:A4 portrait;margin:0}
@media print{
  html,body{width:210mm!important;height:297mm!important;margin:0!important;padding:0!important;overflow:hidden!important;background:#fff!important}
  .a4-overlay{position:static!important;display:block!important;width:210mm!important;height:297mm!important;max-height:297mm!important;padding:0!important;margin:0!important;overflow:hidden!important;background:#fff!important}
  .a4-paper{position:relative!important;width:210mm!important;height:297mm!important;min-height:297mm!important;max-height:297mm!important;box-sizing:border-box!important;margin:0!important;padding:7mm 8mm!important;overflow:hidden!important;box-shadow:none!important;border:0!important}
  .a4-paper .logo{width:16mm!important;height:16mm!important;margin:0 auto 1mm!important}
  .a4-paper .ptitle{font-size:13px!important;line-height:1.1!important}
  .a4-paper .sub{font-size:7px!important;line-height:1.15!important;margin:1mm 0 2mm!important}
  .a4-paper h4{font-size:8px!important;line-height:1.05!important;margin:1.5mm 0 .7mm!important;padding-bottom:.5mm!important}
  .a4-paper .previewSong{font-size:7.2px!important;line-height:1.12!important;margin:.45mm 0!important}
  .a4-paper .notes{font-size:7px!important;line-height:1.15!important}
  .a4-footer{font-size:6px!important;margin-top:2mm!important;padding-top:1mm!important}
  .a4-paper > *{margin-top:0!important}
}
'''
              s=s.replace('</style>',css+'\n</style>',1)
              js=r'''/* MASS_A4_ONE_PAGE_V3 */
(function(){
  window.printProgramme=function(){
    try{ if(typeof preview==='function') preview(); }catch(e){}
    const ov=document.getElementById('a4Overlay');
    if(ov){ov.classList.add('show');ov.setAttribute('aria-hidden','false');}
    setTimeout(()=>{
      const paper=document.querySelector('.a4-paper');
      if(!paper){window.print();return;}
      paper.style.setProperty('break-before','auto');
      paper.style.setProperty('page-break-before','auto');
      paper.style.setProperty('page-break-after','avoid');
      paper.classList.add('mass-a4-compact');
      setTimeout(()=>window.print(),120);
    },80);
  };
})();
'''
              s=s.replace('</body>', '<script>\n'+js+'\n</script>\n</body>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mass-programmes.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Mass Programme PDF to one A4 page'
          git push
