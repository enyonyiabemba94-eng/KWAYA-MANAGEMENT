name: Members Multilingual UI Fix V2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch multilingual UI pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          pages = {
            'members.html': {
              'title': 'Waimbaji',
              'marker': 'MEMBERS_I18N_RUNTIME_PATCH_V2',
              'items': {
                'Waimbaji':'Waimbaji|Choristes|Singers','Orodha ya Waimbaji':'Orodha ya Waimbaji|Liste des choristes|Singers List','Ongeza Mwimbaji':'Ongeza Mwimbaji|Ajouter un choriste|Add Singer','Toka':'Toka|Déconnexion|Log out','Hifadhi':'Hifadhi|Enregistrer|Save','Ghairi':'Ghairi|Annuler|Cancel','Inapakia...':'Inapakia...|Chargement...|Loading...'
              }
            },
            'attendance.html': {
              'title': 'Kitabu cha Mahudhurio',
              'marker': 'ATTENDANCE_I18N_RUNTIME_PATCH_V1',
              'items': {
                'Kitabu cha Mahudhurio':'Kitabu cha Mahudhurio|Registre des présences|Attendance Register','MWEZI':'MWEZI|MOIS|MONTH','Andaa Kitabu':'Andaa Kitabu|Préparer le registre|Prepare Register','Hifadhi Mahudhurio':'Hifadhi Mahudhurio|Enregistrer les présences|Save Attendance','Weka Wote ✓':'Weka Wote ✓|Marquer tous ✓|Mark All ✓','Refresh':'Refresh|Actualiser|Refresh','🚨 Siku ya Ziada':'🚨 Siku ya Ziada|🚨 Jour supplémentaire|🚨 Extra Day','📥 Pakua Kitabu (PDF)':'📥 Pakua Kitabu (PDF)|📥 Télécharger le registre (PDF)|📥 Download Register (PDF)','KITABU CHA MAHUDHURIO':'KITABU CHA MAHUDHURIO|REGISTRE DES PRÉSENCES|ATTENDANCE REGISTER','CHAGUA MWEZI':'CHAGUA MWEZI|CHOISIR LE MOIS|SELECT MONTH','Inapakia...':'Inapakia...|Chargement...|Loading...','Ghairi':'Ghairi|Annuler|Cancel','Hifadhi':'Hifadhi|Enregistrer|Save','Toka':'Toka|Déconnexion|Log out','Waimbaji':'Waimbaji|Choristes|Singers','Mahudhurio':'Mahudhurio|Présences|Attendance','Siku ya Ziada':'Siku ya Ziada|Jour supplémentaire|Extra Day','Present':'Present|Présent|Present','Absent':'Absent|Absent|Absent','Sick':'Sick|Malade|Sick','Excused':'Excused|Excusé|Excused'
              }
            }
          }
          for fn,cfg in pages.items():
            p=Path(fn)
            if not p.exists(): continue
            s=p.read_text(encoding='utf-8')
            marker='<!-- '+cfg['marker']+' -->'
            entries={}
            for k,v in cfg['items'].items():
              a,b,c=v.split('|'); entries[k]=(a,b,c)
            js='''<script>(function(){const D={'''
            for lang,idx in [('sw',0),('fr',1),('en',2)]:
              js += lang+':{'+','.join(repr(k)+':'+repr(v[idx]) for k,v in entries.items())+'},'
            js += '''};function run(){const l=window.choirI18n&&typeof window.choirI18n.lang==='function'?window.choirI18n.lang():(localStorage.getItem('choirLang')||'sw'),d=D[l]||D.sw;document.querySelectorAll('[data-i18n]').forEach(e=>{const k=e.getAttribute('data-i18n');if(d[k])e.textContent=d[k]});document.querySelectorAll('input[placeholder]').forEach(e=>{const k=e.getAttribute('placeholder');if(d[k])e.placeholder=d[k]});document.querySelectorAll('option').forEach(e=>{const k=e.textContent.trim();if(d[k])e.textContent=d[k]});document.querySelectorAll('body *').forEach(e=>{if(e.children.length)return;const k=(e.textContent||'').trim();if(d[k])e.textContent=d[k]})}function start(){run();new MutationObserver(run).observe(document.body,{childList:true,subtree:true,characterData:true});window.addEventListener('languageChanged',run)}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start()})();</script>'''
            if marker not in s and '</body>' in s.lower():
              s=s.replace('</body>',marker+js+'</body>')
              p.write_text(s,encoding='utf-8')
              print(fn,'patched')
            else: print(fn,'already patched or body missing')
          PY
      - name: Commit multilingual patches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add members.html attendance.html
          if git diff --cached --quiet; then echo "No changes needed."; else git commit -m "fix: complete members and attendance multilingual UI"; git push; fi