name: Members Multilingual UI Fix V2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-members:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch members.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('members.html')
          if not p.exists(): raise SystemExit('members.html not found')
          s=p.read_text(encoding='utf-8')
          marker='<!-- MEMBERS_I18N_RUNTIME_PATCH_V2 -->'
          patch=r'''<!-- MEMBERS_I18N_RUNTIME_PATCH_V2 --><script>(function(){const D={sw:{"Waimbaji":"Waimbaji","Waimbaji wote":"WAIMBAJI WOTE","Wanaoendelea":"WANAOENDELEA","Wasioendelea":"WASIOENDELEA","Wenye nafasi ya sauti":"WENYE NAFASI YA SAUTI","Orodha ya Waimbaji":"Orodha ya Waimbaji","Tafuta jina, simu au makazi...":"Tafuta jina, simu au makazi...","Nafasi zote":"Nafasi zote","Hali zote":"Hali zote","active":"active","inactive":"inactive","Mwimbaji":"Mwimbaji","Jinsia":"Jinsia","Tarehe ya Kuzaliwa":"Tarehe ya Kuzaliwa","Simu":"Simu","Makazi":"Makazi","Sauti":"Sauti","Hali":"Hali","Vitendo":"Vitendo","Inapakia...":"Inapakia...","Ongeza Mwimbaji":"Ongeza Mwimbaji","Jina la kwanza *":"Jina la kwanza *","Jina la kati":"Jina la kati","Jina la mwisho *":"Jina la mwisho *","Chagua":"Chagua","Mwanaume":"Mwanaume","Mwanamke":"Mwanamke","Tarehe ya kuzaliwa":"Tarehe ya kuzaliwa","Mahali pa kuzaliwa":"Mahali pa kuzaliwa","Nafasi ya sauti":"Nafasi ya sauti","Wajibu":"Wajibu","Tarehe ya kujiunga":"Tarehe ya kujiunga","Picha ya Mwimbaji":"Picha ya Mwimbaji","Maelezo":"Maelezo","Ghairi":"Ghairi","Hifadhi":"Hifadhi","Hakuna waimbaji.":"Hakuna waimbaji.","Inahifadhi...":"Inahifadhi...","Toka":"Toka","Usimamizi wa taarifa za waimbaji":"Usimamizi wa taarifa za waimbaji","Gusa nje ya picha au ESC kufunga":"Gusa nje ya picha au ESC kufunga"},fr:{"Waimbaji":"Choristes","Waimbaji wote":"TOUS LES CHORISTES","Wanaoendelea":"ACTIFS","Wasioendelea":"INACTIFS","Wenye nafasi ya sauti":"AVEC PARTIE VOCALE","Orodha ya Waimbaji":"Liste des choristes","Tafuta jina, simu au makazi...":"Rechercher un nom, téléphone ou résidence...","Nafasi zote":"Toutes les voix","Hali zote":"Tous les statuts","active":"Actif","inactive":"Inactif","Mwimbaji":"Choriste","Jinsia":"Sexe","Tarehe ya Kuzaliwa":"Date de naissance","Simu":"Téléphone","Makazi":"Résidence","Sauti":"Voix","Hali":"Statut","Vitendo":"Actions","Inapakia...":"Chargement...","Ongeza Mwimbaji":"Ajouter un choriste","Jina la kwanza *":"Prénom *","Jina la kati":"Deuxième prénom","Jina la mwisho *":"Nom *","Chagua":"Choisir","Mwanaume":"Homme","Mwanamke":"Femme","Tarehe ya kuzaliwa":"Date de naissance","Mahali pa kuzaliwa":"Lieu de naissance","Nafasi ya sauti":"Partie vocale","Wajibu":"Rôle","Tarehe ya kujiunga":"Date d'adhésion","Picha ya Mwimbaji":"Photo du choriste","Maelezo":"Notes","Ghairi":"Annuler","Hifadhi":"Enregistrer","Hakuna waimbaji.":"Aucun choriste.","Inahifadhi...":"Enregistrement...","Toka":"Déconnexion","Usimamizi wa taarifa za waimbaji":"Gestion des informations des choristes","Gusa nje ya picha au ESC kufunga":"Touchez à l'extérieur de la photo ou appuyez sur ESC pour fermer"},en:{"Waimbaji":"Singers","Waimbaji wote":"ALL SINGERS","Wanaoendelea":"ACTIVE","Wasioendelea":"INACTIVE","Wenye nafasi ya sauti":"WITH VOICE PART","Orodha ya Waimbaji":"Singers List","Tafuta jina, simu au makazi...":"Search name, phone or residence...","Nafasi zote":"All voice parts","Hali zote":"All statuses","active":"Active","inactive":"Inactive","Mwimbaji":"Singer","Jinsia":"Gender","Tarehe ya Kuzaliwa":"Date of Birth","Simu":"Phone","Makazi":"Residence","Sauti":"Voice","Hali":"Status","Vitendo":"Actions","Inapakia...":"Loading...","Ongeza Mwimbaji":"Add Singer","Jina la kwanza *":"First name *","Jina la kati":"Middle name","Jina la mwisho *":"Last name *","Chagua":"Choose","Mwanaume":"Male","Mwanamke":"Female","Tarehe ya kuzaliwa":"Date of birth","Mahali pa kuzaliwa":"Place of birth","Nafasi ya sauti":"Voice part","Wajibu":"Role","Tarehe ya kujiunga":"Join date","Picha ya Mwimbaji":"Singer photo","Maelezo":"Notes","Ghairi":"Cancel","Hifadhi":"Save","Hakuna waimbaji.":"No singers found.","Inahifadhi...":"Saving...","Toka":"Log out","Usimamizi wa taarifa za waimbaji":"Singer information management","Gusa nje ya picha au ESC kufunga":"Tap outside the photo or press ESC to close"}};function run(){const l=window.choirI18n&&typeof window.choirI18n.lang==='function'?window.choirI18n.lang():(localStorage.getItem('choirLang')||'sw'),d=D[l]||D.sw;document.querySelectorAll('[data-i18n]').forEach(e=>{const k=e.getAttribute('data-i18n');if(d[k])e.textContent=d[k]});document.querySelectorAll('input[placeholder]').forEach(e=>{const k=e.getAttribute('placeholder');if(d[k])e.setAttribute('placeholder',d[k])});document.querySelectorAll('option').forEach(e=>{const k=e.textContent.trim();if(d[k])e.textContent=d[k]});document.querySelectorAll('body *').forEach(e=>{if(e.children.length)return;const k=(e.textContent||'').trim();if(d[k])e.textContent=d[k]})}function start(){run();new MutationObserver(run).observe(document.body,{childList:true,subtree:true,characterData:true});window.addEventListener('languageChanged',run)}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start()})();</script>'''
          if marker not in s and '</body>' in s.lower():
              s=s.replace('</body>',patch+'</body>')
              p.write_text(s,encoding='utf-8')
              print('members.html patched')
          else: print('members.html already patched or body missing')
          PY
      - name: Commit members patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add members.html
          if git diff --cached --quiet; then echo "No members changes needed."; else git commit -m "fix: complete members multilingual UI"; git push; fi