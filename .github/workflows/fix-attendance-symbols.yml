name: Fix attendance symbols
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Standardize attendance symbols
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('reports.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("v==='present'?'Y':v==='late'?'C':v==='permission'?'R':v==='sick'?'M':v==='bereavement'?'F':v==='emergency'?'EM':v?'A':'—'", "v==='present'?'✓':v==='late'?'A':v==='sick'?'M':v==='permission'?'R':''")
          s=s.replace('<span><b>✓</b> = Amehudhuria</span><span><b>A</b> = Hakuhudhuria</span><span><b>C</b> = Amechelewa</span><span><b>M</b> = Mgonjwa</span><span><b>R</b> = Ruhusa</span><span><b>F</b> = Msiba</span><span><b>EM</b> = Siku ya Ziada / Dharura</span>', '<span><b>✓</b> = Umehudhuria</span><span><b>A</b> = Amechelewa</span><span><b>M</b> = Anaumwa</span><span><b>R</b> = Ruhusa</span>')
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports.html
          git diff --cached --quiet && exit 0
          git commit -m 'Standardize attendance symbols'
          git push
