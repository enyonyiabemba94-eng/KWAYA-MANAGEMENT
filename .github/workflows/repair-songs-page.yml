name: Repair Songs Page
on:
  push:
    paths:
      - 'songs-repair-trigger.txt'
  workflow_dispatch:
jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore missing songs UI from known-good revision
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          current=Path('songs.html').read_text(encoding='utf-8')
          good=subprocess.check_output(['git','show','37867f397d030f6702f1d77af0e56a2831161fc9:songs.html'],text=True)
          def one(pat,s):
              m=re.search(pat,s,re.S|re.I)
              if not m: raise SystemExit('Missing expected structure: '+pat)
              return m.group(1)
          aside=one(r'(<aside class="side".*?</aside>)',current)
          top=one(r'(<header class="top".*?</header>)',current)
          brand=one(r'(<div class="choir-brand-header".*?</div>)',current)
          section=one(r'(<section class="content".*?</section>)',good)
          extras=one(r'(<div class="modal" id="modal".*?</div></div><div class="details" id="details".*?</div></div>)',good)
          toast=one(r'(<div class="toast" id="toast"></div>)',current)
          script=one(r'(<script>.*?</script>)',current)
          new='<!doctype html><html lang="sw"><head>'+current.split('<head>',1)[1].split('</head>',1)[0]+'</head><body>'+aside+'<main class="main">'+top+brand+section+'</main>'+extras+toast+script+'</body></html>'
          Path('songs.html').write_text(new,encoding='utf-8')
          print('Rebuilt songs page using known-good UI + current branding/script')
          print('main=', '<main class="main">' in new, 'content=', '<section class="content">' in new, 'modal=', 'id="modal"' in new, 'details=', 'id="details"' in new)
          PY
          node --check <(python3 - <<'PY'
          import re
          s=open('songs.html',encoding='utf-8').read()
          print(re.findall(r'<script>(.*?)</script>',s,re.S)[-1])
          PY
          )
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add songs.html
          git commit -m 'Restore songs page UI and functionality' || echo 'No changes'
          git push
