name: Fix conductor names
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch conductor rendering and persistence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('mass-programmes.html')
          s=p.read_text()
          marker='</body>'
          patch=r'''<script>
(function(){
  function getConductorNames(){
    const names=[];
    document.querySelectorAll('#conductors .chip').forEach(c=>{
      const t=(c.textContent||'').replace(/[×✕]/g,'').trim();
      if(t && !names.includes(t)) names.push(t);
    });
    const input=document.getElementById('conductor');
    const t=(input?.value||'').trim();
    if(t && !names.includes(t)) names.push(t);
    try { if(typeof conductors!=='undefined' && Array.isArray(conductors)) conductors.forEach(x=>{const n=String(x||'').trim();if(n&&!names.includes(n))names.push(n)}); } catch(e){}
    return names;
  }
  function ensureConductorLine(){
    const preview=document.getElementById('preview'); if(!preview)return;
    const names=getConductorNames();
    let line=preview.querySelector('.conductor-print');
    if(!names.length){ if(line) line.remove(); return; }
    const safe=names.map(n=>{const d=document.createElement('div');d.textContent=n;return d.innerHTML}).join(' • ');
    if(!line){ line=document.createElement('div'); line.className='conductor-print'; const anchor=preview.firstElementChild?.nextSibling||preview.firstChild; preview.insertBefore(line,anchor); }
    line.innerHTML='<b>WAONGOZA NYIMBO:</b> '+safe;
    line.style.display='block'; line.style.visibility='visible';
  }
  function persist(){
    try{ const id=(typeof selectedId!=='undefined'&&selectedId)||document.getElementById('name')?.value||'draft'; localStorage.setItem('kwaya_mass_conductors_'+id,JSON.stringify(getConductorNames())); }catch(e){}
  }
  const oldAdd=window.addConductor;
  window.addConductor=function(){ if(oldAdd) oldAdd(); persist(); ensureConductorLine(); };
  const oldRemove=window.removeConductor;
  window.removeConductor=function(n){ if(oldRemove) oldRemove(n); persist(); ensureConductorLine(); };
  const oldShow=window.showPreview;
  window.showPreview=function(){ if(oldShow) oldShow(); setTimeout(()=>{ensureConductorLine();persist();},50); };
  window.addEventListener('beforeprint',ensureConductorLine);
  document.addEventListener('DOMContentLoaded',()=>setTimeout(ensureConductorLine,500));
})();
</script>'''
          if 'function getConductorNames()' not in s:
              s=s.replace(marker,patch+'\n'+marker)
              p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mass-programmes.html
          git commit -m 'Fix conductor names in mass programme PDF' || true
          git push
