name: Complete Choir Multilingual UI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync with latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Translate remaining static UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          M={
          'Dashboard':('Dashboard','Tableau de bord','Dashboard'),'Waimbaji':('Waimbaji','Choristes','Singers'),'Mahudhurio':('Mahudhurio','Présences','Attendance'),'Nyimbo':('Nyimbo','Chants','Songs'),'Vitabu vya Nyimbo':('Vitabu vya Nyimbo','Livres de chants','Songbooks'),'Sakramenti':('Sakramenti','Sacrements','Sacraments'),'Mpango wa Misa':('Mpango wa Misa','Programme de messe','Mass Programme'),'Michango':('Michango','Contributions','Contributions'),'Sare':('Sare','Uniformes','Uniforms'),'Ripoti':('Ripoti','Rapports','Reports'),'Ratiba':('Ratiba','Calendrier','Schedule'),'Matukio':('Matukio','Événements','Events'),'Taarifa':('Taarifa','Annonces','Notices'),'Matangazo':('Matangazo','Annonces','Announcements'),'Nyaraka':('Nyaraka','Documents','Documents'),'Chat':('Chat','Chat','Chat'),'Mipangilio':('Mipangilio','Paramètres','Settings'),'Usalama':('Usalama','Sécurité','Security'),'Toka':('Toka','Déconnexion','Log out'),'Hifadhi':('Hifadhi','Enregistrer','Save'),'Ghairi':('Ghairi','Annuler','Cancel'),'Ongeza':('Ongeza','Ajouter','Add'),'Hariri':('Hariri','Modifier','Edit'),'Futa':('Futa','Supprimer','Delete'),'Tafuta':('Tafuta','Rechercher','Search'),'Refresh':('Refresh','Actualiser','Refresh'),'Inapakia...':('Inapakia...','Chargement...','Loading...'),'Hakuna taarifa.':('Hakuna taarifa.','Aucune information.','No information.'),'Jina':('Jina','Nom','Name'),'Tarehe':('Tarehe','Date','Date'),'Muda':('Muda','Heure','Time'),'Mahali':('Mahali','Lieu','Location'),'Maelezo':('Maelezo','Description','Description'),'Hali':('Hali','Statut','Status'),'Vitendo':('Vitendo','Actions','Actions'),'Jumla':('Jumla','Total','Total'),'Kiasi':('Kiasi','Montant','Amount'),'Mwezi':('Mwezi','Mois','Month'),'Mwaka':('Mwaka','Année','Year'),'Chagua':('Chagua','Choisir','Select'),'Chagua mwezi':('Chagua mwezi','Choisir le mois','Select month'),'Chagua mwaka':('Chagua mwaka','Choisir l’année','Select year'),'Ripoti ya Mahudhurio':('Ripoti ya Mahudhurio','Rapport des présences','Attendance Report'),'Ripoti ya Waimbaji':('Ripoti ya Waimbaji','Rapport des choristes','Singers Report'),'Pakua PDF':('Pakua PDF','Télécharger le PDF','Download PDF'),'Chapisha':('Chapisha','Imprimer','Print'),'Ongeza Mchango':('Ongeza Mchango','Ajouter une contribution','Add Contribution'),'Michango ya Mwezi':('Michango ya Mwezi','Contributions mensuelles','Monthly Contributions'),'Michango Mbalimbali':('Michango Mbalimbali','Contributions diverses','Miscellaneous Contributions'),'Ongeza Sare':('Ongeza Sare','Ajouter un uniforme','Add Uniform'),'Ratiba ya Kwaya':('Ratiba ya Kwaya','Calendrier de la chorale','Choir Schedule'),'Ongeza Tukio':('Ongeza Tukio','Ajouter un événement','Add Event'),'Matukio ya Kwaya':('Matukio ya Kwaya','Événements de la chorale','Choir Events'),'Ongeza Tangazo':('Ongeza Tangazo','Ajouter une annonce','Add Announcement'),'Matangazo ya Kwaya':('Matangazo ya Kwaya','Annonces de la chorale','Choir Announcements'),'Nyaraka za Kwaya':('Nyaraka za Kwaya','Documents de la chorale','Choir Documents'),'Ongeza Hati':('Ongeza Hati','Ajouter un document','Add Document'),'Tuma':('Tuma','Envoyer','Send'),'Andika ujumbe...':('Andika ujumbe...','Écrivez un message...','Type a message...'),'Ingia':('Ingia','Se connecter','Log in'),'Toka kwenye akaunti':('Toka kwenye akaunti','Se déconnecter','Log out'),'Barua pepe':('Barua pepe','Adresse e-mail','Email'),'Nenosiri':('Nenosiri','Mot de passe','Password'),'Kumbuka mimi':('Kumbuka mimi','Se souvenir de moi','Remember me'),'Umesahau nenosiri?':('Umesahau nenosiri ?','Mot de passe oublié ?','Forgot password?'),'Mipangilio ya Mfumo':('Mipangilio ya Mfumo','Paramètres du système','System Settings'),'Lugha':('Lugha','Langue','Language'),'Kiswahili':('Kiswahili','Swahili','Swahili'),'Français':('Français','Français','French'),'English':('English','Anglais','English'),'Badilisha lugha':('Badilisha lugha','Changer de langue','Change language'),'Sakramenti za Mwimbaji':('Sakramenti za Mwimbaji','Sacrements du choriste','Singer Sacraments'),'Taarifa Binafsi':('Taarifa Binafsi','Informations personnelles','Personal Information'),'Mawasiliano':('Mawasiliano','Coordonnées','Contact Information'),'Profile ya Mwimbaji':('Profile ya Mwimbaji','Profil du choriste','Singer Profile')}
          targets=['mass-programme.html','mass-program.html','mpango-wa-misa.html','contributions.html','michango.html','uniforms.html','sare.html','reports.html','ripoti.html','events.html','ratiba.html','announcements.html','matangazo.html','documents.html','nyaraka.html','chat.html','login.html','settings.html','security.html','dashboard.html','index.html','member-profile.html']
          targets += [p.name for p in Path('.').glob('*.html')]
          targets=sorted(set(targets))
          data={k:{'sw':v[0],'fr':v[1],'en':v[2]} for k,v in M.items()}
          dj=json.dumps(data,ensure_ascii=False)
          for fn in targets:
            p=Path(fn)
            if not p.exists(): continue
            s=p.read_text(encoding='utf-8')
            marker='<!-- COMPLETE_I18N_STATIC_UI_V1 -->'
            if marker in s or '</body>' not in s.lower(): continue
            js=f'''<script>(function(){{const D={dj};function run(){{const l=window.choirI18n&&typeof window.choirI18n.lang==='function'?window.choirI18n.lang():(localStorage.getItem('choirLang')||'sw'),d=D[l]||D.sw;document.querySelectorAll('[data-i18n]').forEach(e=>{{const k=e.getAttribute('data-i18n');if(d[k])e.textContent=d[k]}});document.querySelectorAll('input[placeholder],textarea[placeholder]').forEach(e=>{{const k=e.getAttribute('placeholder');if(d[k])e.placeholder=d[k]}});document.querySelectorAll('body *').forEach(e=>{{if(e.children.length)return;const k=(e.textContent||'').trim();if(d[k])e.textContent=d[k]}})}}function start(){{run();new MutationObserver(run).observe(document.body,{{childList:true,subtree:true,characterData:true}});window.addEventListener('languageChanged',run)}}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start()}})();</script>'''
            s=s.replace('</body>',marker+js+'</body>')
            p.write_text(s,encoding='utf-8'); print('patched',fn)
          PY
      - name: Commit and push with retry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then echo "No changes needed"; exit 0; fi
          git commit -m "fix: complete multilingual UI across choir pages"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort; git reset --hard origin/main; git add '*.html'; git commit -m "fix: complete multilingual UI across choir pages" || true; }
            if git push origin HEAD:main; then echo "Push succeeded on attempt $i"; exit 0; fi
            sleep 3
          done
          echo "Push failed after 5 attempts"
          exit 1