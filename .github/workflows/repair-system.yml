name: Repair Kwaya System

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/fix-mass-a4-final.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Clean duplicated branding and normalize pages
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          LOGO='https://raw.githubusercontent.com/enyonyiabemba94-eng/KWAYA-MANAGEMENT/main/KWAYA%20YA%20KRISTO%20MFALME%20NYARUGUSU%2020260902_141303.jpg'
          PAGES=[p for p in Path('.').glob('*.html') if p.name!='mass-programmes.html']
          BRAND_CSS='''
          /* KWAYA STANDARD BRANDING */
          .choir-brand-header{width:100%;display:grid;grid-template-columns:58px minmax(0,1fr) 58px;align-items:center;gap:10px;padding:8px 14px;background:#fff;border-bottom:2px solid #18122b;text-align:center;box-sizing:border-box}
          .choir-brand-header img{width:42px;height:42px;object-fit:contain;border:0;border-radius:0;background:transparent;display:block;margin:auto}
          .choir-brand-header .choir-brand-title{font-size:17px;font-weight:900;letter-spacing:.3px;color:#18122b;line-height:1.15}
          .choir-brand-header .choir-brand-subtitle{font-size:9px;font-weight:700;color:#5b6472;margin-top:2px;line-height:1.15}
          @media(max-width:700px){.choir-brand-header{grid-template-columns:40px minmax(0,1fr) 40px;gap:5px;padding:6px 7px}.choir-brand-header img{width:30px;height:30px}.choir-brand-header .choir-brand-title{font-size:13px}.choir-brand-header .choir-brand-subtitle{font-size:7px}}
          @media(max-width:700px){.side{transform:translateX(-100%);transition:transform .2s ease}.side.open{transform:translateX(0)}.main{margin-left:0!important;width:100%!important;max-width:100%!important}.menu{display:inline-block!important}}
          @media print{.choir-brand-header{grid-template-columns:42px minmax(0,1fr) 42px;padding:5px 0}.choir-brand-header img{width:32px;height:32px}.choir-brand-header .choir-brand-title{font-size:14px}.choir-brand-header .choir-brand-subtitle{font-size:7px}}
          '''
          def remove_class_element(html, cls):
              pat=re.compile(r'<(?P<tag>[A-Za-z][\w:-]*)\b(?P<attrs>[^>]*\bclass=["\'][^"\']*\b'+re.escape(cls)+r'\b[^"\']*["\'][^>]*)>',re.I)
              while True:
                  m=pat.search(html)
                  if not m:return html
                  tag=m.group('tag'); depth=1; end=None
                  tok=re.compile(r'<\s*/?\s*'+re.escape(tag)+r'\b[^>]*>',re.I)
                  for t in tok.finditer(html,m.end()):
                      raw=t.group(0)
                      if re.match(r'<\s*/',raw):
                          depth-=1
                          if depth==0:end=t.end();break
                      elif not raw.rstrip().endswith('/>'):depth+=1
                  if end is None:return html
                  html=html[:m.start()]+html[end:]
          nav='''<nav class="nav"><a href="index.html">🏠 Dashboard</a><a href="members.html">👥 Waimbaji</a><div class="nav-sub"><a href="sacraments.html">⛪ Sakramenti</a></div><a href="attendance.html">📋 Mahudhurio</a><a href="songs.html">🎵 Nyimbo</a><div class="nav-sub"><a href="song-books.html">📚 Vitabu vya Nyimbo</a></div><a href="mass-programmes.html">📖 Mpango wa Misa</a><a href="reports.html">📊 Ripoti</a><a href="events.html">📅 Ratiba</a><a href="announcements.html">📢 Taarifa</a><a href="documents.html">📄 Nyaraka</a><a href="settings.html">⚙️ Mipangilio</a></nav>'''
          brand=f'<div class="brand"><img class="brand-logo" src="{LOGO}" alt="Kwaya ya Kristu Mfalme"><div class="brand-text">KWAYA YA KRISTU MFALME<small>MFUMO WA USIMAMIZI WA KWAYA</small></div></div>'
          header=f'<div class="choir-brand-header"><img src="{LOGO}" alt="Kwaya ya Kristu Mfalme"><div><div class="choir-brand-title">KWAYA YA KRISTU MFALME</div><div class="choir-brand-subtitle">MFUMO WA USIMAMIZI WA KWAYA</div></div><img src="{LOGO}" alt="Kwaya ya Kristu Mfalme"></div>'
          for p in PAGES:
              h=p.read_text(encoding='utf-8')
              h=remove_class_element(h,'choir-final-brand')
              h=remove_class_element(h,'choir-brand-header')
              marker='/* FINAL KWAYA LAYOUT */'
              if marker in h:
                  pos=h.find(marker)
                  end=h.find('</style>',pos)
                  if end!=-1:h=h[:pos]+' '+h[end:]
              if '</style>' in h:h=h.replace('</style>',BRAND_CSS+'</style>',1)
              side=re.search(r'<aside\b[^>]*class=["\'][^"\']*\bside\b[^"\']*["\'][^>]*>.*?</aside>',h,re.I|re.S)
              if side:
                  a=side.group(0)
                  a=re.sub(r'<div\b[^>]*class=["\'][^"\']*\bbrand\b[^"\']*["\'][^>]*>.*?</div>',brand,a,count=1,flags=re.I|re.S)
                  a=re.sub(r'<nav\b[^>]*class=["\'][^"\']*\bnav\b[^"\']*["\'][^>]*>.*?</nav>',nav,a,count=1,flags=re.I|re.S)
                  h=h[:side.start()]+a+h[side.end():]
              tm=re.search(r'<header\b[^>]*class=["\'][^"\']*\btop\b[^"\']*["\'][^>]*>.*?</header>',h,re.I|re.S)
              if tm:h=h[:tm.end()]+header+h[tm.end():]
              p.write_text(h,encoding='utf-8')
          for n in ['README-repair.txt','x-temp-nope.txt','logo.jpg']:
              q=Path(n)
              if q.exists():q.unlink()
          PY
      - name: Commit repaired pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' . ':!mass-programmes.html' ':!github/workflows/fix-mass-a4-final.yml'
          git diff --cached --quiet && exit 0
          git commit -m 'Repair all choir system pages and normalize branding'
          git push
