name: Protect Admin Pages
on:
  push:
    branches: [android-branding-fix]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  protect:
    if: ${{ !contains(github.event.head_commit.message, 'Protect admin pages') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add admin guard to HTML pages
        shell: python
        run: |
          from pathlib import Path
          for p in Path('.').glob('*.html'):
              if p.name == 'login.html':
                  continue
              s=p.read_text(encoding='utf-8')
              if 'auth-guard.js' in s:
                  continue
              marker='<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>'
              if marker in s:
                  s=s.replace(marker, marker+'\n<script src="./auth-guard.js"></script>', 1)
                  p.write_text(s, encoding='utf-8')
      - name: Commit protected pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html'
          git diff --cached --quiet || git commit -m 'Protect admin pages'
          git push