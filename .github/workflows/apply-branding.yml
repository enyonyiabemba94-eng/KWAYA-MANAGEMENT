name: Apply Kwaya Branding
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  branding:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix navigation hierarchy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for p in Path('.').glob('*.html'):
              s=p.read_text(encoding='utf-8'); old=s
              m=re.search(r'<nav class="nav">.*?</nav>',s,re.S)
              if not m: continue
              items=[
              ('index.html','🏠 Dashboard',''),('members.html','👥 Waimbaji',''),
              ('sacraments.html','⛪ Sakramenti','child'),('attendance.html','📋 Mahudhurio',''),
              ('songs.html','🎵 Nyimbo',''),('song-books.html','📚 Vitabu vya Nyimbo','child'),
              ('mass-programmes.html','📖 Mpango wa Misa',''),('reports.html','📊 Ripoti',''),
              ('events.html','📅 Ratiba',''),('announcements.html','📢 Taarifa',''),
              ('documents.html','📄 Nyaraka',''),('settings.html','⚙️ Mipangilio','')]
              links=[]
              for href,label,child in items:
                  cls=(' class="nav-child"' if child else '')+(' class="active"' if not child and href==p.name else '')
                  if child and href==p.name: cls=' class="nav-child active"'
                  links.append(f'<a{cls} href="{href}">{label}</a>')
              s=s[:m.start()]+'<nav class="nav">'+''.join(links)+'</nav>'+s[m.end():]
              if '.nav-child{' not in s and '</style>' in s:
                  s=s.replace('</style>','.nav-child{padding-left:30px!important;font-size:12px!important;opacity:.95}</style>',1)
              if s!=old: p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html'
          if git diff --cached --quiet; then echo 'No changes needed.'; else git commit -m 'Fix choir navigation hierarchy'; git push; fi
