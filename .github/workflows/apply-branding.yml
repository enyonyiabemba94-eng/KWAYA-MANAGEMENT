name: Clean Kwaya Branding
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  branding:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix choir branding on all HTML pages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          LOGO='https://raw.githubusercontent.com/enyonyiabemba94-eng/KWAYA-MANAGEMENT/main/KWAYA%20YA%20KRISTO%20MFALME%20NYARUGUSU%2020260902_141303.jpg'
          items=[
            ('index.html','🏠 Dashboard',''),('members.html','👥 Waimbaji',''),
            ('sacraments.html','⛪ Sakramenti','child'),('attendance.html','📋 Mahudhurio',''),
            ('songs.html','🎵 Nyimbo',''),('song-books.html','📚 Vitabu vya Nyimbo','child'),
            ('mass-programmes.html','📖 Mpango wa Misa',''),('reports.html','📊 Ripoti',''),
            ('events.html','📅 Ratiba',''),('announcements.html','📢 Taarifa',''),
            ('documents.html','📄 Nyaraka',''),('settings.html','⚙️ Mipangilio','')]

          final_css='''.choir-final-brand{width:100%;display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:8px;padding:6px 10px;background:#fff;border-bottom:2px solid #18122b;text-align:center}.choir-final-brand img{width:34px!important;height:34px!important;object-fit:contain!important;border:0!important;border-radius:0!important;background:transparent!important;display:block;margin:auto}.choir-final-brand .title{font-size:18px!important;font-weight:900!important;letter-spacing:.3px;color:#18122b;line-height:1.15}.choir-final-brand .subtitle{font-size:9px!important;font-weight:700!important;color:#5b6472;margin-top:2px}@media(max-width:700px){.choir-final-brand{grid-template-columns:34px minmax(0,1fr) 34px;gap:5px;padding:6px}.choir-final-brand img{width:27px!important;height:27px!important}.choir-final-brand .title{font-size:13px!important}.choir-final-brand .subtitle{font-size:7px!important}}@media print{.choir-final-brand{grid-template-columns:40px minmax(0,1fr) 40px;padding:4px 0}.choir-final-brand img{width:30px!important;height:30px!important}.choir-final-brand .title{font-size:15px!important}.choir-final-brand .subtitle{font-size:7px!important}}'''

          for p in Path('.').glob('*.html'):
              s=p.read_text(encoding='utf-8'); old=s

              # Remove malformed extra closing div left by older branding pass.
              s=s.replace('</div></div><nav class="nav">','</div><nav class="nav">')

              # Replace the entire top choir branding block with exactly two logos and centered text.
              header=f'<div class="choir-final-brand"><img src="{LOGO}" alt="Kwaya ya Kristu Mfalme"><div><div class="title">KWAYA YA KRISTU MFALME</div><div class="subtitle">MFUMO WA USIMAMIZI WA KWAYA</div></div><img src="{LOGO}" alt="Kwaya ya Kristu Mfalme"></div>'
              if '<div class="choir-final-brand">' in s:
                  s=re.sub(r'<div class="choir-final-brand">.*?</div></div><img[^>]*></div>',header,s,count=1,flags=re.S)
              elif '<div class="choir-brand-header">' in s:
                  s=re.sub(r'<div class="choir-brand-header">.*?</div></div><img[^>]*></div>',header,s,count=1,flags=re.S)
              elif '<header class="top">' in s and '<main class="main">' in s:
                  s=s.replace('<main class="main">','<main class="main">'+header,1)

              # Standardize sidebar brand while preserving the page's JavaScript and content.
              brand=f'<div class="brand"><img class="brand-logo" src="{LOGO}" alt="Kwaya ya Kristu Mfalme"><div class="brand-text">KWAYA YA KRISTU MFALME<small>MFUMO WA USIMAMIZI WA KWAYA</small></div></div>'
              s=re.sub(r'<div class="brand">.*?<div class="brand-text">.*?</div></div>',brand,s,count=1,flags=re.S)
              if '<aside class="side" id="side">' in s and brand not in s:
                  s=s.replace('<aside class="side" id="side">','<aside class="side" id="side">'+brand,1)

              s=s.replace('📍 NYARUGUSU CAMP','').replace('📍 KASULU - KIGOMA/TANZANIA','').replace('📍 NYARUGUSU','')

              m=re.search(r'<nav class="nav">.*?</nav>',s,re.S)
              if m:
                  links=[]
                  for href,label,kind in items:
                      if kind=='child': continue
                      active=' class="active"' if href==p.name else ''
                      links.append(f'<a href="{href}"{active}>{label}</a>')
                      if href=='members.html':
                          ca=' class="active"' if p.name=='sacraments.html' else ''
                          links.append(f'<div class="nav-sub"><a href="sacraments.html"{ca}>⛪ Sakramenti</a></div>')
                      if href=='songs.html':
                          ca=' class="active"' if p.name=='song-books.html' else ''
                          links.append(f'<div class="nav-sub"><a href="song-books.html"{ca}>📚 Vitabu vya Nyimbo</a></div>')
                  s=s[:m.start()]+'<nav class="nav">'+''.join(links)+'</nav>'+s[m.end():]

              if '</style>' in s and '.choir-final-brand{' not in s:
                  s=s.replace('</style>',final_css+'</style>',1)

              if s!=old:
                  p.write_text(s,encoding='utf-8')
          PY
      - name: Commit branding fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html'
          if git diff --cached --quiet; then echo 'No changes needed.'; else git commit -m 'Fix choir logos and centered header'; git push; fi