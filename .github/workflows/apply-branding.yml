name: Clean Kwaya Branding
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  branding:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix choir branding on all HTML pages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          LOGO='https://raw.githubusercontent.com/enyonyiabemba94-eng/KWAYA-MANAGEMENT/main/KWAYA%20YA%20KRISTO%20MFALME%20NYARUGUSU%2020260902_141303.jpg'
          items=[('index.html','🏠 Dashboard',''),('members.html','👥 Waimbaji',''),('sacraments.html','⛪ Sakramenti','child'),('attendance.html','📋 Mahudhurio',''),('songs.html','🎵 Nyimbo',''),('song-books.html','📚 Vitabu vya Nyimbo','child'),('mass-programmes.html','📖 Mpango wa Misa',''),('reports.html','📊 Ripoti',''),('events.html','📅 Ratiba',''),('announcements.html','📢 Taarifa',''),('documents.html','📄 Nyaraka',''),('settings.html','⚙️ Mipangilio','')]
          css='''.choir-final-brand{width:100%;display:grid;grid-template-columns:42px minmax(0,1fr) 42px;align-items:center;gap:7px;padding:5px 8px;background:#fff;border-bottom:1px solid #18122b;text-align:center;box-sizing:border-box}.choir-final-brand img{width:30px!important;height:30px!important;object-fit:contain!important;border:0!important;border-radius:0!important;background:transparent!important;display:block;margin:auto}.choir-final-brand .title{font-size:15px!important;font-weight:900!important;letter-spacing:.2px;color:#18122b;line-height:1.1}.choir-final-brand .subtitle{font-size:7px!important;font-weight:700!important;color:#5b6472;margin-top:1px}@media(max-width:700px){.choir-final-brand{grid-template-columns:34px minmax(0,1fr) 34px;gap:4px;padding:4px}.choir-final-brand img{width:24px!important;height:24px!important}.choir-final-brand .title{font-size:12px!important}.choir-final-brand .subtitle{font-size:6px!important}}@media print{.choir-final-brand{grid-template-columns:34px minmax(0,1fr) 34px;padding:3px 0}.choir-final-brand img{width:24px!important;height:24px!important}.choir-final-brand .title{font-size:13px!important}.choir-final-brand .subtitle{font-size:6px!important}}'''
          for p in Path('.').glob('*.html'):
              s=p.read_text(encoding='utf-8'); old=s
              m=re.search(r'<aside class="side" id="side">.*?</aside>\s*<header class="top">',s,re.S)
              if m:
                  links=[]
                  for href,label,kind in items:
                      if kind=='child': continue
                      active=' class="active"' if href==p.name else ''
                      links.append(f'<a href="{href}"{active}>{label}</a>')
                      if href=='members.html':
                          ca=' class="active"' if p.name=='sacraments.html' else ''
                          links.append(f'<div class="nav-sub"><a href="sacraments.html"{ca}>⛪ Sakramenti</a></div>')
                      if href=='songs.html':
                          ca=' class="active"' if p.name=='song-books.html' else ''
                          links.append(f'<div class="nav-sub"><a href="song-books.html"{ca}>📚 Vitabu vya Nyimbo</a></div>')
                  sidebar=f'<aside class="side" id="side"><div class="brand"><img class="brand-logo" src="{LOGO}" alt="Kwaya ya Kristu Mfalme"><div class="brand-text">KWAYA YA KRISTU MFALME<small>MFUMO WA USIMAMIZI WA KWAYA</small></div></div><nav class="nav">'+''.join(links)+'</nav></aside>'
                  s=s[:m.start()]+sidebar+'<header class="top">'+s[m.end():]
              s=re.sub(r'<div\s+class="(?:choir-final-brand|choir-brand-header)"[^>]*>.*?</div>\s*(?=<(?:div|section|h1|main|header|footer|$))','',s,count=0,flags=re.S)
              s=re.sub(r'<img[^>]+alt="Kwaya ya Kristu Mfalme"[^>]*>','',s)
              header=f'<div class="choir-final-brand"><img src="{LOGO}" alt="Kwaya ya Kristu Mfalme"><div><div class="title">KWAYA YA KRISTU MFALME</div><div class="subtitle">MFUMO WA USIMAMIZI WA KWAYA</div></div><img src="{LOGO}" alt="Kwaya ya Kristu Mfalme"></div>'
              if '<header class="top">' in s:
                  s=re.sub(r'(<header class="top">.*?</header>)',r'\1'+header,s,count=1,flags=re.S)
              elif '<main class="main">' in s:
                  s=s.replace('<main class="main">','<main class="main">'+header,1)
              if '</style>' in s and '.choir-final-brand{' not in s:
                  s=s.replace('</style>',css+'</style>',1)
              s=s.replace('📍 NYARUGUSU CAMP','').replace('📍 KASULU - KIGOMA/TANZANIA','').replace('📍 NYARUGUSU','')
              if s!=old: p.write_text(s,encoding='utf-8')
          PY
      - name: Commit branding fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html'
          if git diff --cached --quiet; then echo 'No changes needed.'; else git commit -m 'Increase choir logo to a clear moderate size'; git push; fi
