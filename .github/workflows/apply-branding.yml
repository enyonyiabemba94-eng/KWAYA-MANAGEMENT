name: Apply Kwaya Branding

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  branding:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply choir branding
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          logo='https://raw.githubusercontent.com/enyonyiab94-eng/KWAYA-MANAGEMENT/main/KWAYA%20YA%20KRISTO%20MFALME%20NYARUGUSU%2020260902_141303.jpg'

          for p in Path('.').glob('*.html'):
              s=p.read_text(encoding='utf-8')
              old=s
              s=s.replace('🎶 KWAYA MANAGEMENT','🎶 KWAYA YA KRISTO MFALME')
              s=s.replace('Usimamizi wa Kwaya Kristo Mfalme','📍 NYARUGUSU CAMP')
              s=s.replace('KWAYA MANAGEMENT','KWAYA YA KRISTO MFALME')

              # Add the official logo to every sidebar brand that does not already have one.
              if 'class="brand"' in s and logo not in s:
                  s=s.replace('<div class="brand">','<div class="brand"><img class="brand-logo" src="'+logo+'" alt="Kwaya ya Kristo Mfalme">',1)
                  s=s.replace('</style>',' .brand{display:flex;align-items:center;gap:10px}.brand-logo{width:44px;height:44px;object-fit:cover;border-radius:50%;background:#fff;flex:none} </style>',1)

              # Ensure the location label is visible in brand blocks where the old subtitle remains.
              s=s.replace('<small>Usimamizi wa Kwaya</small>','<small>Usimamizi wa Kwaya</small><span class="brand-location">📍 NYARUGUSU CAMP</span>')
              if 'brand-location' in s:
                  s=s.replace('</style>',' .brand-location{display:block;color:#d8ccf0;font-size:10px;margin-top:3px;font-weight:600} </style>',1)

              if s != old:
                  p.write_text(s,encoding='utf-8')
          PY

      - name: Commit branded pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html'
          if git diff --cached --quiet; then
            echo 'No branding changes needed.'
          else
            git commit -m 'Brand all choir pages as Kwaya ya Kristo Mfalme'
            git push
          fi
