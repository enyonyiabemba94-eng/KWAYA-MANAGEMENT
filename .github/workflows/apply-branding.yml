name: Clean Kwaya Branding
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  branding:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair choir layout on all HTML pages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          LOGO='https://raw.githubusercontent.com/enyonyiabemba94-eng/KWAYA-MANAGEMENT/main/KWAYA%20YA%20KRISTO%20MFALME%20NYARUGUSU%2020260902_141303.jpg'
          items=[('index.html','🏠 Dashboard',''),('members.html','👥 Waimbaji',''),('sacraments.html','⛪ Sakramenti','child'),('attendance.html','📋 Mahudhurio',''),('songs.html','🎵 Nyimbo',''),('song-books.html','📚 Vitabu vya Nyimbo','child'),('mass-programmes.html','📖 Mpango wa Misa',''),('reports.html','📊 Ripoti',''),('events.html','📅 Ratiba',''),('announcements.html','📢 Taarifa',''),('documents.html','📄 Nyaraka',''),('settings.html','⚙️ Mipangilio','')]
          css='''/* FINAL KWAYA LAYOUT */html,body{margin:0!important;padding:0!important;width:100%;max-width:100%;overflow-x:hidden}.side{position:fixed!important;left:0!important;top:0!important;bottom:0!important;width:230px!important;z-index:1000!important;overflow-y:auto!important;overflow-x:hidden!important}.main{margin-left:230px!important;min-height:100vh!important;width:auto!important;max-width:calc(100% - 230px)!important}.top{position:relative!important;width:100%!important;min-height:70px!important;height:auto!important;z-index:20!important;display:flex!important;align-items:center!important;justify-content:space-between!important;box-sizing:border-box!important}.content{position:relative!important;z-index:1!important;width:100%!important;max-width:100%!important;box-sizing:border-box!important}.choir-final-brand{width:100%!important;display:grid!important;grid-template-columns:52px minmax(0,1fr) 52px!important;align-items:center!important;gap:8px!important;padding:7px 10px!important;background:#fff!important;border-bottom:2px solid #18122b!important;text-align:center!important;box-sizing:border-box!important;position:relative!important;z-index:15!important;min-height:56px!important;clear:both!important}.choir-final-brand img{width:40px!important;height:40px!important;object-fit:contain!important;border:0!important;border-radius:0!important;background:transparent!important;display:block!important;margin:auto!important}.choir-final-brand .title{font-size:15px!important;font-weight:900!important;letter-spacing:.2px!important;color:#18122b!important;line-height:1.15!important;white-space:normal!important}.choir-final-brand .subtitle{font-size:7px!important;font-weight:700!important;color:#5b6472!important;margin-top:2px!important;line-height:1.1!important}.brand{display:flex!important;align-items:center!important;gap:9px!important;padding:8px!important}.brand-logo{width:34px!important;height:34px!important;object-fit:contain!important;border-radius:0!important;background:transparent!important;flex:none!important}.brand-text{font-size:12px!important;font-weight:800!important;line-height:1.15!important}.brand-text small{display:block!important;color:#b9aecf!important;font-size:9px!important;margin-top:3px!important;font-weight:600!important}.nav-sub{margin:0 0 2px 12px!important;border-left:2px solid #ffffff20!important;padding-left:4px!important}.nav-sub a{font-size:12px!important;padding:8px 10px!important}.nav-sub a.active{background:#8b5cf633!important;color:#fff!important}.table{width:100%!important;max-width:100%!important;overflow-x:auto!important}table{min-width:1050px}@media(max-width:700px){.side{width:230px!important;transform:translateX(-100%)!important;transition:transform .2s ease!important}.side.open{transform:translateX(0)!important}.main{margin-left:0!important;width:100%!important;max-width:100%!important}.top{min-height:64px!important;padding:8px 12px!important}.content{padding:14px!important}.menu{display:block!important;position:relative!important;z-index:1100!important}.choir-final-brand{grid-template-columns:42px minmax(0,1fr) 42px!important;gap:5px!important;padding:6px 5px!important;min-height:46px!important}.choir-final-brand img{width:32px!important;height:32px!important}.choir-final-brand .title{font-size:12px!important}.choir-final-brand .subtitle{font-size:6px!important}}@media print{.side,.menu{display:none!important}.main{margin-left:0!important;max-width:100%!important;width:100%!important}.choir-final-brand{grid-template-columns:42px minmax(0,1fr) 42px!important;padding:4px 0!important;min-height:40px!important}.choir-final-brand img{width:32px!important;height:32px!important}.choir-final-brand .title{font-size:13px!important}.choir-final-brand .subtitle{font-size:6px!important}}'''
          for p in Path('.').glob('*.html'):
              s=p.read_text(encoding='utf-8'); old=s
              s=re.sub(r'<div\s+class="choir-final-brand"[^>]*>.*?</div>\s*</div>\s*</div>', '', s, flags=re.S)
              s=re.sub(r'<div\s+class="choir-brand-header"[^>]*>.*?</div>\s*</div>\s*</div>', '', s, flags=re.S)
              s=re.sub(r'<img[^>]+alt="Kwaya ya Kristu Mfalme"[^>]*>\s*', '', s)
              links=[]
              for href,label,kind in items:
                  if kind=='child': continue
                  active=' class="active"' if href==p.name else ''
                  links.append(f'<a href="{href}"{active}>{label}</a>')
                  if href=='members.html':
                      ca=' class="active"' if p.name=='sacraments.html' else ''
                      links.append(f'<div class="nav-sub"><a href="sacraments.html"{ca}>⛪ Sakramenti</a></div>')
                  if href=='songs.html':
                      ca=' class="active"' if p.name=='song-books.html' else ''
                      links.append(f'<div class="nav-sub"><a href="song-books.html"{ca}>📚 Vitabu vya Nyimbo</a></div>')
              sidebar=f'<aside class="side" id="side"><div class="brand"><img class="brand-logo" src="{LOGO}" alt="Kwaya ya Kristu Mfalme"><div class="brand-text">KWAYA YA KRISTU MFALME<small>MFUMO WA USIMAMIZI WA KWAYA</small></div></div><nav class="nav">'+''.join(links)+'</nav></aside>'
              s=re.sub(r'<aside class="side" id="side">.*?</aside>\s*(?=<header class="top">)', sidebar, s, count=1, flags=re.S)
              if '<aside class="side" id="side">' not in s and '<header class="top">' in s:
                  s=s.replace('<header class="top">',sidebar+'<header class="top">',1)
              header=f'<div class="choir-final-brand"><img src="{LOGO}" alt="Kwaya ya Kristu Mfalme"><div><div class="title">KWAYA YA KRISTU MFALME</div><div class="subtitle">MFUMO WA USIMAMIZI WA KWAYA</div></div><img src="{LOGO}" alt="Kwaya ya Kristu Mfalme"></div>'
              s=re.sub(r'(<header class="top">.*?</header>)',r'\1'+header,s,count=1,flags=re.S)
              if '/* FINAL KWAYA LAYOUT */' not in s and '</style>' in s:
                  s=s.replace('</style>',css+'</style>',1)
              s=s.replace('📍 NYARUGUSU CAMP','').replace('📍 KASULU - KIGOMA/TANZANIA','').replace('📍 NYARUGUSU','')
              if s!=old: p.write_text(s,encoding='utf-8')
          PY
      - name: Commit repaired pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html'
          if git diff --cached --quiet; then echo 'No changes needed.'; else git commit -m 'Repair all choir pages layout and branding'; git push; fi
