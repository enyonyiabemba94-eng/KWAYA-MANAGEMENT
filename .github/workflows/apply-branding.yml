name: Apply Kwaya Branding

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  branding:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply choir branding
        run: |
          python3 - <<'PY'
          from pathlib import Path

          logo='https://raw.githubusercontent.com/enyonyiabemba94-eng/KWAYA-MANAGEMENT/main/KWAYA%20YA%20KRISTO%20MFALME%20NYARUGUSU%2020260902_141303.jpg'

          for p in Path('.').glob('*.html'):
              s=p.read_text(encoding='utf-8')
              old=s
              s=s.replace('🎶 KWAYA MANAGEMENT','🎶 KWAYA YA KRISTO MFALME')
              s=s.replace('KWAYA MANAGEMENT','KWAYA YA KRISTO MFALME')

              if 'class="brand"' in s and logo not in s:
                  s=s.replace('<div class="brand">','<div class="brand"><img class="brand-logo" src="'+logo+'" alt="Kwaya ya Kristo Mfalme">',1)
                  s=s.replace('</style>',' .brand{display:flex;align-items:center;gap:10px}.brand-logo{width:44px;height:44px;object-fit:cover;border-radius:50%;background:#fff;flex:none} </style>',1)

              if p.name == 'mass-programmes.html':
                  s=s.replace('<span class="brand-location">📍 NYARUGUSU CAMP</span><span class="brand-location">📍 KASULU - KIGOMA/TANZANIA</span>', '<span class="brand-location">📍 KASULU - KIGOMA/TANZANIA</span>')

              if s != old:
                  p.write_text(s,encoding='utf-8')
          PY

      - name: Commit branded pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html'
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'Apply choir branding'
            git push
          fi
