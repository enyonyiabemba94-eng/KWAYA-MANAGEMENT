name: Apply Kwaya Branding

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  branding:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply choir branding
        run: |
          python3 - <<'PY'
          from pathlib import Path

          logo='https://raw.githubusercontent.com/enyonyiabemba94-eng/KWAYA-MANAGEMENT/main/KWAYA%20YA%20KRISTO%20MFALME%20NYARUGUSU%2020260902_141303.jpg'

          css='''
          .choir-brand-header{width:100%;display:grid;grid-template-columns:72px 1fr 72px;align-items:center;gap:14px;padding:12px 18px;background:#fff;border-bottom:2px solid #18122b;text-align:center;box-sizing:border-box}
          .choir-brand-header img{width:58px;height:58px;object-fit:contain;border-radius:0;background:transparent;display:block;margin:auto}
          .choir-brand-header .choir-brand-title{font-size:21px;font-weight:900;letter-spacing:.4px;color:#18122b;line-height:1.2}
          .choir-brand-header .choir-brand-subtitle{font-size:11px;font-weight:700;color:#5b6472;margin-top:4px}
          @media(max-width:700px){.choir-brand-header{grid-template-columns:48px 1fr 48px;gap:6px;padding:9px 8px}.choir-brand-header img{width:40px;height:40px}.choir-brand-header .choir-brand-title{font-size:15px}.choir-brand-header .choir-brand-subtitle{font-size:9px}}
          @media print{.choir-brand-header{grid-template-columns:55px 1fr 55px;padding:6px 0;border-bottom:1.5px solid #000}.choir-brand-header img{width:45px;height:45px}.choir-brand-header .choir-brand-title{font-size:17px}.choir-brand-header .choir-brand-subtitle{font-size:8px}}
          '''

          header='''<div class="choir-brand-header"><img src="'''+logo+'''" alt="Kwaya ya Kristo Mfalme"><div><div class="choir-brand-title">KWAYA YA KRISTO MFALME</div><div class="choir-brand-subtitle">MFUMO WA USIMAMIZI WA KWAYA</div></div><img src="'''+logo+'''" alt="Kwaya ya Kristo Mfalme"></div>'''

          for p in Path('.').glob('*.html'):
              s=p.read_text(encoding='utf-8')
              old=s
              s=s.replace('🎶 KWAYA MANAGEMENT','🎶 KWAYA YA KRISTO MFALME')
              s=s.replace('KWAYA MANAGEMENT','KWAYA YA KRISTO MFALME')

              if '<div class="choir-brand-header">' not in s:
                  if '<main class="main">' in s:
                      s=s.replace('<main class="main">','<main class="main">'+header,1)
                  elif '<main>' in s:
                      s=s.replace('<main>','<main>'+header,1)

              if 'choir-brand-header' in s and '.choir-brand-header{' not in s:
                  s=s.replace('</style>',css+'</style>',1)

              if 'class="brand"' in s and logo not in s:
                  s=s.replace('<div class="brand">','<div class="brand"><img class="brand-logo" src="'+logo+'" alt="Kwaya ya Kristo Mfalme">',1)
                  s=s.replace('</style>',' .brand{display:flex;align-items:center;gap:10px}.brand-logo{width:44px;height:44px;object-fit:contain;border-radius:0;background:transparent;flex:none} </style>',1)

              if p.name == 'mass-programmes.html':
                  s=s.replace('<span class="brand-location">📍 NYARUGUSU CAMP</span><span class="brand-location">📍 KASULU - KIGOMA/TANZANIA</span>', '<span class="brand-location">📍 KASULU - KIGOMA/TANZANIA</span>')

              if s != old:
                  p.write_text(s,encoding='utf-8')
          PY

      - name: Commit branded pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html'
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'Standardize choir header across all pages'
            git push
          fi
