name: Cleanup Mass Programme
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove old conductor patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('mass-programmes.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- DIRECT-CONDUCTOR-FIX -->'
          if marker in s:
              s=s.split(marker,1)[0].rstrip()
              s=s.replace('\\n','')
              s += '\n</body>\n</html>\n'
          else:
              s=s.replace('</script>\\n\\n</body>', '</script>\n\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'WAONGOZA NYIMBO:' mass-programmes.html
          grep -q 'MWISHO' mass-programmes.html
          ! grep -q 'DIRECT-CONDUCTOR-FIX' mass-programmes.html
          ! grep -q 'function getConductorNames' mass-programmes.html
          ! grep -q '\\\\n\\\\n' mass-programmes.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mass-programmes.html
          git diff --cached --quiet || git commit -m 'Clean mass programme conductor patch'
          git push