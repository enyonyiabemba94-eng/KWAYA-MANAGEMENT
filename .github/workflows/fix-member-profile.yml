name: Fix Member Profile, Sacraments and App Session
on:
  workflow_dispatch:
  push:
    paths:
      - members.html
      - member-profile.html
      - auth-guard.js
      - .github/workflows/fix-member-profile.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app session and profile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for fn in ['members.html','member-profile.html']:
              p=Path(fn); s=p.read_text()
              tag='<script src="./auth-guard.js"></script>'
              if tag not in s:
                  s=s.replace('</head>',tag+'</head>',1)
                  p.write_text(s)

          # Make the profile loader resilient: one optional query must never leave
          # the whole page stuck forever on "Inapakia profile...".
          p=Path('member-profile.html'); s=p.read_text()
          s=s.replace("db.from('voice_parts').select('id,name').order('sort_order')","db.from('voice_parts').select('id,name').order('name')")
          s=s.replace("async function load(){if(!memberId){app.innerHTML=", "async function load(){try{if(!memberId){app.innerHTML=")
          old="}load();</script>"
          new="}}catch(err){console.error('Profile load error:',err);app.innerHTML='<div class=\"error\">Profile haijafunguka. Tafadhali rudi kwenye Waimbaji na ujaribu tena.</div>';}}load();</script>"
          if old in s:
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add members.html member-profile.html
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'Fix profile loading and query error handling'
          git push