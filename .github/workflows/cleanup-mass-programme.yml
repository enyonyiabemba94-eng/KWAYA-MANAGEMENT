name: Cleanup mass programme
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove injected conductor patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('mass-programmes.html')
          s=p.read_text()
          marker='<!-- DIRECT-CONDUCTOR-FIX -->'
          if marker in s:
              s=s[:s.index(marker)].rstrip()
              if not s.endswith('</body>'):
                  s += '\n</body>\n</html>\n'
              elif not s.endswith('</html>'):
                  s += '\n</html>\n'
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add mass-programmes.html
          git diff --cached --quiet || git commit -m 'Clean extra conductor patch from mass programme'
          git push
      - name: Remove cleanup workflow
        if: success()
        run: |
          git rm -f .github/workflows/cleanup-mass-programme.yml
          git commit -m 'Remove temporary mass programme cleanup workflow'
          git push
