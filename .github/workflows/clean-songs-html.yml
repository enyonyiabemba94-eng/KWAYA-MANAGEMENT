name: Clean Songs HTML
on:
  workflow_dispatch:
  push:
    paths:
      - songs.html
      - trigger-songs-clean.txt
      - .github/workflows/clean-songs-html.yml
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore songs page HTML structure only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('songs.html')
          s=p.read_text()
          target='</div><nav class="nav">'
          if target in s:
              s=s.replace(target,'</div></div><nav class="nav">',1)
          p.write_text(s)
          print('songs.html structure restored')
          PY
      - name: Commit structure fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add songs.html
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'Restore songs page HTML structure'
          git push
