name: Install Mass Programme Special Events
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair and install Baptism feature
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('mass-programmes.html')
          s=p.read_text(encoding='utf-8')
          # Remove previous broken/temporary injections and the missing external script.
          s=re.sub(r'<style id="baptism-main-css">.*?</style>\s*</style>', '', s, flags=re.S)
          s=re.sub(r'<style id="baptism-main-css">.*?</style>', '', s, flags=re.S)
          s=re.sub(r'\\n<script id="baptism-main-js">.*?\\n</script>\\n', '', s, flags=re.S)
          s=re.sub(r'<script id="baptism-main-js">.*?</script>\s*', '', s, flags=re.S)
          s=s.replace('<script src="./mass-special-events.js?v=20260904"></script>','')
          marker='<!-- BAPTISM-MAIN-V1 -->'
          css='''.baptism-editor{border:1px solid #ddd6fe;background:#faf7ff;border-radius:10px;padding:10px;margin:10px 0}.baptism-editor h3{margin:0 0 8px;font-size:13px;color:#5b21b6}.baptism-item{background:#fff;border:1px solid #e5e7eb;border-radius:9px;padding:8px;margin:7px 0}.baptism-item-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:900;font-size:11px;color:#1A365D}.baptism-song{display:grid;grid-template-columns:minmax(0,1fr) 82px 32px;gap:6px;margin-top:6px}.baptism-song .remove{height:38px}.baptism-empty{font-size:9px;color:#6b7280;margin:4px 0}.baptism-preview{margin-top:3mm}.baptism-preview .psec{margin:4pt 0}.baptism-preview .psec h4{font-size:12pt;margin:4pt 0}.baptism-preview .psec .psong{font-size:10pt;margin:1pt 0}@media(max-width:700px){.baptism-song{grid-template-columns:1fr 1fr 32px}}'''
          js='''<script id="baptism-main-js">\n/* BAPTISM-MAIN-V1 */\n(function(){\nconst BAPTISM=['ISHARA YA MSALABA','MAFUTA YA WAKATEKUMENI','UBATIZO WENYEWE','MAFUTA YA KRISMA','NGUO NYEUPE','MSHUMAA','EFETA'];\nlet baptismData=BAPTISM.map(name=>({name,songs:[]}));\nconst $=id=>document.getElementById(id);\nconst esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]));\nconst checked=()=>!!document.querySelector('input[type=checkbox][value="Ubatizo"]:checked');\nfunction songOpts(id){let o='<option value="">— Chagua wimbo —</option>';for(const x of (window.songs||[]))o+=`<option value="${esc(x.id)}" ${String(x.id)===String(id)?'selected':''}>${esc(x.song_number||'')}. ${esc(x.title)}</option>`;return o}\nfunction keys(k){const a=['DO','DO#','RE','RE#','MI','FA','FA#','SOL','SOL#','LA','LA#','SI'];return '<option value="">Key</option>'+a.map(x=>`<option ${x===k?'selected':''}>${x}</option>`).join('')}\nfunction render(){const h=$('baptism-editor');if(!h)return;h.style.display=checked()?'block':'none';if(!checked())return;h.innerHTML='<h3>💧 UBATIZO — VIPENGELE VYA SHEREHE</h3>'+baptismData.map((x,i)=>`<div class="baptism-item"><div class="baptism-item-head"><span>${i+1}. ${esc(x.name)}</span><button class="btn muted" onclick="KW_BAPTISM_ADD(${i})">＋ Wimbo</button></div>${x.songs.length?x.songs.map((v,j)=>`<div class="baptism-song"><select onchange="KW_BAPTISM_CHANGE(${i},${j},this.value)">${songOpts(v.id)}</select><select onchange="KW_BAPTISM_KEY(${i},${j},this.value)">${keys(v.key)}</select><button class="remove" onclick="KW_BAPTISM_REMOVE(${i},${j})">×</button></div>`).join(''):'<div class="baptism-empty">Hakuna wimbo bado. Ongeza wimbo bila kikomo.</div>'}</div>`).join('')}\nwindow.KW_BAPTISM_ADD=i=>{baptismData[i].songs.push({id:'',title:'',key:''});render()};\nwindow.KW_BAPTISM_REMOVE=(i,j)=>{baptismData[i].songs.splice(j,1);render()};\nwindow.KW_BAPTISM_CHANGE=(i,j,id)=>{const v=baptismData[i].songs[j];v.id=id;const x=(window.songs||[]).find(s=>String(s.id)===String(id));v.title=x?.title||'';v.key=typeof normKey==='function'?normKey(x?.key_signature):String(x?.key_signature||'');render()};\nwindow.KW_BAPTISM_KEY=(i,j,k)=>{baptismData[i].songs[j].key=typeof normKey==='function'?normKey(k):k;render()};\nfunction pack(){return baptismData.map(x=>({name:x.name,songs:x.songs.filter(v=>v.id||v.title).map(v=>({id:v.id||'',title:v.title||'',key:v.key||''}))}))}\nfunction restore(){try{const x=(window.programmes||[]).find(p=>String(p.id)===String(window.selectedId));const b=x?.meta?.baptism;if(Array.isArray(b))baptismData=BAPTISM.map(name=>{const z=b.find(v=>v.name===name);return{name,songs:(z?.songs||[]).map(v=>({id:v.id||'',title:v.title||'',key:v.key||''}))}})}catch(e){}render()}\nconst oldNew=window.newProgramme;if(oldNew&&!oldNew.__kwb){window.newProgramme=function(){const r=oldNew.apply(this,arguments);baptismData=BAPTISM.map(name=>({name,songs:[]}));render();return r};window.newProgramme.__kwb=true}\nconst oldChoose=window.choose;if(oldChoose&&!oldChoose.__kwb){window.choose=function(){const r=oldChoose.apply(this,arguments);setTimeout(restore,0);return r};window.choose.__kwb=true}\nconst oldSave=window.saveProgramme;if(oldSave&&!oldSave.__kwb){window.saveProgramme=async function(){const r=await oldSave.apply(this,arguments);try{if(window.selectedId){const q=await window.db.from('events').select('description').eq('id',window.selectedId).single();if(!q.error){let m={};try{m=JSON.parse(q.data.description||'{}')}catch{}m.baptism=pack();await window.db.from('events').update({description:JSON.stringify(m),updated_at:new Date().toISOString()}).eq('id',window.selectedId)}}}catch(e){console.warn(e)}return r};window.saveProgramme.__kwb=true}\nconst oldPreview=window.showPreview;if(oldPreview&&!oldPreview.__kwb){window.showPreview=function(){const r=oldPreview.apply(this,arguments);setTimeout(()=>{if(!checked())return;const col=document.querySelector('#preview .col-right');if(!col)return;col.querySelectorAll('.kw-baptism-preview').forEach(x=>x.remove());const empty=[...col.querySelectorAll('.psec')].find(x=>(x.querySelector('h4')?.textContent||'').trim().toUpperCase()==='UBATIZO');if(empty)empty.remove();const w=document.createElement('div');w.className='kw-baptism-preview';w.innerHTML=pack().map(x=>{const rows=x.songs.map((v,i)=>`<div class="psong"><b>${i+1}.</b> ${esc(v.title)} ${v.key?`— <span class="key">${esc(v.key)}</span>`:''}</div>`).join('');return rows?`<div class="psec"><h4>${esc(x.name)}</h4>${rows}</div>`:''}).join('');if(w.innerHTML)col.appendChild(w);if(typeof fitOnePage==='function')fitOnePage()},0);return r};window.showPreview.__kwb=true}\nfunction mount(){let h=$('baptism-editor');if(!h){const lab=[...document.querySelectorAll('.field label')].find(x=>(x.textContent||'').trim().toUpperCase()==='TUKIO MAALUM NDANI YA MISA');const f=lab?.parentElement;if(!f)return;h=document.createElement('div');h.id='baptism-editor';h.className='baptism-editor';f.insertAdjacentElement('afterend',h);document.querySelectorAll('input[type=checkbox]').forEach(x=>x.addEventListener('change',render))}render()}\nif(document.readyState==='loading')document.addEventListener('DOMContentLoaded',mount);else mount();\n})();\n</script>'''
          s=s.replace('</style>', '<style id="baptism-main-css">'+css+'</style></style>',1)
          s=s.replace('</body>',js+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mass-programmes.html
          git commit -m 'Install Baptism sections in main system'
          git push
