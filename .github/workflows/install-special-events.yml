name: Install Mass Programme Special Events
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install special events script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('mass-programmes.html')
          s=p.read_text()
          tag='<script src="./mass-special-events.js?v=20260904"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'\n</body>')
              p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- mass-programmes.html; then exit 0; fi
          git add mass-programmes.html
          git commit -m 'Add special event controls to Mass Programme'
          git push
