name: Install Mass Programme Special Events
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Baptism feature
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('mass-programmes.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- BAPTISM-MAIN-V1 -->'
          if marker in s:
              print('Baptism feature already installed')
              raise SystemExit(0)
          css='''\n<style id="baptism-main-css">\n.baptism-editor{border:1px solid #ddd6fe;background:#faf7ff;border-radius:10px;padding:10px;margin:10px 0}.baptism-editor h3{margin:0 0 8px;font-size:13px;color:#5b21b6}.baptism-item{background:#fff;border:1px solid #e5e7eb;border-radius:9px;padding:8px;margin:7px 0}.baptism-item-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:900;font-size:11px;color:#1A365D}.baptism-song{display:grid;grid-template-columns:minmax(0,1fr) 82px 32px;gap:6px;margin-top:6px}.baptism-song .remove{height:38px}.baptism-empty{font-size:9px;color:#6b7280;margin:4px 0}.baptism-preview{margin-top:3mm}.baptism-preview .psec{margin:4pt 0}.baptism-preview .psec h4{font-size:12pt;margin:4pt 0}.baptism-preview .psec .psong{font-size:10pt;margin:1pt 0}@media(max-width:700px){.baptism-song{grid-template-columns:1fr 1fr 32px}}\n</style>\n'''
          js=r'''\n<script id="baptism-main-js">\n/* BAPTISM-MAIN-V1 */\n(function(){\n  const BAPTISM=['ISHARA YA MSALABA','MAFUTA YA WAKATEKUMENI','UBATIZO WENYEWE','MAFUTA YA KRISMA','NGUO NYEUPE','MSHUMAA','EFETA'];\n  let baptismData=BAPTISM.map(name=>({name,songs:[]}));\n  const get=id=>document.getElementById(id);\n  const esc2=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));\n  const isBaptism=()=>!!document.querySelector('input[type=checkbox][value="Ubatizo"]:checked');\n  function songOptions(id){let o='<option value="">— Chagua wimbo —</option>'; (window.songs||[]).forEach(x=>{o+=`<option value="${x.id}" ${String(x.id)===String(id)?'selected':''}>${esc2(x.song_number||'')}. ${esc2(x.title)}</option>`}); return o;}\n  function keyOpts(k){const keys=['DO','DO#','RE','RE#','MI','FA','FA#','SOL','SOL#','LA','LA#','SI'];return '<option value="">Key</option>'+keys.map(x=>`<option ${x===k?'selected':''}>${x}</option>`).join('')}\n  function render(){const host=get('baptism-editor');if(!host)return;host.style.display=isBaptism()?'block':'none';if(!isBaptism())return;host.innerHTML='<h3>💧 UBATIZO — VIPENGELE VYA SHEREHE</h3>'+baptismData.map((item,i)=>`<div class="baptism-item"><div class="baptism-item-head"><span>${i+1}. ${esc2(item.name)}</span><button class="btn muted" onclick="window.KWAYA_BAPTISM_ADD(${i})">＋ Wimbo</button></div>${item.songs.length?item.songs.map((v,j)=>`<div class="baptism-song"><select onchange="window.KWAYA_BAPTISM_CHANGE(${i},${j},this.value)">${songOptions(v.id)}</select><select onchange="window.KWAYA_BAPTISM_KEY(${i},${j},this.value)">${keyOpts(v.key)}</select><button class="remove" onclick="window.KWAYA_BAPTISM_REMOVE(${i},${j})">×</button></div>`).join(''):'<div class="baptism-empty">Hakuna wimbo bado. Bonyeza ＋ Wimbo kuongeza bila kikomo.</div>'}</div>`).join('')}\n  window.KWAYA_BAPTISM_ADD=i=>{baptismData[i].songs.push({id:'',title:'',key:''});render()};\n  window.KWAYA_BAPTISM_REMOVE=(i,j)=>{baptismData[i].songs.splice(j,1);render()};\n  window.KWAYA_BAPTISM_CHANGE=(i,j,id)=>{const v=baptismData[i].songs[j];v.id=id;const x=(window.songs||[]).find(s=>String(s.id)===String(id));v.title=x?.title||'';v.key=typeof normKey==='function'?normKey(x?.key_signature):String(x?.key_signature||'').toUpperCase();render()};\n  window.KWAYA_BAPTISM_KEY=(i,j,k)=>{baptismData[i].songs[j].key=typeof normKey==='function'?normKey(k):k;render()};\n  function payload(){return baptismData.map(x=>({name:x.name,songs:x.songs.filter(v=>v.id||v.title).map(v=>({id:v.id||'',title:v.title||'',key:v.key||''}))}))}\n  function restore(){try{const x=(window.programmes||[]).find(p=>String(p.id)===String(window.selectedId));const b=x?.meta?.baptism;if(Array.isArray(b)&&b.length)baptismData=BAPTISM.map(name=>{const z=b.find(v=>v.name===name);return{name,songs:(z?.songs||[]).map(v=>({id:v.id||'',title:v.title||'',key:v.key||''}))}})}catch(e){console.warn('Baptism restore',e)}render()}\n  const oldNew=window.newProgramme;if(oldNew&&!oldNew.__baptismWrapped){window.newProgramme=function(){const r=oldNew.apply(this,arguments);baptismData=BAPTISM.map(name=>({name,songs:[]}));render();return r};window.newProgramme.__baptismWrapped=true}\n  const oldChoose=window.choose;if(oldChoose&&!oldChoose.__baptismWrapped){window.choose=function(){const r=oldChoose.apply(this,arguments);setTimeout(restore,0);return r};window.choose.__baptismWrapped=true}\n  const oldSave=window.saveProgramme;if(oldSave&&!oldSave.__baptismWrapped){window.saveProgramme=async function(){const r=await oldSave.apply(this,arguments);try{if(window.selectedId){const q=await window.db.from('events').select('description').eq('id',window.selectedId).single();if(!q.error){let m={};try{m=JSON.parse(q.data.description||'{}')}catch{}m.baptism=payload();const u=await window.db.from('events').update({description:JSON.stringify(m),updated_at:new Date().toISOString()}).eq('id',window.selectedId);if(u.error)console.warn('Baptism save',u.error)}}}catch(e){console.warn('Baptism save',e)}return r};window.saveProgramme.__baptismWrapped=true}\n  const oldPreview=window.showPreview;if(oldPreview&&!oldPreview.__baptismWrapped){window.showPreview=function(){const r=oldPreview.apply(this,arguments);setTimeout(()=>{if(!isBaptism())return;const col=document.querySelector('#preview .col-right');if(!col)return;const empty=[...col.querySelectorAll('.psec')].find(x=>(x.querySelector('h4')?.textContent||'').trim().toUpperCase()==='UBATIZO');if(empty)empty.remove();const wrap=document.createElement('div');wrap.className='baptism-preview';wrap.innerHTML=payload().map(item=>{const rows=item.songs.map((v,j)=>`<div class="psong"><b>${j+1}.</b> ${esc2(v.title)} ${v.key?`— <span class="key">${esc2(v.key)}</span>`:''}</div>`).join('');return rows?`<div class="psec"><h4>${esc2(item.name)}</h4>${rows}</div>`:''}).join('');if(wrap.innerHTML)col.appendChild(wrap);if(typeof fitOnePage==='function')fitOnePage()},0);return r};window.showPreview.__baptismWrapped=true}\n  function mount(){if(get('baptism-editor')){render();return}const labels=[...document.querySelectorAll('.field label')];const lab=labels.find(x=>(x.textContent||'').trim().toUpperCase()==='TUKIO MAALUM NDANI YA MISA');const field=lab?.parentElement;if(!field)return;const box=document.createElement('div');box.id='baptism-editor';box.className='baptism-editor';field.insertAdjacentElement('afterend',box);document.querySelectorAll('input[type=checkbox]').forEach(x=>x.addEventListener('change',render));render()}\n  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',mount);else mount();\n})();\n</script>\n'''
          s=s.replace('</style>',css+'</style>',1)
          s=s.replace('</body>',js+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mass-programmes.html
          git commit -m 'Add Baptism sections to Mass Programme'
          git push
