name: Update receipt with member photo

on:
  push:
    paths:
      - '.github/workflows/update-receipt-photo.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update contributions receipt
        shell: python
        run: |
          from pathlib import Path
          p = Path('contributions.html')
          s = p.read_text(encoding='utf-8')
          old_css='.receipt{display:none;width:80mm;max-width:80mm;margin:12px auto;padding:10px 8px;border:1px solid #ddd;background:#fff;font-family:Arial,sans-serif;font-size:10.5px}.receipt-head{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:5px;text-align:center}.receipt-logo{width:44px;height:44px;object-fit:contain;display:block;margin:auto}.receipt-title h2{font-size:12.5px;line-height:1.1;margin:0}.receipt-title div{font-size:10px;margin-top:2px}.receipt-title h3{font-size:11px;margin:5px 0 0}.receipt .center{text-align:center}.receipt .line{border-top:1px dashed #777;margin:7px 0}.receipt table{width:100%;font-size:10px}.receipt td{padding:3px 0;border:0;vertical-align:top;white-space:normal}.receipt td:first-child{width:42%}.receipt .total{font-size:14px;font-weight:700}.receipt .thanks{margin-top:7px;font-size:9.5px}'
          new_css='.receipt{display:none;width:86mm;max-width:86mm;min-height:54mm;box-sizing:border-box;margin:8px auto;padding:5px;border:1px solid #ddd;background:#fff;font-family:Arial,sans-serif;font-size:8.5px}.receipt-head{display:grid;grid-template-columns:27px 1fr 27px;align-items:center;gap:3px;text-align:center}.receipt-logo{width:25px;height:25px;object-fit:contain;display:block;margin:auto}.receipt-title h2{font-size:9.5px;line-height:1.05;margin:0}.receipt-title div{font-size:7.5px;margin-top:1px}.receipt-title h3{font-size:8.5px;margin:2px 0 0}.receipt .center{text-align:center}.receipt .line{border-top:1px dashed #777;margin:4px 0}.receipt table{width:100%;font-size:8px}.receipt td{padding:2px 0;border:0;vertical-align:top;white-space:normal}.receipt td:first-child{width:38%}.receipt .total{font-size:11px;font-weight:700}.receipt .thanks{margin-top:4px;font-size:7.5px}.receipt-member{display:flex;align-items:center;gap:5px;margin:4px 0}.receipt-member-photo{width:27px;height:31px;object-fit:cover;border:1px solid #aaa;border-radius:3px;background:#f2f2f2;display:none}.receipt-member-photo.show{display:block}.receipt-member .label{font-size:6.5px;color:#666;font-weight:700}.receipt-member-name{font-size:8.5px;font-weight:700}'
          if old_css in s:
              s=s.replace(old_css,new_css)
          s=s.replace('@page{size:80mm auto;margin:3mm}','@page{size:86mm 54mm;margin:0}')
          s=s.replace('.receipt{display:block!important;width:80mm;max-width:80mm;margin:0 auto;padding:7px 6px;border:0;box-shadow:none}', '.receipt{display:block!important;width:86mm;max-width:86mm;min-height:54mm;margin:0;padding:5px;border:0;box-shadow:none}')
          old_member='<table><tr><td><b>Namba ya Risiti</b></td><td id="rNo"></td></tr><tr><td><b>Jina la Mwimbaji</b></td><td id="rMember"></td></tr><tr><td><b>Mchango</b></td><td id="rType"></td></tr>'
          new_member='<div class="receipt-member"><img id="rPhoto" class="receipt-member-photo" alt="Picha ya Mwimbaji"><div><div class="label">MWIMBAJI</div><div id="rMember" class="receipt-member-name"></div></div></div><table><tr><td><b>Namba ya Risiti</b></td><td id="rNo"></td></tr><tr><td><b>Mchango</b></td><td id="rType"></td></tr>'
          s=s.replace(old_member,new_member)
          s=s.replace("const memberName=m=>[m?.first_name,m?.middle_name,m?.last_name].filter(Boolean).join(' ');function receiptNo", "const memberName=m=>[m?.first_name,m?.middle_name,m?.last_name].filter(Boolean).join(' ');function memberPhoto(m){return m?.photo_url||''}function setReceiptPhoto(m){const el=$('rPhoto');const url=memberPhoto(m);if(url){el.src=url;el.classList.add('show');el.onerror=()=>{el.classList.remove('show');el.removeAttribute('src')}}else{el.classList.remove('show');el.removeAttribute('src')}}function receiptNo")
          s=s.replace("function showReceipt(p){$('rNo').textContent=p.receipt_number||receiptNo(p.id);$('rMember').textContent=memberName(p.members);", "function showReceipt(p){$('rNo').textContent=p.receipt_number||receiptNo(p.id);$('rMember').textContent=memberName(p.members);setReceiptPhoto(p.members);")
          s=s.replace("db.from('members').select('id,first_name,middle_name,last_name,status')", "db.from('members').select('id,first_name,middle_name,last_name,status,photo_url')")
          s=s.replace("members(first_name,middle_name,last_name)", "members(first_name,middle_name,last_name,photo_url)")
          p.write_text(s,encoding='utf-8')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contributions.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add singer photo to contribution receipt"
            git push
          fi
