name: Fix receipt-only thermal print

on:
  push:
    paths:
      - '.github/workflows/update-receipt-photo.yml'
      - '.github/receipt-print-fix.trigger'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix receipt layout
        shell: python
        run: |
          from pathlib import Path
          p = Path('contributions.html')
          s = p.read_text(encoding='utf-8')
          old = '@media print{@page{size:80mm auto;margin:0}html,body{width:80mm!important;min-width:80mm!important;margin:0!important;padding:0!important;background:#fff!important}body *{visibility:hidden!important}#receipt,#receipt *{visibility:visible!important}#receipt{display:block!important;position:absolute!important;left:0!important;top:0!important;width:80mm!important;max-width:80mm!important;height:auto!important;min-height:0!important;margin:0!important;padding:5px!important;border:0!important;box-shadow:none!important;background:#fff!important;box-sizing:border-box!important}#receipt .no-print{display:none!important}}'
          new = '@media print{@page{size:80mm auto;margin:0}html,body{width:80mm!important;min-width:80mm!important;height:auto!important;margin:0!important;padding:0!important;background:#fff!important}body *{visibility:hidden!important}#receipt,#receipt *{visibility:visible!important}#receipt{display:block!important;position:absolute!important;left:0!important;top:0!important;width:80mm!important;max-width:80mm!important;height:auto!important;min-height:0!important;margin:0!important;padding:5px 5px 0!important;border:0!important;box-shadow:none!important;background:#fff!important;box-sizing:border-box!important;overflow:visible!important}#receipt .no-print{display:none!important}}'
          if old not in s:
              raise SystemExit('Expected print CSS not found')
          p.write_text(s.replace(old, new), encoding='utf-8')

      - name: Remove trigger
        run: rm -f .github/receipt-print-fix.trigger

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contributions.html .github/receipt-print-fix.trigger
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix receipt paper length"
            git push
          fi
