name: Final clean mass programme
on:
  push:
    paths:
      - '_final_mass_trigger.txt'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix main file
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('mass-programmes.html')
          s=p.read_text(encoding='utf-8')
          # Remove accidental repeated n's from visible markup/text only.
          s=re.sub(r'(?i)(?<![A-Za-z])n{4,}(?![A-Za-z])','',s)
          # Add a final, self-contained conductor renderer for the main file.
          marker='<!-- FINAL-MASS-CONDUCTOR-FIX -->'
          if marker not in s:
            patch=r'''\n<!-- FINAL-MASS-CONDUCTOR-FIX -->\n<style>\n@media print{.conductor-print{display:block!important;visibility:visible!important;color:#000!important;font-size:11pt!important;font-weight:700!important;line-height:1.15!important;text-align:center!important;margin:3mm 0 4mm!important;padding:2mm 0!important;border-top:1px solid #777!important;border-bottom:1px solid #777!important;break-inside:avoid!important;page-break-inside:avoid!important}}\n</style>\n<script>\n(function(){\n function conductorNames(){\n  var a=[];\n  document.querySelectorAll('#conductors .chip').forEach(function(e){var t=(e.textContent||'').replace(/^[×x+]\\s*/,'').trim();if(t&&!a.includes(t))a.push(t)});\n  var i=document.getElementById('conductor');\n  if(i&&i.value.trim()&&!a.includes(i.value.trim()))a.push(i.value.trim());\n  try{if(Array.isArray(conductors))conductors.forEach(function(t){t=String(t||'').trim();if(t&&!a.includes(t))a.push(t)})}catch(e){}\n  return a;\n }\n function renderConductor(){\n  var p=document.getElementById('preview');if(!p)return;\n  var a=conductorNames();\n  var e=p.querySelector('.conductor-print');\n  if(!e){e=document.createElement('div');e.className='conductor-print';var h=p.querySelector('.printhead');if(h&&h.parentNode)h.parentNode.insertBefore(e,h.nextSibling);else p.insertBefore(e,p.firstChild)}\n  e.innerHTML='<b>WAONGOZA NYIMBO:</b> '+(a.length?a.join(' • '):'—');\n  e.hidden=false;e.style.display='block';e.style.visibility='visible';\n }\n function wrap(n){if(typeof window[n]!=='function'||window[n].__finalMassFix)return;var f=window[n];function w(){var r=f.apply(this,arguments);setTimeout(renderConductor,0);setTimeout(renderConductor,120);return r}w.__finalMassFix=true;window[n]=w}\n function install(){['addConductor','removeConductor','showPreview','printProgramme'].forEach(wrap);renderConductor()}\n document.addEventListener('DOMContentLoaded',function(){install();setTimeout(install,300);setTimeout(renderConductor,800)});\n window.addEventListener('beforeprint',function(){install();renderConductor()});\n})();\n</script>\n'''
            s=s.replace('</body>',patch+'</body>')
          p.write_text(s,encoding='utf-8')
          PY
          rm -f _final_mass_trigger.txt
          rm -f .github/workflows/final-clean-mass.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mass-programmes.html .github/workflows/final-clean-mass.yml _final_mass_trigger.txt
          git commit -m 'Fix conductor display and remove accidental text from mass programme'
          git push
