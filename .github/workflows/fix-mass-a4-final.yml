name: Apply Mass Programme A4 Final

on:
  push:
    branches:
      - main
    paths-ignore:
      - mass-programmes.html
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply A4 typography and layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('mass-programmes.html')
          s = p.read_text(encoding='utf-8')

          # Keep the approved A4 typography.
          for old,new in [
            ('.a4-paper .ptitle{font-size:32px!important;', '.a4-paper .ptitle{font-size:26px!important;'),
            ('.a4-paper .ptitle{font-size:28px!important;', '.a4-paper .ptitle{font-size:26px!important;'),
            ('.a4-paper h4{font-size:28px!important;', '.a4-paper h4{font-size:22px!important;'),
            ('.a4-paper h4{font-size:24px!important;', '.a4-paper h4{font-size:22px!important;'),
            ('.a4-paper .previewSong{font-size:28px!important;', '.a4-paper .previewSong{font-size:22px!important;'),
            ('.a4-paper .previewSong{font-size:24px!important;', '.a4-paper .previewSong{font-size:22px!important;'),
            ('.a4-paper .notes{font-size:28px!important;', '.a4-paper .notes{font-size:22px!important;'),
            ('.a4-paper .notes{font-size:24px!important;', '.a4-paper .notes{font-size:22px!important;')
          ]:
              s = s.replace(old,new)

          # Add a professional two-side-logo A4 header.
          old_logo_css = '.a4-paper .logo{width:16mm!important;height:16mm!important;margin:0 auto 1mm!important}'
          new_logo_css = '''.a4-paper .a4-header{display:grid!important;grid-template-columns:22mm 1fr 22mm!important;align-items:center!important;gap:3mm!important;margin:0 0 2mm!important}
          .a4-paper .a4-header-logo{width:18mm!important;height:18mm!important;object-fit:contain!important;display:block!important;margin:auto!important}
          .a4-paper .a4-header-center{text-align:center!important;min-width:0!important}
          .a4-paper .a4-header-name{font-size:26px!important;font-weight:900!important;line-height:1.05!important;text-transform:uppercase!important;margin:0!important}
          .a4-paper .a4-header-title{font-size:22px!important;font-weight:900!important;line-height:1.08!important;text-transform:uppercase!important;margin:1mm 0 0!important}
          .a4-paper .a4-header-year{font-size:22px!important;font-weight:900!important;line-height:1.08!important;text-transform:uppercase!important;margin:.5mm 0 0!important}
          .a4-paper .a4-conductors{display:flex!important;justify-content:center!important;gap:8mm!important;flex-wrap:wrap!important;font-size:22px!important;font-weight:700!important;line-height:1.1!important;margin:0 0 2mm!important}
          .a4-paper .a4-conductor{white-space:nowrap!important}
          .a4-paper .a4-meta{font-size:8px!important;line-height:1.1!important;text-align:center!important;margin:0 0 1.5mm!important}
          .a4-paper .a4-song-row{display:grid!important;grid-template-columns:minmax(0,1fr) auto!important;align-items:baseline!important;gap:5mm!important;width:100%!important}
          .a4-paper .a4-song-title{min-width:0!important}
          .a4-paper .a4-song-key{font-size:22px!important;font-weight:900!important;white-space:nowrap!important;text-align:right!important}
          .a4-paper .a4-song-no{font-weight:900!important}
          .a4-paper .logo{display:none!important}'''
          if old_logo_css in s and '.a4-header{' not in s:
              s = s.replace(old_logo_css, new_logo_css)

          # Ensure the non-print A4 defaults also understand the new header/key rows.
          old_base = '.a4-paper .logo{display:block;width:28mm;height:28mm;object-fit:contain;margin:0 auto 4mm}.a4-paper .ptitle{text-align:center;font-weight:900;font-size:20px;line-height:1.25;text-transform:uppercase}'
          new_base = '.a4-paper .logo{display:none}.a4-paper .a4-header{display:grid;grid-template-columns:22mm 1fr 22mm;align-items:center;gap:3mm;margin:0 0 4mm}.a4-paper .a4-header-logo{width:18mm;height:18mm;object-fit:contain;display:block;margin:auto}.a4-paper .a4-header-center{text-align:center}.a4-paper .a4-header-name{font-size:20px;font-weight:900;line-height:1.15;text-transform:uppercase}.a4-paper .a4-header-title{font-size:17px;font-weight:900;line-height:1.15;text-transform:uppercase;margin-top:1mm}.a4-paper .a4-header-year{font-size:17px;font-weight:900;line-height:1.15;text-transform:uppercase;margin-top:.5mm}.a4-paper .a4-conductors{display:flex;justify-content:center;gap:8mm;flex-wrap:wrap;font-size:16px;font-weight:700;line-height:1.2;margin:0 0 3mm}.a4-paper .a4-conductor{white-space:nowrap}.a4-paper .a4-meta{font-size:10px;line-height:1.3;text-align:center;margin:0 0 3mm}.a4-paper .a4-song-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;gap:5mm;width:100%}.a4-paper .a4-song-title{min-width:0}.a4-paper .a4-song-key{font-size:inherit;font-weight:900;white-space:nowrap;text-align:right}.a4-paper .a4-song-no{font-weight:900}.a4-paper .ptitle{text-align:center;font-weight:900;font-size:20px;line-height:1.25;text-transform:uppercase}'
          if old_base in s and '.a4-header{' not in s:
              s = s.replace(old_base, new_base)

          # Replace the song renderer so the Key sits on the right of the song name.
          old_song = "function displaySong(item,i){const t=songTitle(item);const k=songKey(item);return `<div class=\"previewSong\"><b>${i+1}.</b> ${esc(t)}${k?` <span class=\"badge\">Key: ${esc(k)}</span>`:''}</div>`}"
          new_song = "function displaySong(item,i){const t=songTitle(item);const k=songKey(item);return `<div class=\"previewSong a4-song-row\"><span class=\"a4-song-title\"><span class=\"a4-song-no\">${i+1}.</span> ${esc(t)}</span><span class=\"a4-song-key\">${k?esc(k):''}</span></div>`}"
          if old_song in s:
              s = s.replace(old_song,new_song)

          # Replace the A4 header with two logos, centered title/year, conductors and metadata.
          old_header_start = '<img class="logo" src="${LOGO}" alt="Kwaya ya Kristo Mfalme"><div class="ptitle">KWAYA YA KRISTO MFALME</div><div class="sub"><b>KASULU - KIGOMA/TANZANIA</b><br><b>MPANGO WA MISA</b><br>${esc(m.type===\'sunday\'?`${m.sunday_no||\'Dominika\'} — Mwaka ${m.liturgical_year||\'\'}`:(m.celebration_name||m.other_name||\'Misa\'))}<br>📅 ${esc(row.event_date||\'—\')} · ⏰ ${esc((row.start_time||\'\').slice(0,5)||\'—\')} · 📍 ${esc(row.location||\'—\')}<br>🎼 Conductor 1: ${esc(m.conductor1||row.conductor1||\'—\')} · Conductor 2: ${esc(m.conductor2||row.conductor2||\'—\')}</div>'
          new_header_start = '<div class="a4-header"><img class="a4-header-logo" src="${LOGO}" alt="Kwaya ya Kristo Mfalme"><div class="a4-header-center"><div class="a4-header-name">KWAYA YA KRISTU MFALME</div><div class="a4-header-title">MPANGO WA MISA YA ${esc(m.type===\'sunday\'?(m.sunday_no||\'DOMINIKA\'):(m.celebration_name||m.other_name||\'MISA\'))}</div><div class="a4-header-year">MWAKA ${esc(m.liturgical_year||\'\')}</div></div><img class="a4-header-logo" src="${LOGO}" alt="Kwaya ya Kristo Mfalme"></div><div class="a4-conductors">${m.conductor1||row.conductor1?`<span class="a4-conductor">Conductor 1: ${esc(m.conductor1||row.conductor1)}</span>`:``}${m.conductor2||row.conductor2?`<span class="a4-conductor">Conductor 2: ${esc(m.conductor2||row.conductor2)}</span>`:``}</div><div class="a4-meta"><b>KASULU - KIGOMA/TANZANIA</b> · 📅 ${esc(row.event_date||\'—\')} · ⏰ ${esc((row.start_time||\'\').slice(0,5)||\'—\')} · 📍 ${esc(row.location||\'—\')}</div>'
          if old_header_start in s:
              s = s.replace(old_header_start,new_header_start)

          p.write_text(s, encoding='utf-8')
          print('Mass Programme A4 updated: side logos, centered title/year, visible conductors, and right-aligned song keys.')
          PY

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mass-programmes.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Improve Mass Programme A4 header and song key display'
          git push
