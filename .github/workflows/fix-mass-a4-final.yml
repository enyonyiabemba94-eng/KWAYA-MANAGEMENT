name: Apply Mass Programme A4 Final

on:
  push:
    branches:
      - main
    paths-ignore:
      - mass-programmes.html
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix one-page A4 print layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('mass-programmes.html')
          s = p.read_text(encoding='utf-8')
          marker = 'MASS_A4_ONE_PAGE_FINAL_V4'
          if marker not in s:
              css = '''\n/* MASS_A4_ONE_PAGE_FINAL_V4 */\n@page{size:A4 portrait;margin:0}\n@media print{\nhtml,body{width:210mm!important;height:297mm!important;margin:0!important;padding:0!important;overflow:hidden!important;background:#fff!important}\nbody *{visibility:hidden!important}\n.a4-overlay,.a4-overlay *{visibility:visible!important}\n.a4-overlay{position:fixed!important;inset:0!important;display:block!important;width:210mm!important;height:297mm!important;padding:0!important;margin:0!important;overflow:hidden!important;background:#fff!important}\n.a4-paper{width:210mm!important;height:297mm!important;min-height:297mm!important;max-height:297mm!important;margin:0!important;padding:6mm 7mm!important;box-sizing:border-box!important;overflow:hidden!important;box-shadow:none!important;border:0!important;page-break-before:avoid!important;page-break-after:avoid!important;break-before:avoid!important;break-after:avoid!important}\n.a4-paper .logo{width:16mm!important;height:16mm!important;margin:0 auto 1mm!important}\n.a4-paper .ptitle{font-size:13px!important;line-height:1.05!important;margin:0 0 1mm!important}\n.a4-paper .sub{font-size:7px!important;line-height:1.1!important;margin:0 0 1.5mm!important}\n.a4-paper h4{font-size:7.5px!important;line-height:1.05!important;margin:1mm 0 .4mm!important;padding:1mm!important}\n.a4-paper .previewSong{font-size:6.8px!important;line-height:1.08!important;margin:.3mm 0!important}\n.a4-paper .notes{font-size:6.5px!important;line-height:1.1!important}\n.a4-footer{font-size:5.5px!important;margin-top:1mm!important;padding-top:1mm!important}\n.a4-toolbar,.a4-paper button{display:none!important}\n.a4-paper .a4-content{column-count:2!important;column-gap:5mm!important}\n.a4-paper .a4-section{break-inside:avoid!important;page-break-inside:avoid!important}\n}\n'''
              if '</style>' in s:
                  s = s.replace('</style>', css + '</style>', 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mass-programmes.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Apply final one-page A4 Mass Programme layout'
          git push
