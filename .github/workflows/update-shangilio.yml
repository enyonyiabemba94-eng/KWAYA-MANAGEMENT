name: Update Shangilio Liturgical Settings

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update songs.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('songs.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
            'Vichujio vya Zaburi — Kalenda ya Kanisa Katoliki': 'Vichujio vya Zaburi na Shangilio — Kalenda ya Kanisa Katoliki',
            'Taarifa za Zaburi na Kalenda ya Liturujia': 'Taarifa za Zaburi / Shangilio na Kalenda ya Liturujia',
            "const on=$('cat').value==='Zaburi'": "const on=['Zaburi','Shangilio'].includes($('cat').value)",
            "const on=$('category').value==='Zaburi';": "const on=['Zaburi','Shangilio'].includes($('category').value);",
            "const isZ=$('category').value==='Zaburi',o=": "const isLit=['Zaburi','Shangilio'].includes($('category').value),o=",
            'x.category===\'Zaburi\'?[x.liturgical_period,x.sunday_name,x.liturgical_year]': "['Zaburi','Shangilio'].includes(x.category)?[x.liturgical_period,x.sunday_name,x.liturgical_year]",
            "x.category==='Zaburi'?[x.liturgical_period,x.sunday_name,x.liturgical_year]": "['Zaburi','Shangilio'].includes(x.category)?[x.liturgical_period,x.sunday_name,x.liturgical_year]",
          }
          for a,b in replacements.items():
            s=s.replace(a,b)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add songs.html
          git diff --cached --quiet || git commit -m "Add liturgical settings for Shangilio"
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/update-shangilio.yml
          git commit -m "Remove temporary Shangilio updater"
          git push
