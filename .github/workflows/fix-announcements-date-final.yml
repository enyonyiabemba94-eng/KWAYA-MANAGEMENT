name: Final fix announcement dates
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-announcements-date-final.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix announcement date parser
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('announcements.html')
          s=p.read_text(encoding='utf-8')

          # Replace the broken formatter wherever it exists. The old code
          # split an ISO timestamp at '-' and tried Number('04T00:00:00...'),
          # which produces NaN and therefore Invalid Date.
          pattern=r'function\s+formatDisplayDate\s*\(value\)\s*\{.*?\n\s*\}\s*'
          replacement='''function formatDisplayDate(value){
              if(!value) return "Tarehe haijawekwa";
              const raw=String(value).trim();
              const match=raw.match(/^(\\d{4})-(\\d{2})-(\\d{2})/);
              if(match){
                  const d=new Date(Number(match[1]),Number(match[2])-1,Number(match[3]));
                  return d.toLocaleDateString("sw-TZ",{day:"2-digit",month:"long",year:"numeric"});
              }
              const d=new Date(raw);
              if(Number.isNaN(d.getTime())) return "Tarehe haijawekwa";
              return d.toLocaleDateString("sw-TZ",{day:"2-digit",month:"long",year:"numeric"});
          }
          '''
          s2,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n==0:
              # Fallback: override the global formatter even if the source
              # layout differs from the expected function block.
              inject='''\n<script>\nwindow.formatDisplayDate=function(value){\n  if(!value) return "Tarehe haijawekwa";\n  const raw=String(value).trim();\n  const m=raw.match(/^(\\d{4})-(\\d{2})-(\\d{2})/);\n  if(m) return new Date(Number(m[1]),Number(m[2])-1,Number(m[3])).toLocaleDateString("sw-TZ",{day:"2-digit",month:"long",year:"numeric"});\n  const d=new Date(raw);\n  return Number.isNaN(d.getTime()) ? "Tarehe haijawekwa" : d.toLocaleDateString("sw-TZ",{day:"2-digit",month:"long",year:"numeric"});\n};\n</script>\n'''
              pos=s.lower().rfind('</body>')
              s=s[:pos]+inject+s[pos:] if pos>=0 else s+inject
          else:
              s=s2
          p.write_text(s,encoding='utf-8')
          print('formatter replacements:',n)
          PY
      - name: Commit fixed page
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add announcements.html
          git diff --cached --quiet || (git commit -m 'Fix announcement date rendering' && git push)
