name: Final fix announcement dates

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-announcements-date-final.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Replace announcement date formatter safely
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('announcements.html')
          s = p.read_text(encoding='utf-8')

          start = s.find('function formatDisplayDate')
          if start < 0:
              raise SystemExit('formatDisplayDate function not found')

          marker = 'function formatDisplayDate'
          next_function = s.find('\nfunction ', start + len(marker))
          if next_function < 0:
              raise SystemExit('end marker for formatDisplayDate not found')

          replacement = '''function formatDisplayDate(value){
              if(!value) return "Tarehe haijawekwa";
              const raw = String(value).trim();
              const m = raw.match(/^(\\d{4})-(\\d{2})-(\\d{2})/);
              if(m){
                  const d = new Date(Number(m[1]), Number(m[2])-1, Number(m[3]));
                  return d.toLocaleDateString("sw-TZ", {day:"2-digit", month:"long", year:"numeric"});
              }
              const d = new Date(raw);
              if(Number.isNaN(d.getTime())) return "Tarehe haijawekwa";
              return d.toLocaleDateString("sw-TZ", {day:"2-digit", month:"long", year:"numeric"});
          }

          '''

          s = s[:start] + replacement + s[next_function+1:]
          p.write_text(s, encoding='utf-8')
          print('Announcement date formatter replaced successfully.')
          PY

      - name: Verify formatter
        run: |
          grep -A15 -B2 'function formatDisplayDate' announcements.html
          ! grep -q 'parts\[2\]' announcements.html

      - name: Commit fixed page
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add announcements.html
          git diff --cached --quiet || (git commit -m 'Fix announcement date rendering' && git push)
