name: Repair attendance layout once
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair attendance.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('attendance.html')
          s=p.read_text(encoding='utf-8')
          # Remove the two known extra closing divs introduced around branding.
          s=s.replace('</div></aside><header class="top">','</aside><header class="top">',1)
          s=s.replace('</div></div><div class="table-wrap" id="tableBox">','</div><div class="table-wrap" id="tableBox">',1)
          # Remove obsolete branding CSS/markup classes while keeping the standard branding block.
          import re
          s=re.sub(r'\.choir-final-brand\{.*?(?=\/\* KWAYA STANDARD BRANDING \*\/)', '', s, count=1, flags=re.S)
          s=s.replace('/* FINAL KWAYA LAYOUT */','')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add attendance.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix attendance HTML layout and branding"
          git push