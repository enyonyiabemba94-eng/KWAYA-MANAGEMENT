name: Fix Reports Logo

on:
  push:
    paths:
      - '.github/workflows/fix-reports-logo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize reports logos
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('reports.html')
          s = p.read_text(encoding='utf-8')
          old = 'https://raw.githubusercontent.com/enyonyiabemba94-eng/KWAYA-MANAGEMENT/main/KWAYA%20YA%20KRISTO%20MFALME%20NYARUGUSU%2020260902_141303.jpg'
          new = 'https://raw.githubusercontent.com/enyonyiabemba94-eng/KWAYA-MANAGEMENT/main/KWAYA%20YA%20KRISTO%20MFALME%20NYARUGUSU%2020260902_141303.jpg?raw=1'
          if old in s:
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports.html
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'Fix reports logo image URL'
            git push
          fi
