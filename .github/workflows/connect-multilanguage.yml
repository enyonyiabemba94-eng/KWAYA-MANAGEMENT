name: Connect Multilingual System

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect i18n to HTML pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          changed=[]
          for p in Path('.').glob('*.html'):
              s=p.read_text(encoding='utf-8')
              if 'src="./i18n.js"' in s or "src='./i18n.js'" in s:
                  continue
              if '</head>' not in s.lower():
                  continue
              pos=s.lower().find('</head>')
              s=s[:pos]+'<script src="./i18n.js"></script>'+s[pos:]
              p.write_text(s,encoding='utf-8')
              changed.append(str(p))
          print('Connected:', ', '.join(changed) if changed else 'none')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then
            echo "No HTML changes needed."
          else
            git commit -m "Connect multilingual language system to app pages"
            git push
          fi