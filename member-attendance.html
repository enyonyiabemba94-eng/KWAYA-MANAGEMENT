<!doctype html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mahudhurio ya Kwaya | Mwimbaji</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./auth-guard.js"></script><script src="./i18n.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f5f6fa;color:#1f2937;font-family:Arial,sans-serif}.top{background:linear-gradient(135deg,#18122b,#4c1d95);color:#fff;padding:16px}.bar{max-width:900px;margin:auto;display:flex;align-items:center;gap:12px}.bar h1{font-size:18px;margin:0;flex:1}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer}.back{background:#fff;color:#4c1d95}.download{background:#16a34a;color:#fff}.wrap{max-width:900px;margin:auto;padding:15px}.hero,.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:16px;margin-bottom:14px}.hero{background:linear-gradient(135deg,#4c1d95,#7c3aed);color:#fff}.hero h2{margin:0 0 5px;font-size:20px}.hero p{margin:0;color:#ede9fe;font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:13px;text-align:center}.stat strong{display:block;font-size:22px;color:#4c1d95}.stat span{font-size:10px;color:#6b7280}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.toolbar input{padding:10px;border:1px solid #ddd;border-radius:9px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{padding:10px 8px;border-bottom:1px solid #eee;text-align:left;font-size:12px}th{background:#f8f7ff;color:#312e81}.status{font-weight:800}.present{color:#15803d}.absent{color:#b91c1c}.sick{color:#a16207}.permission{color:#1d4ed8}.empty{text-align:center;color:#9ca3af;padding:25px;font-size:12px}@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}.bar h1{font-size:15px}.download{width:100%}}@media print{.no-print{display:none!important}body{background:#fff}.wrap{padding:0}.hero{color:#000;background:#fff;border:0;padding:5px 0}.card{border:0;padding:5px}table{min-width:0}th,td{font-size:10px;padding:6px}}
</style></head><body><header class="top"><div class="bar"><button class="btn back" onclick="location.href='member-dashboard.html'">← Rudi</button><h1>📋 Mahudhurio ya Kwaya</h1><button class="btn download" onclick="downloadPDF()">📥 Pakua PDF</button></div></header><main class="wrap"><section class="hero"><h2 id="memberName">Mahudhurio ya Kwaya</h2><p>Mahudhurio yako yanaonekana moja kwa moja; pia unaweza kuona rekodi za waimbaji wote.</p></section><section class="stats"><div class="stat"><strong id="total">0</strong><span>Vipindi vyote</span></div><div class="stat"><strong id="mine">0</strong><span>Yangu</span></div><div class="stat"><strong id="present">0%</strong><span>Asilimia yangu</span></div><div class="stat"><strong id="members">0</strong><span>Waimbaji</span></div></section><section class="card"><div class="toolbar no-print"><input id="search" placeholder="Tafuta mwimbaji au shughuli..."><button class="btn" onclick="loadAttendance()">Refresh</button></div><div class="table-wrap"><table><thead><tr><th>Tarehe</th><th>Shughuli</th><th>Jina la Mwimbaji</th><th>Hali</th></tr></thead><tbody id="rows"><tr><td colspan="4" class="empty">Inapakia...</td></tr></tbody></table></div></section></main><script>const db=supabase.createClient('https://xulnkdrgjgajmcqntwga.supabase.co','sb_publishable_J2OrXvOnQXxrf5t3XPmigg_5ULrsWO2');let records=[],currentUser=null;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]));const statusClass=s=>{s=String(s||'').toLowerCase();return s.includes('present')||s==='po'||s==='yes'?'present':s.includes('sick')||s.includes('mgonjwa')?'sick':s.includes('permission')||s.includes('ruhusa')?'permission':'absent'};function dateSW(d){return d?new Date(d+'T00:00:00').toLocaleDateString('sw-TZ',{day:'2-digit',month:'short',year:'numeric'}):'—'}async function loadAttendance(){const {data:{session}}=await db.auth.getSession();if(!session){location.href='login.html';return}currentUser=session.user.id;const [p,r,m]=await Promise.all([db.from('profiles').select('full_name,member_id').eq('id',session.user.id).maybeSingle(),db.from('attendance_records').select('member_id,status,session_id,marked_at,attendance_sessions(attendance_date,title,activity_type)').order('marked_at',{ascending:false}).limit(5000),db.from('members').select('id,first_name,middle_name,last_name').order('first_name')]);if(p.data)$('memberName').textContent='Mahudhurio — '+(p.data.full_name||'Mwimbaji');const names={};(m.data||[]).forEach(x=>names[x.id]=[x.first_name,x.middle_name,x.last_name].filter(Boolean).join(' '));records=(r.data||[]).map(x=>({...x,name:names[x.member_id]||'Mwimbaji'}));const my=p.data?.member_id;const mine=records.filter(x=>x.member_id===my);const pres=mine.filter(x=>statusClass(x.status)==='present').length;$('total').textContent=new Set(records.map(x=>x.session_id)).size;$('mine').textContent=mine.length;$('present').textContent=mine.length?Math.round(pres/mine.length*100)+'%':'—';$('members').textContent=new Set(records.map(x=>x.member_id)).size;render()}function render(){const q=($('search').value||'').toLowerCase();const rows=records.filter(x=>[x.name,x.status,x.attendance_sessions?.title,x.attendance_sessions?.activity_type].some(v=>String(v||'').toLowerCase().includes(q)));$('rows').innerHTML=rows.length?rows.map(x=>{const c=statusClass(x.status);return '<tr><td>'+esc(dateSW(x.attendance_sessions?.attendance_date))+'</td><td>'+esc(x.attendance_sessions?.title||x.attendance_sessions?.activity_type||'Mahudhurio')+'</td><td><b>'+esc(x.name)+'</b></td><td class="status '+c+'">'+esc(x.status||'—')+'</td></tr>'}).join(''):'<tr><td colspan="4" class="empty">Hakuna rekodi inayolingana.</td></tr>'}function downloadPDF(){window.print()}$('search').addEventListener('input',render);loadAttendance().catch(e=>{$('rows').innerHTML='<tr><td colspan="4" class="empty">Hitilafu: '+esc(e.message)+'</td></tr>'});</script></body></html
